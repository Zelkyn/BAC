function exporterDonnees(){
  const b = new Blob([JSON.stringify(perso, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "bac-francais-mes-donnees.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importerDonnees(inp){
  const f = inp.files && inp.files[0];
  inp.value = "";
  if (!f) return;
  if (f.size > 8e6) return msgCompte("Fichier trop volumineux.", true);
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (e) { return msgCompte("Ce fichier n'est pas un export valide.", true); }
    if (!d || !Array.isArray(d.textes)) return msgCompte("Ce fichier n'est pas un export valide.", true);
    if (!confirm("Remplacer tes textes, auteurs et œuvres actuels par ceux du fichier ?")) return;
    perso = normPerso(d); enregistrer(); msgCompte("Import terminé.");
  };
  r.readAsText(f);
}
function reinitialiserDonnees(){
  if (!confirm("Effacer tous tes textes, auteurs et œuvres personnalisés ? Pense à exporter tes données avant.")) return;
  perso = persoVide(); enregistrer(); msgCompte("Données effacées.");
}

function fcOpen(chapitreId, section, titre) {

  fcDeck = shuffle(fcDeck);

  const titreSection = titre ? titre
    : section === "_all" ? "Tout le chapitre"
    : section.includes(".") ? "Partie " + section
    : "Partie " + section + " — tout";
  document.getElementById("fc-title").textContent = titre

    : "Flashcards · " + chapitreId.charAt(0).toUpperCase() + chapitreId.slice(1).replace(/_/g," ") + " · " + titreSection;

function collectAll(obj) {
  let cards = [];
  for (const key in obj) {
    if (Array.isArray(obj[key])) {
      cards = cards.concat(obj[key]);
    } else if (typeof obj[key] === "object") {
      cards = cards.concat(collectAll(obj[key]));
    }
  }
  return cards;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fcRender() {

  document.getElementById("fc-counter").textContent = (fcIndex + 1) + " / " + fcDeck.length;

const normTxt = t => (t||"").replace(/[\s\S]/g, c => (c.normalize("NFD")[0] || c).toLowerCase()[0]);
const escTxt = t => (t||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);

function buildSearchIndex(){

        texte = corps.textContent.replace(/\s+/g, " ").trim();

    });

function extrait(e, mots){
  const pos = mots.map(w => e.nTexte.indexOf(w)).filter(i => i >= 0);
  if (!pos.length) return e.type === "Matière" ? escTxt(e.texte) : "";
  const p = Math.min(...pos);
  const debut = Math.max(0, p - 70), fin = Math.min(e.texte.length, p + 130);
  let html = "", i = debut;
  const nPart = e.nTexte.slice(debut, fin);
  const marques = [];
  mots.forEach(w => { let j = nPart.indexOf(w); while (j >= 0) { marques.push([debut + j, debut + j + w.length]); j = nPart.indexOf(w, j + w.length); } });
  marques.sort((a, b) => a[0] - b[0]).forEach(([a, b]) => {
    if (a < i) return;
    html += escTxt(e.texte.slice(i, a)) + "<b>" + escTxt(e.texte.slice(a, b)) + "</b>";
    i = b;
  });
  html += escTxt(e.texte.slice(i, fin));
  return (debut > 0 ? "… " : "") + html + (fin < e.texte.length ? " …" : "");
}
function resultatsRecherche(q){

    .sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.e);
  if (!res.length) return `<p class="search-vide">Aucun résultat pour « ${escTxt(q)} ».</p>`;
  return res.map(e => `
      <div class="card" onclick="${e.ouvrir}">

}

  const groupes = [];
  root.querySelectorAll(".accord-section, .accord-sub").forEach(g => {
    if (g.classList.contains("obj-section")) return;
    const blocs = [...g.querySelectorAll(".accord-block")].filter(b => b.parentElement.closest(".accord-sub, .accord-section") === g);
    if (!blocs.length) return;
    const titre = objTexte(g.querySelector(":scope > .accord-h1 span, :scope > .accord-h2 span"));
    const items = [];
    blocs.forEach(b => objItemsBloc(b, titre).forEach(x => { if (!items.includes(x)) items.push(x); }));
    if (g.querySelector(".fc-btn")) items.push("Réussir les flashcards de cette partie");
    if (items.length) groupes.push({ titre, items });
  });
  const libres = [...root.querySelectorAll(".accord-block")].filter(b => !b.parentElement.closest(".accord-sub, .accord-section"));
  if (libres.length){ const items = []; libres.forEach(b => objItemsBloc(b, "").forEach(x => { if (!items.includes(x)) items.push(x); })); if (root.querySelector(".fc-btn")) items.push("Réussir les flashcards de la fiche"); if (items.length) groupes.unshift({ titre: "", items }); }
  return groupes;
}
function objLire(id){try{return JSON.parse(localStorage.getItem("objectifs:" + id) || "[]");}catch(e){return [];}}
function objEcrire(id, l){try{localStorage.setItem("objectifs:" + id, JSON.stringify(l));}catch(e){}}
function objEsc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function objectifsHTML(id, groupes){
  const faits = objLire(id);
  let n = 0, ok = 0, corps = "";
  groupes.forEach(g => {
    corps += `<div class="obj-groupe">${g.titre ? `<div class="obj-titre">${objEsc(g.titre)}</div>` : ""}`;
    g.items.forEach(x => { const k = g.titre + "|" + x, c = faits.includes(k); n++; if (c) ok++; corps += `<label class="obj-item${c ? " ok" : ""}"><input type="checkbox" class="obj-cb" data-fiche="${objEsc(id)}" data-k="${objEsc(k)}"${c ? " checked" : ""}><span>${objEsc(x)}</span></label>`; });
    corps += `</div>`;
  });
  return `<div class="accord-section obj-section"><button type="button" class="accord-h1" onclick="toggleAccord(this)" aria-expanded="false"><span>🎯 Objectifs d'apprentissage <span class="obj-prog">${ok} / ${n}</span></span><span class="accord-chevron">▼</span></button><div class="accord-content"><div class="accord-body-inner"><p class="obj-aide">Coche chaque objectif quand tu sais le faire sans regarder la fiche. Ta progression est enregistrée sur cet appareil.</p><div class="obj-barre"><i style="width:${n ? Math.round(100 * ok / n) : 0}%"></i></div>${corps}<button type="button" class="obj-raz" onclick="objRaz(this)">Tout décocher</button></div></div></div>`;
}
function objMaj(sec){
  const cbs = [...sec.querySelectorAll(".obj-cb")], ok = cbs.filter(c => c.checked).length;
  sec.querySelector(".obj-prog").textContent = ok + " / " + cbs.length;
  sec.querySelector(".obj-barre i").style.width = (cbs.length ? Math.round(100 * ok / cbs.length) : 0) + "%";
  if (cbs.length) objEcrire(cbs[0].dataset.fiche, cbs.filter(c => c.checked).map(c => c.dataset.k));
}
function objRaz(btn){const sec = btn.closest(".obj-section"); sec.querySelectorAll(".obj-cb").forEach(c => { c.checked = false; c.parentElement.classList.remove("ok"); }); objMaj(sec);}
document.addEventListener("change", e => { const c = e.target.closest(".obj-cb"); if (!c) return; c.parentElement.classList.toggle("ok", c.checked); objMaj(c.closest(".obj-section")); });
function ajouterObjectifs(f){
  const zone = document.getElementById("content").firstElementChild;
  if (!zone || !f.content) return;
  const racine = zone.querySelector(".fiche-ses") || zone;
  const groupes = f.objectifs || objDepuisDom(racine);
  if (!groupes.length) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = objectifsHTML(f.id, groupes);
  const intro = racine.querySelector(":scope > .aretenir, :scope > .fr-meta, :scope > .fr-intro");
  let apres = intro;
  while (apres && apres.nextElementSibling && apres.nextElementSibling.matches(".perso-desc, .problematique, .fr-intro, .aretenir, .accord-fc-row")) apres = apres.nextElementSibling;
  if (apres) apres.after(tmp.firstElementChild); else racine.prepend(tmp.firstElementChild);
}
function ouvrirFiche(matiereId, ficheId){
  const m = matieres.find(x => x.id === matiereId);
  if(!m) return;
  const f = m.fiches.find(x => x.id === ficheId);
  if(!f) return;
  brouillon = null;
  afficherViewer(f.title);
  document.getElementById("content").innerHTML =
    `<div style="width:100%;max-width:760px;">
       ${f.content
         ? f.content
         : `<p class="empty-msg">Aucun contenu pour le moment…</p>`}
     </div>`;
  ajouterObjectifs(f);
}
function back(){
  if (brouillon && brouillon.modifie && !confirm("Quitter sans enregistrer tes modifications ?")) return;
  if (brouillon && document.getElementById("page-title").textContent.startsWith("Modifier")){ const { type, id } = brouillon; brouillon = null; return ouvrirFiche(type, PERSO_PREFIXE[type] + id); }
  brouillon = null;
  if(currentMatiere && document.getElementById("page-title").textContent !== currentMatiere.title){
    ouvrirMatiere(currentMatiere.id);
  } else {
    currentMatiere = null;
    pageCompte = false;
    renderHome();
    document.getElementById("viewer").style.display = "none";
    document.getElementById("home").style.display   = "flex";
    document.getElementById("backContainer").classList.remove("visible");
    document.getElementById("page-title").textContent = "";
    window.scrollTo(0,0);
  }
}
function afficherViewer(titre){
  document.getElementById("home").style.display   = "none";
  document.getElementById("viewer").style.display = "block";
  document.getElementById("backContainer").classList.add("visible");
  document.getElementById("page-title").textContent = parseur.parseFromString(String(titre), "text/html").body.textContent;
  pageCompte = false;
  window.scrollTo(0,0);
}
let nightManual = store.get("bacfr-night", null);
function isNightHour(){ const h = new Date().getHours(); return h>=21||h<6; }
function applyNight(on){
  document.body.classList.toggle("night", on);
}
function toggleNight(){
  nightManual = !document.body.classList.contains("night");
  store.set("bacfr-night", nightManual);
  applyNight(nightManual);
}
function initNight(){ if(nightManual===null) applyNight(isNightHour()); }
initNight();
setInterval(()=>{ if(nightManual===null) applyNight(isNightHour()); }, 60000);
chargerLocal();
construire();
renderHome();
initCompte();
</script>
