{id:"ns-quadratique", parcours:["nonspe"], theme:"Phénomènes d'évolution", titre:"Modélisation quadratique", sub:"Fonctions du second degré : formes, sommet, parabole, résolutions et optimisation",
essentiel:R`<ul>
<li>\(f(x) = ax^2 + bx + c\) (\(a \ne 0\)) : la courbe est une <b>parabole</b>, « en U » si \(a > 0\), « en ∩ » si \(a < 0\).</li>
<li>Forme factorisée \(f(x) = a(x - x_1)(x - x_2)\) : les racines sont \(x_1\) et \(x_2\), et le sommet a pour abscisse \(\frac{x_1 + x_2}{2}\).</li>
<li>Abscisse du sommet : \(-\frac{b}{2a}\). Le sommet donne le maximum (si \(a < 0\)) ou le minimum (si \(a > 0\)).</li>
<li>Pour résoudre \(f(x) = 0\) avec une forme factorisée : produit nul.</li>
</ul>`,

<div class="section"><h3>Fonctions du second degré</h3>
<div class="def"><b>Définition</b>Une fonction polynôme du second degré est définie sur \(\mathbb R\) par \(f(x) = ax^2 + bx + c\), où \(a\), \(b\) et \(c\) sont des réels et \(a \ne 0\). Sa courbe est une <b>parabole</b>.</div>
${graph({xmin:-3, xmax:5, ymin:-5, ymax:5, w:330, h:250, fns:[{f:x => x * x - 2 * x - 3, label:[3.3, 3.6, "a > 0"]}, {f:x => -0.5 * x * x + x + 2, cls:"g-c2", label:[-2.8, -2.4, "a < 0"]}], alt:"Deux paraboles"})}
<div class="prop"><b>Forme de la parabole</b>
<ul><li>Si \(a > 0\) : parabole tournée vers le haut ; \(f\) est décroissante puis croissante et admet un <b>minimum</b>.</li>
<li>Si \(a < 0\) : parabole tournée vers le bas ; \(f\) est croissante puis décroissante et admet un <b>maximum</b>.</li></ul>
La parabole est symétrique par rapport à la droite verticale passant par son sommet.</div>
<div class="prop"><b>Sommet</b>L'abscisse du sommet est \(\alpha = -\dfrac{b}{2a}\) ; son ordonnée est \(f(\alpha)\).</div>
<div class="exemple"><b>Exemple</b>\(f(x) = x^2 - 2x - 3\) (parabole rouge). \(\alpha = -\frac{-2}{2 \times 1} = 1\) et \(f(1) = 1 - 2 - 3 = -4\) : sommet \(S(1\,;-4)\), minimum \(-4\).</div>
</div>
<div class="section"><h3>Forme factorisée et racines</h3>
<div class="prop"><b>Propriété</b>Si \(f(x) = a(x - x_1)(x - x_2)\), alors les solutions de \(f(x) = 0\) sont \(x_1\) et \(x_2\) (produit nul) : ce sont les abscisses des points d'intersection de la parabole avec l'axe des abscisses. Le sommet a pour abscisse \(\dfrac{x_1 + x_2}{2}\), au milieu des racines.</div>
<div class="exemple"><b>Exemple</b>On vérifie que \(x^2 - 2x - 3 = (x + 1)(x - 3)\) en développant : \(x^2 - 3x + x - 3 = x^2 - 2x - 3\). Les racines sont \(-1\) et \(3\), et l'abscisse du sommet est \(\frac{-1 + 3}{2} = 1\). On retrouve bien le résultat précédent.</div>
<div class="methode"><b>Méthode : signe d'une expression factorisée</b>On fait un tableau de signes, une ligne par facteur. Pour \((x + 1)(x - 3)\) :
${tv({x:["-\\infty", "-1", "3", "+\\infty"], rows:[{l:"x + 1", c:["", "-", "0", "+", "", "+", ""]}, {l:"x - 3", c:["", "-", "", "-", "0", "+", ""]}, {l:"f(x)", c:["", "+", "0", "-", "0", "+", ""]}]})}
Donc \(f(x) < 0\) sur \(]-1\,;3[\) : la parabole est sous l'axe des abscisses entre les racines.</div>
<div class="astuce"><b>Astuce</b>Avec \(a > 0\), le trinôme est négatif entre ses racines et positif à l'extérieur ; c'est l'inverse avec \(a < 0\).</div>
</div>
<div class="section"><h3>Résoudre par le calcul ou par lecture graphique</h3>
<ul><li>\(f(x) = k\) : abscisses des points de la parabole d'ordonnée \(k\) (intersection avec la droite horizontale \(y = k\)).</li>
<li>\(f(x) > k\) : abscisses des points de la parabole situés au-dessus de cette droite.</li>
<li>Par le calcul : se ramener à un produit nul. \(x^2 = 4x \iff x^2 - 4x = 0 \iff x(x - 4) = 0 \iff x = 0\) ou \(x = 4\).</li></ul>
<div class="piege"><b>Piège</b>Ne jamais diviser par \(x\) des deux côtés : dans \(x^2 = 4x\), on perdrait la solution \(x = 0\).</div>
</div>
<div class="section"><h3>Modéliser et optimiser</h3>
<div class="exemple"><b>Exemple : trajectoire</b>La hauteur (en m) d'un ballon lancé est \(h(t) = -5t^2 + 10t + 1{,}5\), où \(t\) est le temps en secondes.
<div class="sol">Sommet : \(\alpha = -\frac{10}{2 \times (-5)} = 1\) et \(h(1) = -5 + 10 + 1{,}5 = 6{,}5\). Le ballon atteint sa hauteur maximale, 6,5 m, au bout d'1 seconde. Au départ, il est à \(h(0) = 1{,}5\) m.</div></div>
<div class="exemple"><b>Exemple : bénéfice</b>Le bénéfice (en milliers d'euros) pour \(x\) centaines d'objets vendus est \(B(x) = -2x^2 + 24x - 40 = -2(x - 2)(x - 10)\), pour \(x \in [0\,;12]\).
<div class="sol">L'entreprise est bénéficiaire quand \(B(x) > 0\) : comme \(a = -2 < 0\), c'est entre les racines, pour \(x \in\, ]2\,;10[\), soit entre 200 et 1 000 objets. Le bénéfice est maximal en \(x = \frac{2 + 10}{2} = 6\) : \(B(6) = -2 \times 4 \times (-4) = 32\), soit 32 000 €.</div></div>
<div class="aretenir"><b>À retenir</b>Une variation absolue qui varie <b>linéairement</b> (les écarts entre termes successifs forment une suite arithmétique) correspond à une évolution <b>quadratique</b>.</div>
</div>`,

essentiel:R`<ul>
<li>Suite géométrique de raison \(q\) : \(u_{n+1} = q \times u_n\) ; terme général \(u_n = u_0 \times q^n\).</li>
<li>Une évolution de \(t\,\%\) par période correspond à une suite géométrique de raison \(q = 1 + \frac{t}{100}\).</li>
<li>Avec \(u_0 > 0\) : croissante si \(q > 1\), décroissante si \(0 < q < 1\).</li>
<li>Croissance exponentielle = variation <b>relative</b> constante (taux constant).</li>
</ul>`,
html:R`
<div class="section"><h3>Définition et terme général</h3>
<div class="def"><b>Définition</b>Une suite \((u_n)\) est géométrique de raison \(q\) si l'on passe d'un terme au suivant en multipliant toujours par \(q\) : \(u_{n+1} = q \times u_n\).</div>
<div class="prop"><b>Terme général</b>\(u_n = u_0 \times q^n\). Si le premier terme est \(u_1\) : \(u_n = u_1 \times q^{n - 1}\).</div>
<div class="exemple"><b>Exemple : capital placé</b>On place 2 000 € à intérêts composés de 3 % par an. On note \(C_n\) le capital après \(n\) années.
<div class="sol">Chaque année, le capital est multiplié par \(1{,}03\) : \(C_{n+1} = 1{,}03\,C_n\). La suite est géométrique de raison \(1{,}03\) et \(C_n = 2\,000 \times 1{,}03^n\). Après 2 ans : \(C_2 = 2\,000 \times 1{,}0609 = 2\,121{,}80\) €.</div></div>
<div class="methode"><b>Méthode : reconnaître une suite géométrique</b>
<ul><li>Dans un énoncé : « augmente (ou diminue) de \(t\,\%\) chaque année » : raison \(1 \pm \frac{t}{100}\).</li>
<li>Avec des termes non nuls : les quotients \(\frac{u_1}{u_0}\), \(\frac{u_2}{u_1}\), … sont égaux.</li></ul></div>
<div class="piege"><b>Piège</b>Une baisse de 5 % par an donne la raison \(0{,}95\), pas \(-0{,}05\) ni \(0{,}05\).</div>
</div>
<div class="section"><h3>Sens de variation et représentation</h3>
${graph({xmin:-0.5, xmax:8.5, ymin:-0.5, ymax:9, w:320, h:240, stepX:1, stepY:1, labelY:2, pts:[0, 1, 2, 3, 4, 5, 6, 7, 8].map(n => [n, 0.5 * Math.pow(1.4, n)]).concat([0, 1, 2, 3, 4, 5, 6, 7, 8].map(n => ({x:n, y:8 * Math.pow(0.7, n), cls:"g-pt2"}))), alt:"Termes de deux suites géométriques"})}
<div class="prop"><b>Propriété</b>Pour une suite géométrique de premier terme \(u_0 > 0\) :
<ul><li>si \(q > 1\), la suite est croissante (points rouges, \(q = 1{,}4\)) ;</li>
<li>si \(0 < q < 1\), la suite est décroissante (points bleus, \(q = 0{,}7\)) ;</li>
<li>si \(q = 1\), elle est constante.</li></ul></div>
<p>Les points ne sont pas alignés : la croissance s'accélère (\(q > 1\)) ou ralentit (\(q < 1\)). C'est une croissance (ou décroissance) <b>exponentielle</b>.</p>
</div>
<div class="section"><h3>Linéaire ou exponentiel ?</h3>
<div class="table-scroll"><table class="tbl first">
<tr><th></th><th>Croissance linéaire</th><th>Croissance exponentielle</th></tr>
<tr><td>Modèle</td><td>Suite arithmétique</td><td>Suite géométrique</td></tr>
<tr><td>Ce qui est constant</td><td>La variation absolue (on ajoute \(r\))</td><td>La variation relative (on multiplie par \(q\))</td></tr>
<tr><td>Graphique</td><td>Points alignés</td><td>Points sur une courbe qui s'incurve</td></tr>
<tr><td>À long terme</td><td colspan="2">Une croissance exponentielle (\(q > 1\)) finit toujours par dépasser une croissance linéaire.</td></tr>
</table></div>
<div class="exemple"><b>Exemple</b>Salaire A : 1 800 € puis +60 € par an. Salaire B : 1 800 € puis +3 % par an. Après un an : A = 1 860 €, B = 1 854 €. Après 10 ans : A = 2 400 €, B = \(1\,800 \times 1{,}03^{10} \approx 2\,419\) € : B finit par dépasser A.</div>
</div>
<div class="section"><h3>Évolutions répétées</h3>
<div class="prop"><b>Propriété</b>Une grandeur qui évolue de \(t\,\%\) pendant \(n\) périodes est multipliée par \(\left(1 + \frac{t}{100}\right)^n\).</div>
<div class="exemple"><b>Exemple</b>Une ville perd 2 % de ses habitants par an pendant 3 ans. Coefficient global : \(0{,}98^3 \approx 0{,}941\) : baisse d'environ 5,9 % (et non 6 %).</div>
<div class="methode"><b>Méthode : chercher un seuil</b>Pour trouver à partir de quelle année \(u_n\) dépasse une valeur, on calcule les termes successifs (de tête quand c'est simple, sinon le résultat est fourni dans un tableau de valeurs de l'énoncé) jusqu'à franchir le seuil.</div>
<div class="exemple"><b>Exemple</b>Un capital de 1 000 € double tous les 10 ans. Il vaut 2 000 € après 10 ans, 4 000 € après 20 ans, 8 000 € après 30 ans : il dépasse 5 000 € entre la 20<sup>e</sup> et la 30<sup>e</sup> année.</div>
</div>`,

<div class="section"><h3>Des suites géométriques aux fonctions exponentielles</h3>
<p>Une suite géométrique \(u_n = q^n\) n'est définie que pour des entiers. Pour décrire une évolution continue dans le temps (une population, une substance radioactive, un médicament dans le sang…), on prolonge \(q^n\) à tous les réels : c'est la fonction \(x \mapsto a^x\).</p>
<div class="def"><b>Définition</b>Pour tout réel \(a > 0\), la fonction exponentielle de base \(a\) est définie sur \(\mathbb R\) par \(f(x) = a^x\). Elle vérifie \(a^0 = 1\), \(a^1 = a\), et \(a^x > 0\) pour tout réel \(x\).</div>
${graph({xmin:-3, xmax:3.2, ymin:-0.5, ymax:6, w:320, h:250, stepX:1, stepY:1, fns:[{f:x => Math.pow(2, x), label:[2.3, 5.4, "2ˣ"]}, {f:x => Math.pow(0.5, x), cls:"g-c2", label:[-2.8, 5.4, "0,5ˣ"]}], pts:[{x:0, y:1, t:"(0 ; 1)", dx:8, dy:16}], alt:"Courbes de 2^x et 0,5^x"})}
</div>
<div class="section"><h3>Propriétés algébriques</h3>
<div class="prop"><b>Propriétés</b>Pour \(a > 0\) et tous réels \(x\) et \(y\) :
\[a^{x+y} = a^x \times a^y \qquad a^{-x} = \frac{1}{a^x} \qquad a^{x-y} = \frac{a^x}{a^y} \qquad (a^x)^y = a^{xy}\]
En particulier, \(a^{\frac12} = \sqrt a\) car \(\left(a^{\frac12}\right)^2 = a^1 = a\).</div>
<div class="exemple"><b>Exemples</b>\(4^{\frac12} = 2\) ; \(8^{\frac13} = 2\) ; \(9^{-\frac12} = \frac{1}{3}\) ; \(2^{x+3} = 8 \times 2^x\).</div>
<div class="piege"><b>Piège</b>\(a^{x+y} \ne a^x + a^y\) : par exemple \(2^{2+1} = 2^3 = 8\), alors que \(2^2 + 2^1 = 6\).</div>
</div>
<div class="section"><h3>Sens de variation</h3>
<div class="prop"><b>Propriété</b>
<ul><li>Si \(a > 1\), \(x \mapsto a^x\) est strictement croissante sur \(\mathbb R\) (croissance exponentielle).</li>
<li>Si \(0 < a < 1\), \(x \mapsto a^x\) est strictement décroissante sur \(\mathbb R\) (décroissance exponentielle).</li>
<li>Si \(a = 1\), elle est constante égale à 1.</li></ul></div>
<div class="exemple"><b>Exemple</b>La masse (en g) d'un médicament dans le sang est modélisée par \(m(t) = 20 \times 0{,}8^t\), \(t\) en heures. Comme \(0 < 0{,}8 < 1\), la masse diminue ; elle perd 20 % par heure. Après 2 heures : \(20 \times 0{,}64 = 12{,}8\) g.</div>
</div>
<div class="section"><h3>Taux d'évolution moyen</h3>
<div class="prop"><b>Propriété</b>Si une grandeur a été multipliée par \(CM\) en \(n\) périodes, le taux d'évolution moyen par période est \(t_M\) tel que \((1 + t_M)^n = CM\), c'est-à-dire \(t_M = CM^{\frac1n} - 1\).</div>
<div class="exemple"><b>Exemple</b>Un prix a augmenté de 44 % en 2 ans. \(CM = 1{,}44\) et \(1{,}44^{\frac12} = \sqrt{1{,}44} = 1{,}2\) : taux moyen annuel de 20 % (et non 22 %).</div>
<div class="exemple"><b>Exemple</b>Une population a été multipliée par 8 en 3 ans : \(8^{\frac13} = 2\), elle a doublé chaque année en moyenne (+100 % par an).</div>
<div class="astuce"><b>Astuce</b>Sans calculatrice, les sujets choisissent des valeurs « rondes » : \(1{,}21 = 1{,}1^2\), \(1{,}44 = 1{,}2^2\), \(0{,}81 = 0{,}9^2\), \(0{,}64 = 0{,}8^2\), \(1{,}69 = 1{,}3^2\).</div>
</div>
<div class="section"><h3>Demi-vie et temps de doublement</h3>
<p>Pour une décroissance \(f(t) = f(0) \times a^t\) avec \(0 < a < 1\), la <b>demi-vie</b> est la durée au bout de laquelle la quantité est divisée par 2. Pour une croissance (\(a > 1\)), le <b>temps de doublement</b> est la durée au bout de laquelle elle est multipliée par 2. Ces durées ne dépendent pas de l'instant de départ.</p>
<div class="exemple"><b>Exemple</b>Une substance a une demi-vie de 5 ans. Il en reste la moitié après 5 ans, le quart après 10 ans, le huitième après 15 ans. Elle est modélisée par \(f(t) = f(0) \times \left(\frac12\right)^{\frac t5} = f(0) \times 0{,}5^{\frac t5}\).</div>
</div>`,

{n:"3.b", q:R`Justifier qu'une équation du cercle \(\mathscr E\) est \(x^2 + y^2 - 4x - 4y + 7{,}75 = 0\).`, c:R`\(\mathscr E\) a pour équation \((x - 2)^2 + (y - 2)^2 = 0{,}5^2\), soit \(x^2 - 4x + 4 + y^2 - 4y + 4 = 0{,}25\), c'est-à-dire \(x^2 + y^2 - 4x - 4y + 7{,}75 = 0\).`},
{n:"3.c", q:R`Le point \(M(1{,}5\,;2)\) appartient-il à l'intersection du cercle \(\mathscr E\) et de la droite \((CH)\) ? Justifier.`, c:R`Cercle : \(1{,}5^2 + 2^2 - 4 \times 1{,}5 - 4 \times 2 + 7{,}75 = 2{,}25 + 4 - 6 - 8 + 7{,}75 = 0\) : \(M \in \mathscr E\).<br>Droite : \(4 \times 1{,}5 + 3 \times 2 - 12 = 6 + 6 - 12 = 0\) : \(M \in (CH)\).<br>Donc \(M\) appartient à l'intersection.`},
{n:"4", q:R`<i>Pour aller plus loin.</i> Déterminer les coordonnées du point \(H\).`, indice:R`\(H\) est l'intersection de \((OI)\), d'équation \(y = \frac34 x\), et de \((CH)\).`, c:R`On remplace \(y = \frac34x\) dans \(4x + 3y - 12 = 0\) : \(4x + \frac94x = 12 \iff \frac{25}{4}x = 12 \iff x = \frac{48}{25} = 1{,}92\), puis \(y = \frac34 \times 1{,}92 = 1{,}44\). \(H(1{,}92\,;1{,}44)\). Vérification : \(OH = \sqrt{1{,}92^2 + 1{,}44^2} = \sqrt{5{,}76} = 2{,}4\).`},
]},
{id:"s-cout", parcours:["spe"], groupe:"Analyse", titre:"Coût de production : second degré, suite et fonction rationnelle", themes:["Second degré", "Suite arithmétique", "Dérivation", "Variations"], duree:35, niveau:"Type bac", chaps:["second-degre", "suites", "variations", "derivation"],
source:"Sur le modèle de l'exercice d'analyse du sujet zéro n°1 de spécialité.",
enonce:R`<p>Une entreprise fabrique des vélos électriques. Pour \(x\) centaines de vélos produits par mois, avec \(x \in [1\,;10]\), le coût total de production, en milliers d'euros, est \(C(x) = x^2 + 4x + 16\).</p>`,
questions:[
{n:"1", partie:"Partie A — Coût total", q:R`Calculer le coût de production de 200 vélos.`, c:R`200 vélos correspondent à \(x = 2\) : \(C(2) = 4 + 8 + 16 = 28\), soit 28 000 €.`},
{n:"2", partie:"Partie A — Coût total", q:R`Déterminer la quantité produite pour un coût total de 37 000 €.`, indice:R`Résoudre \(C(x) = 37\), c'est-à-dire \(x^2 + 4x - 21 = 0\).`, c:R`\(C(x) = 37 \iff x^2 + 4x - 21 = 0\). \(\Delta = 16 + 84 = 100\), d'où \(x_1 = \frac{-4 - 10}{2} = -7\) et \(x_2 = \frac{-4 + 10}{2} = 3\). Seule \(x = 3\) est dans \([1\,;10]\) : 300 vélos.`},
{n:"3", partie:"Partie B — Montée en production", q:R`En janvier, l'entreprise produit 100 vélos. Elle augmente ensuite sa production de 50 vélos chaque mois. On note \(p_n\) la production, en centaines, \(n\) mois après janvier (\(p_0 = 1\)). Quelle est la nature de la suite \((p_n)\) ? Exprimer \(p_n\) en fonction de \(n\).`, c:R`On ajoute 0,5 centaine chaque mois : \((p_n)\) est arithmétique de raison \(0{,}5\) et de premier terme \(p_0 = 1\). Donc \(p_n = 1 + 0{,}5n\).`},
{n:"4", partie:"Partie B — Montée en production", q:R`Au bout de combien de mois la production atteindra-t-elle 400 vélos ?`, c:R`\(1 + 0{,}5n = 4 \iff n = 6\) : au bout de 6 mois (en juillet).`},
{n:"5", partie:"Partie C — Coût moyen", q:R`Le coût moyen d'une centaine de vélos est \(C_M(x) = \frac{C(x)}{x}\). Montrer que \(C_M(x) = x + 4 + \frac{16}{x}\).`, c:R`\(C_M(x) = \frac{x^2 + 4x + 16}{x} = \frac{x^2}{x} + \frac{4x}{x} + \frac{16}{x} = x + 4 + \frac{16}{x}\).`},
{n:"6", partie:"Partie C — Coût moyen", q:R`Montrer que pour tout \(x \in [1\,;10]\), \(C_M'(x) = \dfrac{(x - 4)(x + 4)}{x^2}\).`, indice:R`La dérivée de \(\frac{16}{x}\) est \(-\frac{16}{x^2}\).`, c:R`\(C_M'(x) = 1 + 0 - \frac{16}{x^2} = \frac{x^2 - 16}{x^2} = \frac{(x - 4)(x + 4)}{x^2}\).`},
{n:"7", partie:"Partie C — Coût moyen", q:R`Étudier les variations de \(C_M\) sur \([1\,;10]\). Pour quelle production le coût moyen est-il minimal ? Quel est ce coût minimal ?`, c:R`Sur \([1\,;10]\), \(x^2 > 0\) et \(x + 4 > 0\) : \(C_M'(x)\) est du signe de \(x - 4\).
${tv({x:["1", "4", "10"], rows:[{l:"C_M'(x)", c:["", "-", "0", "+", ""]}, {l:"C_M", c:["21", "down", "12", "up", "15{,}6"]}]})}
\(C_M(1) = 1 + 4 + 16 = 21\), \(C_M(4) = 4 + 4 + 4 = 12\), \(C_M(10) = 10 + 4 + 1{,}6 = 15{,}6\). Le coût moyen est minimal pour 400 vélos : 12 000 € la centaine, soit 120 € par vélo.`},
]},
{id:"s-exp-poly", parcours:["spe"], groupe:"Analyse", titre:"Polynôme, dérivée et exponentielle", themes:["Second degré", "Dérivation", "Exponentielle"], duree:35, niveau:"Type bac", chaps:["second-degre", "exponentielle", "variations"],
source:"Sur le modèle de l'exercice transversal d'analyse du sujet zéro n°2 de spécialité.",
enonce:R`<p>On considère la fonction \(f\) définie sur \(\mathbb R\) par \(f(x) = (x^2 - 3x + 1)\,\mathrm e^{x}\). On note \(\mathscr C\) sa courbe représentative.</p>`,
questions:[
{n:"1", partie:"Partie A — Un trinôme", q:R`On pose \(g(x) = x^2 - x - 2\). Résoudre \(g(x) = 0\), puis étudier le signe de \(g(x)\) sur \(\mathbb R\).`, c:R`\(\Delta = 1 + 8 = 9\), racines \(x_1 = \frac{1 - 3}{2} = -1\) et \(x_2 = \frac{1 + 3}{2} = 2\). Comme \(a = 1 > 0\), \(g(x) > 0\) sur \(]-\infty\,;-1[ \cup ]2\,;+\infty[\) et \(g(x) < 0\) sur \(]-1\,;2[\).`},
{n:"2", partie:"Partie B — Étude de f", q:R`Montrer que pour tout réel \(x\), \(f'(x) = (x^2 - x - 2)\,\mathrm e^x\).`, indice:R`Dérivée d'un produit \(uv\) avec \(u(x) = x^2 - 3x + 1\) et \(v(x) = \mathrm e^x\).`, c:R`\(u'(x) = 2x - 3\), \(v'(x) = \mathrm e^x\). \(f'(x) = (2x - 3)\mathrm e^x + (x^2 - 3x + 1)\mathrm e^x = (x^2 - x - 2)\mathrm e^x\).`},
{n:"3", partie:"Partie B — Étude de f", q:R`En déduire le tableau de variations de \(f\) sur \(\mathbb R\). On donnera les valeurs exactes des extremums.`, c:R`\(\mathrm e^x > 0\), donc \(f'(x)\) est du signe de \(g(x)\) (partie A). \(f(-1) = (1 + 3 + 1)\mathrm e^{-1} = \frac{5}{\mathrm e}\) et \(f(2) = (4 - 6 + 1)\mathrm e^2 = -\mathrm e^2\).
${tv({x:["-\\infty", "-1", "2", "+\\infty"], rows:[{l:"f'(x)", c:["", "+", "0", "-", "0", "+", ""]}, {l:"f", c:["", "up", "\\frac{5}{\\mathrm e}", "down", "-\\mathrm e^2", "up", ""]}]})}
Maximum local \(\frac5{\mathrm e}\) en \(-1\), minimum local \(-\mathrm e^2\) en 2.`},
{n:"4", partie:"Partie B — Étude de f", q:R`Déterminer une équation de la tangente \(T\) à \(\mathscr C\) au point d'abscisse 0.`, c:R`\(f(0) = 1 \times \mathrm e^0 = 1\) et \(f'(0) = -2 \times 1 = -2\). \(T : y = -2(x - 0) + 1\), soit \(y = -2x + 1\).`},
{n:"5", partie:"Partie B — Étude de f", q:R`Résoudre l'équation \(f(x) = 0\).`, indice:R`Une exponentielle ne s'annule jamais.`, c:R`\(\mathrm e^x \ne 0\), donc \(f(x) = 0 \iff x^2 - 3x + 1 = 0\). \(\Delta = 9 - 4 = 5\) : \(S = \left\{\frac{3 - \sqrt5}{2}\,;\frac{3 + \sqrt5}{2}\right\}\).`},
{n:"6", partie:"Partie B — Étude de f", q:R`Vrai ou faux ? « La fonction \(f\) est positive sur \([0\,;1]\). » Justifier.`, c:R`Faux. \(\frac{3 - \sqrt5}{2} \approx \frac{3 - 2{,}24}{2} \approx 0{,}38\) est dans \([0\,;1]\) et \(f\) change de signe en ce point : par exemple \(f(1) = (1 - 3 + 1)\mathrm e = -\mathrm e < 0\).`},
]},
{id:"s-streaming", parcours:["spe"], groupe:"Probabilités", titre:"Abonnés d'une plateforme : arbre et indépendance", themes:["Probabilités conditionnelles", "Probabilités totales", "Indépendance"], duree:25, niveau:"Type bac", chaps:["probas-cond"],
source:"Exercice d'entraînement dans le style du sujet de juin 2026 (spécialité).",
enonce:R`<p>Une plateforme de vidéos propose deux formules : « Standard » et « Premium ». 70 % des abonnés ont la formule Standard. Parmi les abonnés Standard, 40 % regardent des séries tous les jours ; parmi les abonnés Premium, 80 % regardent des séries tous les jours.</p>
<p>On choisit un abonné au hasard. On note \(S\) l'événement « l'abonné a la formule Standard » et \(Q\) l'événement « l'abonné regarde des séries tous les jours ».</p>`,
questions:[
{n:"1", q:R`Représenter la situation par un arbre pondéré.`, c:R`${tree({b:[{t:"S", p:"0,7", s:[{t:"Q", p:"0,4"}, {t:"Q̅", p:"0,6"}]}, {t:"S̅", p:"0,3", s:[{t:"Q", p:"0,8"}, {t:"Q̅", p:"0,2"}]}]})}`},
{n:"2", q:R`Calculer \(P(S \cap Q)\) et interpréter.`, c:R`\(P(S \cap Q) = 0{,}7 \times 0{,}4 = 0{,}28\) : 28 % des abonnés ont la formule Standard et regardent des séries tous les jours.`},
{n:"3", q:R`Montrer que \(P(Q) = 0{,}52\).`, c:R`D'après la formule des probabilités totales : \(P(Q) = P(S \cap Q) + P(\bar S \cap Q) = 0{,}28 + 0{,}3 \times 0{,}8 = 0{,}28 + 0{,}24 = 0{,}52\).`},
{n:"4", q:R`Un abonné regarde des séries tous les jours. Quelle est la probabilité qu'il ait la formule Premium ? Donner la valeur exacte puis une valeur arrondie au centième.`, indice:R`On cherche \(P_Q(\bar S)\).`, c:R`\(P_Q(\bar S) = \frac{P(\bar S \cap Q)}{P(Q)} = \frac{0{,}24}{0{,}52} = \frac{24}{52} = \frac{6}{13} \approx 0{,}46\).`},
{n:"5", q:R`Les événements \(S\) et \(Q\) sont-ils indépendants ? Justifier.`, c:R`\(P(S) \times P(Q) = 0{,}7 \times 0{,}52 = 0{,}364\) et \(P(S \cap Q) = 0{,}28\). Ces deux nombres sont différents : \(S\) et \(Q\) ne sont pas indépendants. (Autre argument : \(P_S(Q) = 0{,}4 \ne P(Q) = 0{,}52\).)`},
{n:"6", q:R`On choisit au hasard trois abonnés ; on assimile ce choix à trois tirages indépendants. Calculer la probabilité qu'au moins un des trois ait la formule Premium.`, c:R`L'événement contraire est « les trois ont la formule Standard », de probabilité \(0{,}7^3 = 0{,}343\). La probabilité cherchée est \(1 - 0{,}343 = 0{,}657\).`},
]},
{id:"s-population", parcours:["spe"], groupe:"Algèbre", titre:"Population d'une ville : suite et algorithme de seuil", themes:["Suites", "Suite géométrique", "Python"], duree:30, niveau:"Type bac", chaps:["suites", "python"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>En 2026, une ville compte 20 000 habitants. Chaque année, 2 % des habitants quittent la ville et 300 nouveaux habitants s'y installent. On note \(u_n\) le nombre d'habitants en \(2026 + n\). Ainsi \(u_0 = 20\,000\).</p>`,
questions:[
{n:"1", q:R`Calculer \(u_1\) et \(u_2\).`, c:R`\(u_1 = 0{,}98 \times 20\,000 + 300 = 19\,600 + 300 = 19\,900\) ; \(u_2 = 0{,}98 \times 19\,900 + 300 = 19\,502 + 300 = 19\,802\).`},
{n:"2", q:R`Justifier que pour tout entier \(n\), \(u_{n+1} = 0{,}98\,u_n + 300\).`, c:R`Perdre 2 % des habitants revient à multiplier par \(1 - 0{,}02 = 0{,}98\), puis on ajoute les 300 arrivants : \(u_{n+1} = 0{,}98u_n + 300\).`},
{n:"3", q:R`La suite \((u_n)\) est-elle arithmétique ? géométrique ? Justifier.`, c:R`\(u_1 - u_0 = -100\) et \(u_2 - u_1 = -98\) : les différences ne sont pas égales, la suite n'est pas arithmétique. \(\frac{u_1}{u_0} = 0{,}995\) et \(\frac{u_2}{u_1} = \frac{19\,802}{19\,900} \ne 0{,}995\) (car \(0{,}995 \times 19\,900 = 19\,800{,}5\)) : elle n'est pas géométrique.`},
{n:"4", q:R`On pose \(v_n = u_n - 15\,000\). Montrer que \((v_n)\) est géométrique de raison \(0{,}98\) et préciser \(v_0\).`, indice:R`Exprime \(v_{n+1}\) en fonction de \(u_n\), puis en fonction de \(v_n\).`, c:R`\(v_{n+1} = u_{n+1} - 15\,000 = 0{,}98u_n + 300 - 15\,000 = 0{,}98u_n - 14\,700 = 0{,}98(u_n - 15\,000) = 0{,}98\,v_n\). Donc \((v_n)\) est géométrique de raison \(0{,}98\), de premier terme \(v_0 = 20\,000 - 15\,000 = 5\,000\).`},
{n:"5", q:R`En déduire que \(u_n = 15\,000 + 5\,000 \times 0{,}98^n\), puis le sens de variation de \((u_n)\).`, c:R`\(v_n = 5\,000 \times 0{,}98^n\) et \(u_n = v_n + 15\,000\). Comme \(0 < 0{,}98 < 1\), la suite \((0{,}98^n)\) est décroissante ; multipliée par \(5\,000 > 0\), elle reste décroissante, donc \((u_n)\) est décroissante : la population diminue chaque année.`},
{n:"6", q:R`Recopier et compléter la fonction Python suivante pour qu'elle renvoie la première année où la population passe sous les 18 000 habitants.
<pre class="no-math" style="background:var(--accent-soft);padding:10px 14px;border-radius:10px;overflow-x:auto;font-size:14px">def annee():
    n = 0
    u = 20000
    while ........ :
        u = ........
        n = n + 1
    return 2026 + n</pre>`, c:R`<pre class="no-math" style="background:var(--accent-soft);padding:10px 14px;border-radius:10px;overflow-x:auto;font-size:14px">    while u &gt;= 18000 :
        u = 0.98 * u + 300</pre>On continue tant que la population est encore supérieure ou égale à 18 000.`},
{n:"7", q:R`On admet que la fonction renvoie 2052. Interpréter. Que se passe-t-il pour la population à très long terme ?`, c:R`C'est en 2052 que la population passe pour la première fois sous les 18 000 habitants. À long terme, \(0{,}98^n\) se rapproche de 0, donc \(u_n\) se rapproche de 15 000 habitants (sans jamais descendre en dessous).`},
]},
{id:"s-triangle", parcours:["spe"], groupe:"Géométrie", titre:"Triangle, hauteur et cercle circonscrit", themes:["Produit scalaire", "Vecteur normal", "Équation de cercle"], duree:30, niveau:"Type bac", chaps:["produit-scalaire", "geometrie-reperee"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>Dans un repère orthonormé, on considère les points \(A(1\,;1)\), \(B(5\,;3)\) et \(C(2\,;4)\).</p>`,
questions:[
{n:"1", q:R`Calculer \(\overrightarrow{AB} \cdot \overrightarrow{AC}\), puis les longueurs \(AB\) et \(AC\).`, c:R`\(\overrightarrow{AB}(4\,;2)\) et \(\overrightarrow{AC}(1\,;3)\) : \(\overrightarrow{AB} \cdot \overrightarrow{AC} = 4 + 6 = 10\). \(AB = \sqrt{16 + 4} = \sqrt{20} = 2\sqrt5\) et \(AC = \sqrt{1 + 9} = \sqrt{10}\).`},
{n:"2", q:R`En déduire une mesure de l'angle \(\widehat{BAC}\).`, c:R`\(\cos\widehat{BAC} = \frac{10}{2\sqrt5 \times \sqrt{10}} = \frac{10}{2\sqrt{50}} = \frac{10}{10\sqrt2} = \frac{1}{\sqrt2} = \frac{\sqrt2}{2}\). Donc \(\widehat{BAC} = \frac\pi4\) (45°).`},
{n:"3", q:R`Déterminer une équation cartésienne de la droite \((AB)\), puis de la hauteur \(h_C\) issue de \(C\) dans le triangle \(ABC\).`, indice:R`Pour \(h_C\) : elle passe par \(C\) et \(\overrightarrow{AB}\) en est un vecteur normal.`, c:R`\(\overrightarrow{AB}(4\,;2)\) est directeur de \((AB)\), donc \(\vec n(1\,;-2)\) est normal (car \(4 \times 1 + 2 \times (-2) = 0\)) : \(x - 2y + c = 0\) avec \(A\) : \(1 - 2 + c = 0\), \(c = 1\). \((AB) : x - 2y + 1 = 0\).<br>\(h_C\) : \(4x + 2y + c' = 0\) avec \(C\) : \(8 + 8 + c' = 0\), \(c' = -16\). \(h_C : 4x + 2y - 16 = 0\), soit \(2x + y - 8 = 0\).`},
{n:"4", q:R`Déterminer les coordonnées du pied \(H\) de la hauteur issue de \(C\). Montrer que \(H\) est le milieu de \([AB]\). Que peut-on en déduire pour le triangle \(ABC\) ?`, c:R`On résout \(x - 2y = -1\) et \(2x + y = 8\) : de la première, \(x = 2y - 1\) ; alors \(4y - 2 + y = 8\), \(y = 2\) et \(x = 3\). \(H(3\,;2)\). Le milieu de \([AB]\) est \(\left(\frac{1 + 5}{2}\,;\frac{1 + 3}{2}\right) = (3\,;2) = H\). La hauteur issue de \(C\) est aussi la médiatrice de \([AB]\) : le triangle est isocèle en \(C\) (\(CA = CB = \sqrt{10}\)).`},
{n:"5", q:R`Déterminer une équation du cercle \(\Gamma\) de diamètre \([AB]\). Le point \(C\) appartient-il à \(\Gamma\) ? Conclure sur la nature du triangle \(ABC\).`, c:R`Centre \(H(3\,;2)\), rayon \(\frac{AB}{2} = \sqrt5\) : \(\Gamma : (x - 3)^2 + (y - 2)^2 = 5\). Pour \(C\) : \((2 - 3)^2 + (4 - 2)^2 = 1 + 4 = 5\) : \(C \in \Gamma\). Un point du cercle de diamètre \([AB]\) voit \([AB]\) sous un angle droit : \(ABC\) est rectangle en \(C\). Avec la question 4, il est <b>rectangle isocèle en \(C\)</b> (ce qui confirme \(\widehat{BAC} = 45^\circ\)).`},
{n:"6", q:R`Calculer l'aire du triangle \(ABC\).`, c:R`\(CH = \sqrt{(2 - 3)^2 + (4 - 2)^2} = \sqrt5\). Aire \(= \frac{AB \times CH}{2} = \frac{2\sqrt5 \times \sqrt5}{2} = 5\). (Ou \(\frac{CA \times CB}{2} = \frac{10}{2} = 5\).)`},
]},
{id:"s-medicament", parcours:["spe"], groupe:"Analyse", titre:"Concentration d'un médicament", themes:["Exponentielle", "Dérivation", "Tangente"], duree:30, niveau:"Type bac", chaps:["exponentielle", "variations", "derivation"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p><b>Partie A.</b> Questions indépendantes de calcul.</p><p><b>Partie B.</b> La concentration d'un médicament dans le sang, en mg/L, \(t\) heures après une injection, est modélisée par \(C(t) = 4t\,\mathrm e^{-0{,}5t}\) pour \(t \in [0\,;10]\). On donne \(\mathrm e^{-1} \approx 0{,}37\).</p>`,
questions:[
{n:"1", partie:"Partie A — Calculs avec l'exponentielle", q:R`Simplifier \(A = \dfrac{\mathrm e^{3x} \times \mathrm e^{-x + 2}}{\mathrm e^{x + 1}}\) pour tout réel \(x\).`, c:R`\(A = \mathrm e^{3x - x + 2 - (x + 1)} = \mathrm e^{x + 1}\).`},
{n:"2", partie:"Partie A — Calculs avec l'exponentielle", q:R`Résoudre dans \(\mathbb R\) : \(\mathrm e^{2x - 1} = \mathrm e^{x + 3}\), puis \(\mathrm e^{x^2} \le \mathrm e\).`, c:R`\(2x - 1 = x + 3 \iff x = 4\). Ensuite \(\mathrm e^{x^2} \le \mathrm e^1 \iff x^2 \le 1 \iff -1 \le x \le 1\) : \(S = [-1\,;1]\).`},
{n:"3", partie:"Partie B — Étude de la concentration", q:R`Montrer que \(C'(t) = (4 - 2t)\,\mathrm e^{-0{,}5t}\).`, indice:R`Produit de \(u(t) = 4t\) et \(v(t) = \mathrm e^{-0{,}5t}\), avec \(v'(t) = -0{,}5\,\mathrm e^{-0{,}5t}\).`, c:R`\(C'(t) = 4\,\mathrm e^{-0{,}5t} + 4t \times (-0{,}5)\,\mathrm e^{-0{,}5t} = (4 - 2t)\,\mathrm e^{-0{,}5t}\).`},
{n:"4", partie:"Partie B — Étude de la concentration", q:R`Étudier les variations de \(C\) sur \([0\,;10]\). Au bout de combien de temps la concentration est-elle maximale ? Donner une valeur approchée de ce maximum.`, c:R`\(\mathrm e^{-0{,}5t} > 0\), donc \(C'(t)\) est du signe de \(4 - 2t\) : positif sur \([0\,;2[\), négatif sur \(]2\,;10]\). \(C\) est croissante sur \([0\,;2]\) puis décroissante sur \([2\,;10]\). Maximum : \(C(2) = 8\,\mathrm e^{-1} \approx 8 \times 0{,}37 = 2{,}96\) mg/L, atteint 2 heures après l'injection.`},
{n:"5", partie:"Partie B — Étude de la concentration", q:R`Déterminer l'équation de la tangente à la courbe de \(C\) au point d'abscisse 0. Interpréter le coefficient directeur.`, c:R`\(C(0) = 0\) et \(C'(0) = 4\) : \(y = 4t\). Juste après l'injection, la concentration augmente à une vitesse d'environ 4 mg/L par heure.`},
{n:"6", partie:"Partie B — Étude de la concentration", q:R`Le médicament est efficace tant que la concentration dépasse 1 mg/L. On admet que l'équation \(C(t) = 1\) a deux solutions \(t_1 \approx 0{,}3\) et \(t_2 \approx 6{,}5\). Pendant combien de temps environ le médicament est-il efficace ?`, c:R`D'après les variations, \(C(t) > 1\) entre \(t_1\) et \(t_2\) : environ \(6{,}5 - 0{,}3 = 6{,}2\) heures, soit environ 6 h 12 min.`},
]},
{id:"s-jeu", parcours:["spe"], groupe:"Probabilités", titre:"Un jeu de fête foraine : variable aléatoire", themes:["Variable aléatoire", "Espérance", "Écart type"], duree:25, niveau:"Type bac", chaps:["variables-aleatoires", "probas-cond"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>Une urne contient 10 boules indiscernables au toucher : 2 rouges, 3 bleues et 5 vertes. Un joueur paie une mise de \(m\) euros puis tire une boule au hasard. Il reçoit 10 € si la boule est rouge, 2 € si elle est bleue et rien si elle est verte. On note \(X\) le gain algébrique du joueur (somme reçue moins la mise).</p>`,
questions:[
{n:"1", q:R`Dans cette question, \(m = 2\). Donner la loi de probabilité de \(X\).`, c:R`<div class="table-scroll"><table class="tbl c"><tr><th>\(x_i\)</th><td>\(8\)</td><td>\(0\)</td><td>\(-2\)</td></tr><tr><th>\(P(X = x_i)\)</th><td>\(0{,}2\)</td><td>\(0{,}3\)</td><td>\(0{,}5\)</td></tr></table></div>`},
{n:"2", q:R`Calculer \(E(X)\). Le jeu est-il favorable au joueur ?`, c:R`\(E(X) = 8 \times 0{,}2 + 0 \times 0{,}3 - 2 \times 0{,}5 = 1{,}6 - 1 = 0{,}6\). L'espérance est positive : le jeu est favorable au joueur (il gagne en moyenne 0,60 € par partie).`},
{n:"3", q:R`Calculer \(V(X)\) et \(\sigma(X)\).`, c:R`\(E(X^2) = 64 \times 0{,}2 + 0 + 4 \times 0{,}5 = 12{,}8 + 2 = 14{,}8\). \(V(X) = 14{,}8 - 0{,}6^2 = 14{,}8 - 0{,}36 = 14{,}44\) et \(\sigma(X) = \sqrt{14{,}44} = 3{,}8\).`},
{n:"4", q:R`Dans le cas général, exprimer \(E(X)\) en fonction de \(m\). Quelle mise rend le jeu équitable ?`, indice:R`Le gain algébrique vaut « somme reçue \(- m\) » : utilise \(E(Y - m) = E(Y) - m\).`, c:R`Si \(Y\) est la somme reçue, \(E(Y) = 10 \times 0{,}2 + 2 \times 0{,}3 = 2{,}6\) et \(X = Y - m\), donc \(E(X) = 2{,}6 - m\). Le jeu est équitable pour \(m = 2{,}60\) €.`},
{n:"5", q:R`Avec \(m = 2\), un joueur joue deux parties, de manière indépendante (la boule est remise). Quelle est la probabilité qu'il gagne 16 € au total ?`, c:R`Il faut tirer une boule rouge aux deux parties : \(0{,}2 \times 0{,}2 = 0{,}04\).`},
]},
{id:"s-trigo", parcours:["spe"], groupe:"Géométrie", titre:"Trigonométrie et Al-Kashi", themes:["Trigonométrie", "Produit scalaire", "Al-Kashi"], duree:25, niveau:"Type bac", chaps:["trigonometrie", "produit-scalaire"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p><b>Partie A.</b> Questions sur le cercle trigonométrique. <b>Partie B.</b> \(ABC\) est un triangle tel que \(AB = 4\), \(AC = 6\) et \(\widehat{BAC} = \frac\pi3\).</p>`,
questions:[
{n:"1", partie:"Partie A — Cercle trigonométrique", q:R`Donner les valeurs exactes de \(\cos\frac{5\pi}{6}\), \(\sin\left(-\frac\pi3\right)\) et \(\cos\frac{7\pi}{3}\).`, c:R`\(\cos\frac{5\pi}6 = \cos\left(\pi - \frac\pi6\right) = -\frac{\sqrt3}2\) ; \(\sin\left(-\frac\pi3\right) = -\frac{\sqrt3}2\) ; \(\frac{7\pi}3 = 2\pi + \frac\pi3\), donc \(\cos\frac{7\pi}3 = \frac12\).`},
{n:"2", partie:"Partie A — Cercle trigonométrique", q:R`Résoudre dans \(]-\pi\,;\pi]\) l'équation \(\cos x = -\frac{\sqrt2}{2}\).`, c:R`Les points du cercle d'abscisse \(-\frac{\sqrt2}2\) sont associés à \(\frac{3\pi}4\) et \(-\frac{3\pi}4\). \(S = \left\{-\frac{3\pi}4\,;\frac{3\pi}4\right\}\).`},
{n:"3", partie:"Partie A — Cercle trigonométrique", q:R`Sachant que \(\sin x = \frac35\) et \(x \in \left[\frac\pi2\,;\pi\right]\), calculer \(\cos x\).`, indice:R`Utilise \(\cos^2 x + \sin^2 x = 1\) et le signe de \(\cos x\) sur \(\left[\frac\pi2\,;\pi\right]\).`, c:R`\(\cos^2 x = 1 - \frac{9}{25} = \frac{16}{25}\), donc \(\cos x = \frac45\) ou \(-\frac45\). Sur \(\left[\frac\pi2\,;\pi\right]\), le cosinus est négatif : \(\cos x = -\frac45\).`},
{n:"4", partie:"Partie B — Dans le triangle", q:R`Calculer \(\overrightarrow{AB} \cdot \overrightarrow{AC}\).`, c:R`\(\overrightarrow{AB} \cdot \overrightarrow{AC} = AB \times AC \times \cos\frac\pi3 = 4 \times 6 \times \frac12 = 12\).`},
{n:"5", partie:"Partie B — Dans le triangle", q:R`En déduire la longueur \(BC\).`, c:R`Al-Kashi : \(BC^2 = AB^2 + AC^2 - 2\,\overrightarrow{AB} \cdot \overrightarrow{AC} = 16 + 36 - 24 = 28\), donc \(BC = \sqrt{28} = 2\sqrt7\).`},
{n:"6", partie:"Partie B — Dans le triangle", q:R`Soit \(H\) le projeté orthogonal de \(B\) sur \((AC)\). Calculer \(AH\), puis \(BH\).`, c:R`\(\overrightarrow{AB} \cdot \overrightarrow{AC} = AH \times AC\) (produit positif) : \(AH = \frac{12}{6} = 2\). Dans le triangle \(ABH\) rectangle en \(H\) : \(BH = \sqrt{16 - 4} = \sqrt{12} = 2\sqrt3\).`},
]},
{id:"s-boite", parcours:["spe"], groupe:"Analyse", titre:"Optimiser le volume d'une boîte", themes:["Dérivation", "Variations", "Optimisation"], duree:25, niveau:"Type bac", chaps:["derivation", "variations"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>Dans une feuille carrée de carton de 12 cm de côté, on découpe aux quatre coins un carré de côté \(x\) cm, puis on replie les bords pour former une boîte sans couvercle. On admet que \(x \in\, ]0\,;6[\).</p>`,
questions:[
{n:"1", q:R`Justifier que le volume de la boîte, en cm³, est \(V(x) = x(12 - 2x)^2\).`, c:R`Le fond est un carré de côté \(12 - 2x\) (on enlève \(x\) de chaque côté) et la hauteur vaut \(x\) : \(V(x) = (12 - 2x)^2 \times x\).`},
{n:"2", q:R`Montrer que \(V'(x) = 12(x - 2)(x - 6)\).`, indice:R`Développe \(V(x)\) d'abord : \(V(x) = 4x^3 - 48x^2 + 144x\).`, c:R`\(V(x) = x(144 - 48x + 4x^2) = 4x^3 - 48x^2 + 144x\), donc \(V'(x) = 12x^2 - 96x + 144 = 12(x^2 - 8x + 12)\). Or \((x - 2)(x - 6) = x^2 - 8x + 12\). Donc \(V'(x) = 12(x - 2)(x - 6)\).`},
{n:"3", q:R`Dresser le tableau de variations de \(V\) sur \(]0\,;6[\).`, c:R`Sur \(]0\,;6[\), \(x - 6 < 0\) : \(V'(x)\) est du signe de \(-(x - 2)\), positif pour \(x < 2\), négatif pour \(x > 2\).
${tv({x:["0", "2", "6"], rows:[{l:"V'(x)", c:["", "+", "0", "-", ""]}, {l:"V", c:["", "up", "128", "down", ""]}]})}`},
{n:"4", q:R`Pour quelle valeur de \(x\) le volume est-il maximal ? Quel est ce volume maximal ?`, c:R`Pour \(x = 2\) cm : \(V(2) = 2 \times 8^2 = 128\) cm³.`},
]},
];

{id:"n-festival", parcours:["nonspe"], groupe:"Probabilités", titre:"Festival : tableau croisé et probabilités conditionnelles", themes:["Tableau à double entrée", "Probabilités conditionnelles", "Indépendance"], duree:30, niveau:"Type bac", chaps:["ns-probas", "ns-stats"],
source:"Sur le modèle de l'exercice 1 du sujet de juin 2026 (sans spécialité) : tableau à double entrée et probabilités conditionnelles.",
enonce:R`<p>Un festival a accueilli 1 200 spectateurs. Chacun a acheté soit un pass « 1 jour », soit un pass « 3 jours ». On a relevé l'âge des spectateurs :</p>
<div class="table-scroll"><table class="tbl c"><tr><th></th><th>Pass 1 jour</th><th>Pass 3 jours</th><th>Total</th></tr>
<tr><td><b>Moins de 25 ans</b></td><td>180</td><td>420</td><td>600</td></tr>
<tr><td><b>25 ans ou plus</b></td><td>360</td><td>240</td><td>600</td></tr>
<tr><td><b>Total</b></td><td>540</td><td>660</td><td>1 200</td></tr></table></div>
<p>On choisit un spectateur au hasard. On note \(J\) l'événement « le spectateur a moins de 25 ans » et \(T\) l'événement « le spectateur a un pass 3 jours ».</p>`,
questions:[
{n:"1", q:R`Calculer \(P(J)\), \(P(T)\) et \(P(J \cap T)\).`, c:R`\(P(J) = \frac{600}{1\,200} = 0{,}5\) ; \(P(T) = \frac{660}{1\,200} = 0{,}55\) ; \(P(J \cap T) = \frac{420}{1\,200} = 0{,}35\).`},
{n:"2", q:R`Calculer \(P_J(T)\) et interpréter ce résultat.`, c:R`\(P_J(T) = \frac{420}{600} = 0{,}7\) : 70 % des spectateurs de moins de 25 ans ont un pass 3 jours.`},
{n:"3", q:R`Un spectateur a un pass 3 jours. Quelle est la probabilité qu'il ait moins de 25 ans ? Donner la valeur exacte sous forme de fraction irréductible.`, indice:R`On se restreint à la colonne « Pass 3 jours ».`, c:R`\(P_T(J) = \frac{420}{660} = \frac{42}{66} = \frac{7}{11}\).`},
{n:"4", q:R`Les événements \(J\) et \(T\) sont-ils indépendants ? Justifier.`, c:R`\(P(J) \times P(T) = 0{,}5 \times 0{,}55 = 0{,}275\) et \(P(J \cap T) = 0{,}35\). Ces nombres sont différents : \(J\) et \(T\) ne sont pas indépendants. (Ou : \(P_J(T) = 0{,}7 \ne P(T) = 0{,}55\).)`},
{n:"5", q:R`Calculer \(P(J \cup T)\).`, c:R`\(P(J \cup T) = P(J) + P(T) - P(J \cap T) = 0{,}5 + 0{,}55 - 0{,}35 = 0{,}7\).`},
{n:"6", q:R`Le pass 1 jour coûte 40 € et le pass 3 jours 90 €. Calculer la recette totale du festival, puis le prix moyen payé par spectateur.`, c:R`Recette : \(540 \times 40 + 660 \times 90 = 21\,600 + 59\,400 = 81\,000\) €. Prix moyen : \(\frac{81\,000}{1\,200} = 67{,}50\) €.`},
]},
{id:"n-capital", parcours:["nonspe"], groupe:"Suites", titre:"Placer un capital : intérêts simples ou composés", themes:["Suite arithmétique", "Suite géométrique", "Évolutions"], duree:30, niveau:"Type bac", chaps:["ns-arith", "ns-geom", "ns-proportions"],
source:"Sur le modèle de l'exercice 2 du sujet de juin 2026 (sans spécialité) : suites arithmétiques et géométriques, évolution d'un capital.",
enonce:R`<p>Léa dispose de 5 000 € qu'elle souhaite placer. Deux offres lui sont proposées :</p>
<ul><li><b>Offre A</b> : le capital augmente de 150 € chaque année.</li>
<li><b>Offre B</b> : le capital augmente de 2,5 % chaque année (intérêts composés).</li></ul>
<p>On note \(a_n\) et \(b_n\) le capital, en euros, après \(n\) années avec l'offre A et avec l'offre B. Ainsi \(a_0 = b_0 = 5\,000\).</p>`,
questions:[
{n:"1", partie:"Partie A — Offre A", q:R`Calculer \(a_1\) et \(a_2\). Quelle est la nature de la suite \((a_n)\) ? Exprimer \(a_n\) en fonction de \(n\).`, c:R`\(a_1 = 5\,150\), \(a_2 = 5\,300\). On ajoute 150 chaque année : \((a_n)\) est arithmétique de raison 150, donc \(a_n = 5\,000 + 150n\).`},
{n:"2", partie:"Partie A — Offre A", q:R`Au bout de combien d'années le capital dépassera-t-il 6 000 € avec l'offre A ?`, c:R`\(5\,000 + 150n > 6\,000 \iff 150n > 1\,000 \iff n > \frac{20}{3} \approx 6{,}7\). Il faut 7 années.`},
{n:"3", partie:"Partie B — Offre B", q:R`Calculer \(b_1\) et \(b_2\).`, c:R`\(b_1 = 5\,000 \times 1{,}025 = 5\,125\) ; \(b_2 = 5\,125 \times 1{,}025 = 5\,125 + 128{,}125 = 5\,253{,}125\), soit environ 5 253,13 €.`},
{n:"4", partie:"Partie B — Offre B", q:R`Justifier que \((b_n)\) est géométrique, préciser sa raison, puis exprimer \(b_n\) en fonction de \(n\).`, c:R`Augmenter de 2,5 % revient à multiplier par \(1{,}025\) : \(b_{n+1} = 1{,}025\,b_n\). La suite est géométrique de raison \(1{,}025\) et \(b_n = 5\,000 \times 1{,}025^n\).`},
{n:"5", partie:"Partie B — Offre B", q:R`Quel est le taux d'évolution global du capital sur deux ans avec l'offre B ?`, c:R`\(1{,}025^2 = 1{,}050625\) : une hausse de 5,0625 % (un peu plus que \(2 \times 2{,}5\,\% = 5\,\%\)).`},
{n:"6", partie:"Partie C — Comparaison", q:R`On donne \(1{,}025^{10} \approx 1{,}28\) et \(1{,}025^{20} \approx 1{,}64\). Quelle offre est la plus avantageuse pour un placement de 10 ans ? de 20 ans ?`, c:R`Après 10 ans : \(a_{10} = 6\,500\) € et \(b_{10} \approx 5\,000 \times 1{,}28 = 6\,400\) € : l'offre A est meilleure.<br>Après 20 ans : \(a_{20} = 8\,000\) € et \(b_{20} \approx 5\,000 \times 1{,}64 = 8\,200\) € : l'offre B est meilleure. La croissance exponentielle finit par dépasser la croissance linéaire.`},
]},

source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>Le prix moyen du kilowattheure d'électricité pour un foyer était de 0,20 € en 2022. Le tableau donne l'indice du prix (base 100 en 2022).</p>
<div class="table-scroll"><table class="tbl c"><tr><th>Année</th><td>2022</td><td>2023</td><td>2024</td><td>2025</td></tr><tr><th>Indice</th><td>100</td><td>110</td><td>121</td><td>108,9</td></tr></table></div>`,
questions:[
{n:"1", q:R`Quel était le prix du kilowattheure en 2023 ? en 2024 ?`, c:R`2023 : \(0{,}20 \times 1{,}10 = 0{,}22\) € ; 2024 : \(0{,}20 \times 1{,}21 = 0{,}242\) €.`},
{n:"2", q:R`Calculer le taux d'évolution du prix entre 2023 et 2024.`, indice:R`Attention : on ne soustrait pas les indices, on fait un quotient.`, c:R`\(\frac{121}{110} = 1{,}1\) : une hausse de 10 % (et non de 11 %).`},
{n:"3", q:R`Montrer que le taux d'évolution annuel moyen entre 2022 et 2024 est de 10 %.`, c:R`Sur deux ans, le coefficient est \(1{,}21\). On cherche \(t\) tel que \((1 + t)^2 = 1{,}21\) : \(1 + t = 1{,}21^{\frac12} = \sqrt{1{,}21} = 1{,}1\), donc \(t = 10\,\%\).`},
{n:"4", q:R`Calculer le taux d'évolution entre 2024 et 2025.`, c:R`\(\frac{108{,}9}{121} = 0{,}9\) : une baisse de 10 %.`},
{n:"5", q:R`Un journaliste écrit : « Après deux hausses de 10 % et une baisse de 10 %, le prix a augmenté de 10 % depuis 2022. » A-t-il raison ?`, c:R`Non : \(1{,}1 \times 1{,}1 \times 0{,}9 = 1{,}089\) ; l'indice 108,9 montre une hausse de 8,9 % depuis 2022. Les pourcentages ne s'additionnent pas.`},
{n:"6", q:R`Quelle baisse en pourcentage aurait-il fallu en 2025 pour revenir au prix de 2022 ? On donne \(\frac{1}{1{,}21} \approx 0{,}826\).`, c:R`Le coefficient réciproque de \(1{,}21\) est \(\frac{1}{1{,}21} \approx 0{,}826\) : une baisse d'environ 17,4 %.`},
]},

questions:[
{n:"1", q:R`Un ajustement affine vous paraît-il justifié ? Pourquoi ?`, c:R`Oui : les points du nuage sont à peu près alignés (forme allongée).`},
{n:"2", q:R`Calculer les coordonnées du point moyen \(G\) du nuage.`, c:R`\(\bar x = \frac{0 + 1 + 2 + 3 + 4 + 5}{6} = \frac{15}{6} = 2{,}5\) et \(\bar y = \frac{2 + 3 + 4 + 5{,}5 + 6 + 6{,}5}{6} = \frac{27}{6} = 4{,}5\). \(G(2{,}5\,;4{,}5)\).`},
{n:"3", q:R`On choisit comme droite d'ajustement la droite \(d\) d'équation \(y = 0{,}9x + 2{,}25\) (tracée sur le graphique). Vérifier que \(d\) passe par \(G\).`, c:R`\(0{,}9 \times 2{,}5 + 2{,}25 = 2{,}25 + 2{,}25 = 4{,}5 = \bar y\) : \(G \in d\).`},
{n:"4", q:R`Selon ce modèle, combien de voitures électriques seront immatriculées en 2028 ?`, c:R`2028 correspond à \(x = 8\) : \(y = 0{,}9 \times 8 + 2{,}25 = 7{,}2 + 2{,}25 = 9{,}45\), soit environ 9 450 voitures.`},
{n:"5", q:R`À partir de quelle année ce nombre dépassera-t-il 10 000 ?`, c:R`\(0{,}9x + 2{,}25 > 10 \iff 0{,}9x > 7{,}75 \iff x > \frac{7{,}75}{0{,}9} \approx 8{,}6\). À partir du rang 9, soit en 2029.`},
{n:"6", q:R`Quelle critique peut-on faire de ces prévisions ?`, c:R`Ce sont des extrapolations : on suppose que la tendance reste linéaire au-delà des données. En réalité, la croissance peut accélérer (aides, nouveaux modèles) ou ralentir (saturation du marché).`},
]},
{id:"n-usine", parcours:["nonspe"], groupe:"Probabilités", titre:"Pièces défectueuses : arbre pondéré", themes:["Arbre pondéré", "Probabilités totales", "Indépendance"], duree:25, niveau:"Type bac", chaps:["ns-probas"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>Une usine fabrique des pièces sur deux machines. La machine 1 produit 60 % des pièces et la machine 2 le reste. 3 % des pièces de la machine 1 et 5 % des pièces de la machine 2 sont défectueuses. On choisit une pièce au hasard ; on note \(M\) « la pièce vient de la machine 1 » et \(D\) « la pièce est défectueuse ».</p>`,
questions:[
{n:"1", q:R`Construire un arbre pondéré décrivant la situation.`, c:R`${tree({b:[{t:"M", p:"0,6", s:[{t:"D", p:"0,03"}, {t:"D̅", p:"0,97"}]}, {t:"M̅", p:"0,4", s:[{t:"D", p:"0,05"}, {t:"D̅", p:"0,95"}]}]})}`},
{n:"2", q:R`Calculer la probabilité que la pièce vienne de la machine 1 et soit défectueuse.`, c:R`\(P(M \cap D) = 0{,}6 \times 0{,}03 = 0{,}018\).`},
{n:"3", q:R`Montrer que \(P(D) = 0{,}038\). Interpréter.`, c:R`\(P(D) = P(M \cap D) + P(\bar M \cap D) = 0{,}018 + 0{,}4 \times 0{,}05 = 0{,}018 + 0{,}02 = 0{,}038\) : 3,8 % des pièces de l'usine sont défectueuses.`},
{n:"4", q:R`Une pièce est défectueuse. Quelle est la probabilité qu'elle vienne de la machine 2 ? Arrondir au centième.`, c:R`\(P_D(\bar M) = \frac{0{,}02}{0{,}038} = \frac{20}{38} = \frac{10}{19} \approx 0{,}53\).`},
{n:"5", q:R`Les événements \(M\) et \(D\) sont-ils indépendants ?`, c:R`\(P(M) \times P(D) = 0{,}6 \times 0{,}038 = 0{,}0228 \ne 0{,}018 = P(M \cap D)\) : ils ne sont pas indépendants (la machine d'origine influe sur le risque de défaut).`},
{n:"6", q:R`On prélève deux pièces au hasard ; on admet que les tirages sont indépendants. Quelle est la probabilité qu'aucune ne soit défectueuse ? Donner le calcul sans l'effectuer, puis une valeur approchée sachant que \(0{,}962^2 \approx 0{,}925\).`, c:R`\(P(\bar D) = 1 - 0{,}038 = 0{,}962\). Probabilité qu'aucune ne soit défectueuse : \(0{,}962^2 \approx 0{,}925\).`},
]},
{id:"n-qcm-hasard", parcours:["nonspe"], groupe:"Probabilités", titre:"Répondre au hasard : répétition d'épreuves de Bernoulli", themes:["Épreuve de Bernoulli", "Arbre à plusieurs niveaux", "Au moins un"], duree:25, niveau:"Type bac", chaps:["ns-probas"],
source:"Exercice d'entraînement original sur la répétition d'épreuves de Bernoulli (nouveauté du programme 2026).",
enonce:R`<p>Un QCM comporte 4 questions. Pour chacune, trois réponses sont proposées, dont une seule est exacte. Un élève répond au hasard à chaque question, de façon indépendante.</p>`,
questions:[
{n:"1", q:R`Justifier que la réponse à une question est une épreuve de Bernoulli dont on précisera la probabilité de succès.`, c:R`Il y a deux issues : réponse juste (succès) ou fausse (échec). La probabilité de succès est \(p = \frac13\) et celle d'échec \(\frac23\).`},
{n:"2", q:R`Calculer la probabilité que l'élève réponde juste aux 4 questions, puis qu'il se trompe aux 4 questions.`, c:R`4 succès : \(\left(\frac13\right)^4 = \frac{1}{81}\). 4 échecs : \(\left(\frac23\right)^4 = \frac{16}{81}\).`},
{n:"3", q:R`En déduire la probabilité qu'il ait au moins une bonne réponse.`, c:R`C'est l'événement contraire de « aucune bonne réponse » : \(1 - \frac{16}{81} = \frac{65}{81}\).`},
{n:"4", q:R`Combien de chemins de l'arbre correspondent à exactement une bonne réponse ? En déduire la probabilité d'avoir exactement une bonne réponse.`, indice:R`La bonne réponse peut être à la 1<sup>re</sup>, 2<sup>e</sup>, 3<sup>e</sup> ou 4<sup>e</sup> question.`, c:R`4 chemins (la bonne réponse est à l'une des 4 questions), chacun de probabilité \(\frac13 \times \left(\frac23\right)^3 = \frac{8}{81}\). Total : \(4 \times \frac{8}{81} = \frac{32}{81}\).`},
{n:"5", q:R`On admet que la probabilité d'avoir exactement 3 bonnes réponses est \(\frac{8}{81}\). Calculer la probabilité d'avoir exactement 2 bonnes réponses.`, c:R`La somme des probabilités de 0, 1, 2, 3 et 4 bonnes réponses vaut 1 : \(P(2) = 1 - \frac{16 + 32 + 8 + 1}{81} = \frac{81 - 57}{81} = \frac{24}{81} = \frac{8}{27}\). (Vérification : 6 chemins de probabilité \(\frac19 \times \frac49 = \frac{4}{81}\).)`},
]},
{id:"n-benefice", parcours:["nonspe"], groupe:"Fonctions", titre:"Bénéfice d'un artisan : modélisation quadratique", themes:["Second degré", "Forme factorisée", "Lecture graphique", "Maximum"], duree:25, niveau:"Type bac", chaps:["ns-quadratique"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>Un artisan fabrique et vend des lampes. Son bénéfice, en centaines d'euros, pour \(x\) dizaines de lampes vendues (\(x \in [0\,;14]\)), est \(B(x) = -x^2 + 14x - 24\). Sa courbe est donnée ci-dessous.</p>
${graph({xmin:-0.5, xmax:14.5, ymin:-26, ymax:30, w:340, h:260, stepX:1, stepY:5, labelX:2, labelY:10, fns:[{f:x => -x * x + 14 * x - 24, from:0, to:14}], alt:"Parabole du bénéfice"})}`,
questions:[
{n:"1", q:R`Calculer \(B(0)\) et interpréter.`, c:R`\(B(0) = -24\) : sans aucune vente, l'artisan perd 2 400 € (ses frais fixes).`},
{n:"2", q:R`Vérifier que \(B(x) = -(x - 2)(x - 12)\).`, c:R`\(-(x - 2)(x - 12) = -(x^2 - 12x - 2x + 24) = -(x^2 - 14x + 24) = -x^2 + 14x - 24 = B(x)\).`},
{n:"3", q:R`Résoudre \(B(x) = 0\), puis déterminer pour quelles quantités l'artisan réalise un bénéfice positif. Contrôler sur le graphique.`, c:R`Produit nul : \(x = 2\) ou \(x = 12\). Comme le coefficient de \(x^2\) est négatif, \(B(x) > 0\) entre les racines : pour \(x \in\, ]2\,;12[\), c'est-à-dire entre 20 et 120 lampes. Sur le graphique, la courbe est au-dessus de l'axe des abscisses entre 2 et 12.`},
{n:"4", q:R`Déterminer le nombre de lampes à vendre pour un bénéfice maximal, et ce bénéfice.`, c:R`Abscisse du sommet : \(\frac{2 + 12}{2} = 7\) (ou \(-\frac{14}{2 \times (-1)} = 7\)). \(B(7) = -49 + 98 - 24 = 25\). Bénéfice maximal : 2 500 € pour 70 lampes.`},
{n:"5", q:R`Par lecture graphique, pour combien de lampes le bénéfice est-il égal à 2 100 € ? Retrouver ce résultat par le calcul.`, indice:R`\(B(x) = 21 \iff -x^2 + 14x - 45 = 0 \iff x^2 - 14x + 45 = 0\). Vérifie que \((x - 5)(x - 9) = x^2 - 14x + 45\).`, c:R`On lit \(x = 5\) et \(x = 9\). Calcul : \(B(x) = 21 \iff x^2 - 14x + 45 = 0 \iff (x - 5)(x - 9) = 0\) (on vérifie en développant), d'où 50 ou 90 lampes.`},
]},
{id:"n-medicament", parcours:["nonspe"], groupe:"Fonctions", titre:"Élimination d'un médicament : fonction exponentielle", themes:["Fonction exponentielle", "Décroissance", "Demi-vie", "Taux moyen"], duree:25, niveau:"Type bac", chaps:["ns-expo", "ns-geom"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>On injecte 50 mg d'un médicament à un patient. La quantité de médicament présente dans le sang, \(t\) heures après l'injection, est modélisée par \(m(t) = 50 \times 0{,}8^t\) (en mg), pour \(t \ge 0\).</p>`,
questions:[
{n:"1", q:R`Calculer \(m(1)\), \(m(2)\) et \(m(3)\).`, c:R`\(m(1) = 40\) mg ; \(m(2) = 50 \times 0{,}64 = 32\) mg ; \(m(3) = 50 \times 0{,}512 = 25{,}6\) mg.`},
{n:"2", q:R`Quel est le sens de variation de \(m\) ? Quel pourcentage de médicament est éliminé chaque heure ?`, c:R`La base \(0{,}8\) est comprise entre 0 et 1 : \(m\) est décroissante. Le coefficient multiplicateur horaire est \(0{,}8 = 1 - 0{,}2\) : 20 % du médicament est éliminé chaque heure.`},
{n:"3", q:R`On donne \(\sqrt{0{,}8} \approx 0{,}894\). Calculer la quantité présente une demi-heure après l'injection.`, c:R`\(m(0{,}5) = 50 \times 0{,}8^{\frac12} = 50 \times \sqrt{0{,}8} \approx 50 \times 0{,}894 = 44{,}7\) mg.`},
{n:"4", q:R`Justifier que la demi-vie du médicament est d'environ 3 heures.`, c:R`\(m(3) = 25{,}6 \approx 25 = \frac{50}{2}\) : au bout de 3 heures environ, la quantité a été divisée par 2.`},
{n:"5", q:R`Montrer que pour tout \(t \ge 0\), \(m(t + 2) = 0{,}64 \times m(t)\). Interpréter.`, c:R`\(m(t + 2) = 50 \times 0{,}8^{t + 2} = 50 \times 0{,}8^t \times 0{,}8^2 = 0{,}64\,m(t)\) : toutes les deux heures, la quantité est multipliée par 0,64, soit une baisse de 36 %, quel que soit l'instant de départ.`},
{n:"6", q:R`Le médicament n'est plus efficace en dessous de 10 mg. En utilisant \(0{,}8^7 \approx 0{,}21\) et \(0{,}8^8 \approx 0{,}17\), déterminer au bout de combien d'heures entières il faut réinjecter.`, c:R`\(m(7) \approx 50 \times 0{,}21 = 10{,}5\) mg et \(m(8) \approx 50 \times 0{,}17 = 8{,}5\) mg. La quantité passe sous 10 mg entre 7 et 8 heures : il faut réinjecter au bout de 7 heures environ.`},
]},
{id:"n-abonnes", parcours:["nonspe"], groupe:"Suites", titre:"Abonnés : croissance linéaire ou exponentielle ?", themes:["Suite arithmétique", "Suite géométrique", "Comparaison"], duree:20, niveau:"Type bac", chaps:["ns-arith", "ns-geom"],
source:"Exercice d'entraînement original, construit comme un exercice type bac.",
enonce:R`<p>Deux créateurs de contenu ont chacun 500 abonnés au départ. Le nombre d'abonnés de Noé augmente de 120 par mois ; celui d'Inès augmente de 20 % par mois. On note \(u_n\) et \(v_n\) les nombres d'abonnés de Noé et d'Inès au bout de \(n\) mois.</p>
<p>On donne : \(1{,}2^2 = 1{,}44\) ; \(1{,}2^3 = 1{,}728\) ; \(1{,}2^4 \approx 2{,}07\).</p>`,
questions:[
{n:"1", q:R`Exprimer \(u_n\) et \(v_n\) en fonction de \(n\).`, c:R`\((u_n)\) est arithmétique de raison 120 : \(u_n = 500 + 120n\). \((v_n)\) est géométrique de raison \(1{,}2\) : \(v_n = 500 \times 1{,}2^n\).`},
{n:"2", q:R`Compléter le tableau pour \(n = 1\) à \(4\).`, c:R`<div class="table-scroll"><table class="tbl c"><tr><th>\(n\)</th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>\(u_n\)</th><td>620</td><td>740</td><td>860</td><td>980</td></tr><tr><th>\(v_n\)</th><td>600</td><td>720</td><td>864</td><td>≈ 1 035</td></tr></table></div>`},
{n:"3", q:R`À partir de quel mois Inès a-t-elle plus d'abonnés que Noé ?`, c:R`\(v_2 = 720 < u_2 = 740\) mais \(v_3 = 864 > u_3 = 860\) : dès le 3<sup>e</sup> mois. Ensuite l'écart se creuse, car une croissance exponentielle finit toujours par dépasser une croissance linéaire.`},
{n:"4", q:R`Calculer la variation absolue puis la variation relative du nombre d'abonnés d'Inès entre le mois 2 et le mois 3. Même question pour Noé. Que remarque-t-on ?`, c:R`Inès : \(+144\) abonnés, soit \(\frac{144}{720} = 20\,\%\). Noé : \(+120\) abonnés, soit \(\frac{120}{740} \approx 16{,}2\,\%\). Pour Noé, c'est la variation <b>absolue</b> qui est constante ; pour Inès, c'est la variation <b>relative</b>.`},
]},
];

{titre:"Une fonction rationnelle", points:5, enonce:R`<p>Soit \(f\) la fonction définie sur \(]1\,;+\infty[\) par \(f(x) = \dfrac{x^2 + 3}{x - 1}\).</p>`,

{n:"2", q:R`Montrer que \(f'(x) = \dfrac{(x - 3)(x + 1)}{(x - 1)^2}\).`, c:R`Avec la question 1 : \(f'(x) = 1 - \frac{4}{(x - 1)^2} = \frac{(x - 1)^2 - 4}{(x - 1)^2} = \frac{(x - 1 - 2)(x - 1 + 2)}{(x - 1)^2} = \frac{(x - 3)(x + 1)}{(x - 1)^2}\).`},
{n:"3", q:R`Étudier les variations de \(f\) et préciser son minimum.`, c:R`Sur \(]1\,;+\infty[\), \((x - 1)^2 > 0\) et \(x + 1 > 0\) : \(f'(x)\) est du signe de \(x - 3\). \(f\) est décroissante sur \(]1\,;3]\), croissante sur \([3\,;+\infty[\), de minimum \(f(3) = \frac{12}{2} = 6\).`},

<p>On note \(a_n\) et \(g_n\) les quantités (en tonnes) en \(2026 + n\) avec chaque plan. On donne : \(0{,}95^4 \approx 0{,}815\) ; \(0{,}95^5 \approx 0{,}774\) ; \(0{,}95^{10} \approx 0{,}599\).</p>`,

]},
]},

      <div class="box card left" style="cursor:default"><div class="card-title">📘 Cours</div><div class="card-sub">${chs.filter(c => rev.includes(c.id)).length} / ${chs.length} chapitres révisés</div><div class="pbar"><i style="width:${pctCh}%"></i></div></div>
      <div class="box card left" style="cursor:default"><div class="card-title">⚡ Automatismes</div><div class="card-sub">Maîtrise moyenne : ${pctAu} %${sc.serie ? ` · meilleure série : ${tn2(sc.serie.best6)} / 6` : ""}</div><div class="pbar"><i style="width:${pctAu}%"></i></div></div>
      <div class="box card left" style="cursor:default"><div class="card-title">✍️ Exercices</div><div class="card-sub">${evals.length} / ${exs.length} faits · réussite ${pctEx} %</div><div class="pbar"><i style="width:${pctEx}%"></i></div></div>
      <div class="box card left" style="cursor:default"><div class="card-title">⏱️ Sujets blancs</div><div class="card-sub">${sujetsP().filter(s => ss[s.id] !== undefined).length} / ${sujetsP().length} commencés</div><div class="pbar"><i style="width:${sujetsP().length ? sujetsP().filter(s => ss[s.id] !== undefined).length / sujetsP().length * 100 : 0}%"></i></div></div>
    </div>
    <div class="fiche">
      <div class="section"><h3>À travailler en priorité</h3>
        ${weak.length ? `<p><b>Automatismes fragiles (moins de 70 %) :</b> ${weak.join(", ")}.</p>` : ""}
        ${todo.length ? `<p><b>Automatismes jamais travaillés :</b> ${todo.join(", ")}.</p>` : ""}
        ${chs.filter(c => !rev.includes(c.id)).length ? `<p><b>Chapitres pas encore révisés :</b> ${chs.filter(c => !rev.includes(c.id)).map(c => `<a href="#chapitre/${c.id}">${c.titre}</a>`).join(", ")}.</p>` : `<p>✓ Tous les chapitres sont marqués comme révisés.</p>`}
        ${exs.filter(e => ev[e.id] === 0).length ? `<p><b>Exercices à refaire :</b> ${exs.filter(e => ev[e.id] === 0).map(e => `<a href="#exercice/${e.id}">${e.titre}</a>`).join(", ")}.</p>` : ""}
      </div>
      <div class="section"><h3>Automatismes par thème</h3>${ths.map(t => `<div class="stat-row"><a href="#auto/${t.id}">${t.t}</a><span class="sv">${sc[t.id] ? sc[t.id].best + " %" : "—"}</span></div>`).join("")}</div>
      <div class="section"><h3>Flashcards</h3>${decks.filter(d => fs[d.id]).length ? decks.filter(d => fs[d.id]).map(d => `<div class="stat-row"><span>${d.titre}</span><span class="sv">${fs[d.id].ok} / ${fs[d.id].n}</span></div>`).join("") : `<p>Aucun paquet terminé pour l'instant.</p>`}</div>
    </div>
    <div class="toolbar"><button class="btn" onclick="resetProgress()">Effacer ma progression</button></div>`;
  return {title:"Ma progression", html};
}
function resetProgress(){
  if (!confirm("Effacer toute ta progression en maths (chapitres, scores, exercices, flashcards) ?")) return;
  ["bacmaths-revises","bacmaths-exos","bacmaths-auto","bacmaths-sujets","bacmaths-fc"].forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
  render();
}
let DECKS = null;
function allDecks(){
  if (DECKS) return DECKS;
  DECKS = [];
  chapsP().forEach(c => { if (c.fc && c.fc.length) DECKS.push({id:"ch-" + c.id, titre:c.titre, sub:c.theme, cartes:c.fc}); });
  FLASH_EXTRA.filter(inP).forEach(d => DECKS.push(d));
  return DECKS;
}
function viewFlashcards(){
  const decks = allDecks(), fs = fcScores();
  const all = decks.flatMap(d => d.cartes);
  const html = `<div class="view-head"><div class="kicker">Mémorisation</div><h2>Flashcards</h2>
    <p class="meta">Retourne la carte, puis indique si tu savais. À la fin, tu peux revoir seulement les cartes ratées.</p></div>
    <div class="list"><button class="card" onclick="fcRandom()"><div class="card-title">🎲 30 cartes au hasard</div><div class="card-sub">Pioche dans tous les paquets (${all.length} cartes)</div></button>
    ${decks.map(d => `<button class="card" onclick="fcStart('${d.id}')">${fs[d.id] ? `<span class="done-mark ${fs[d.id].ok / fs[d.id].n >= 0.8 ? "" : "mid"}">${fs[d.id].ok} / ${fs[d.id].n}</span>` : ""}
      <div class="card-title">${d.titre}</div><div class="card-sub">${d.sub}</div><span class="card-meta">${d.cartes.length} cartes</span></button>`).join("")}</div>`;
  return {title:"Flashcards", html};
}
let fcDeck = [], fcIndex = 0, fcTitle = "", fcRes = [], fcDeckId = null;
function fcRandom(){ fcDeckId = null; fcTitle = "30 cartes au hasard"; fcBegin(shuffle(allDecks().flatMap(d => d.cartes)).slice(0, 30)); }
function fcStart(id, cards){
  const d = allDecks().find(x => x.id === id); if (!d && !cards) return;
  if (d){ fcTitle = d.titre; fcDeckId = d.id; }
  fcBegin(cards || d.cartes);
}
function fcBegin(cards){
  fcDeck = shuffle(cards); fcIndex = 0; fcRes = new Array(fcDeck.length).fill(null);
  $("#fc-title").textContent = fcTitle;
  $("#fc-overlay").classList.add("open"); document.body.style.overflow = "hidden";
  ["#fc-box","#fc-hint","#fc-controls"].forEach(s => $(s).style.display = "");
  $("#fc-end").style.display = "none";
  fcRender();
}
function fcRender(){
  const c = fcDeck[fcIndex];
  $("#fc-inner").classList.remove("flipped");
  setTimeout(() => { $("#fc-q").innerHTML = c.q; $("#fc-r").innerHTML = c.r; typeset($("#fc-q")); typeset($("#fc-r")); }, 120);
  $("#fc-counter").textContent = (fcIndex + 1) + " / " + fcDeck.length;
  $("#fc-prev").disabled = fcIndex === 0;
}
function fcFlip(){ $("#fc-inner").classList.toggle("flipped"); }
function fcNav(d){
  const i = fcIndex + d;
  if (i < 0) return;
  if (i >= fcDeck.length){ fcEnd(); return; }
  fcIndex = i; fcRender();
}
function fcJudge(ok){ fcRes[fcIndex] = ok; fcNav(1); }
function fcEnd(){
  const ok = fcRes.filter(x => x === true).length;
  const ko = fcDeck.filter((c, i) => fcRes[i] !== true);
  if (fcDeckId){ const fs = fcScores(); fs[fcDeckId] = {ok, n:fcDeck.length}; store.set("bacmaths-fc", fs); }
  ["#fc-box","#fc-hint","#fc-controls"].forEach(s => $(s).style.display = "none");
  const end = $("#fc-end"); end.style.display = "block";
  end.innerHTML = `<h3>${ok === fcDeck.length ? "🎉 Parfait !" : "Paquet terminé"}</h3>
    <p>Tu savais <b>${ok}</b> carte${ok > 1 ? "s" : ""} sur ${fcDeck.length}.</p>
    ${ko.length ? `<button class="btn primary" id="fc-retry">↻ Revoir les ${ko.length} carte${ko.length > 1 ? "s" : ""} à revoir</button>` : ""}
    <button class="btn" id="fc-again">Recommencer tout le paquet</button>
    <button class="btn" onclick="fcClose()">Fermer</button>`;
  const all = fcDeck.slice();
  if (ko.length) $("#fc-retry").onclick = () => { fcDeckId = null; fcBegin(ko); };
  $("#fc-again").onclick = () => fcBegin(all);
}
function fcClose(){ $("#fc-overlay").classList.remove("open"); document.body.style.overflow = ""; if (parseRoute().view === "flashcards") render(); }
document.addEventListener("keydown", e => {
  if ($("#fc-overlay").classList.contains("open")){
    if (e.key === "Escape") fcClose();
    else if ($("#fc-end").style.display === "block") return;
    else if (e.key === " " || e.key === "Enter"){ e.preventDefault(); fcFlip(); }
    else if (e.key === "ArrowRight") fcNav(1);
    else if (e.key === "ArrowLeft") fcNav(-1);
  }
});
let SEARCH_INDEX = null;
function plain(html){
  const d = new DOMParser().parseFromString(html || "", "text/html").body;
  $$("script, style, svg, button", d).forEach(x => x.remove());
  $$("div, p, li, td, th, h3, h4, br", d).forEach(x => x.after(" "));
  return d.textContent.replace(/\\\(|\\\)|\\\[|\\\]/g, " ").replace(/\\(text|mathrm|textbf)\{([^}]*)\}/g, "$2").replace(/\\(dfrac|frac)\{([^}]*)\}\{([^}]*)\}/g, "$2/$3").replace(/\\[a-zA-Z]+/g, " ").replace(/[{}]/g, "").replace(/\s+/g, " ").trim();
}
function buildSearchIndex(){
  const idx = [];
  RUBRIQUES.forEach(r => idx.push({type:"Rubrique", label:r.t, texte:r.sub, href:"#" + r.id}));
  chapsP().forEach(c => idx.push({type:"Cours · " + c.theme, label:c.titre, texte:plain((c.essentiel || "") + c.html), href:"#chapitre/" + c.id}));
  exosP().forEach(e => idx.push({type:"Exercice", label:e.titre, texte:e.themes.join(", ") + " " + plain(e.enonce + e.questions.map(q => q.q).join(" ")), href:"#exercice/" + e.id}));
  themesP().forEach(t => idx.push({type:"Automatismes", label:t.t, texte:t.sub + " " + plain(t.fiche || ""), href:"#auto/" + t.id}));
  idx.push({type:"Formulaire", label:"Formulaire", texte:plain(FORMULAIRE[PARCOURS]), href:"#formulaire"});
  idx.push({type:"Méthode", label:"Méthode", texte:plain(METHODE), href:"#methode"});
  idx.push({type:"L'épreuve", label:"L'épreuve anticipée", texte:plain(EPREUVE.commun + EPREUVE[PARCOURS]), href:"#epreuve"});
  idx.forEach(e => { e.nl = norm(e.label); e.nt = norm(e.texte); });
  return idx;
}
function snippet(e, mots){
  const pos = mots.map(w => e.nt.indexOf(w)).filter(i => i >= 0);
  if (!pos.length) return "";
  const p = Math.min(...pos), a = Math.max(0, p - 60), b = Math.min(e.texte.length, p + 120);
  let s = esc(e.texte.slice(a, b));
  return (a > 0 ? "… " : "") + s + (b < e.texte.length ? " …" : "");
}
function searchResults(q){
  if (!SEARCH_INDEX) SEARCH_INDEX = buildSearchIndex();
  const mots = norm(q).split(/\s+/).filter(Boolean);
  const res = SEARCH_INDEX.filter(e => mots.every(w => e.nl.includes(w) || e.nt.includes(w)))
    .map(e => ({e, s:(e.nl.startsWith(mots[0]) ? 4 : 0) + (mots.every(w => e.nl.includes(w)) ? 3 : 0)}))
    .sort((a, b) => b.s - a.s).slice(0, 30).map(x => x.e);
  if (!res.length) return `<p class="empty-msg" style="margin-top:20px">Aucun résultat pour « ${esc(q)} ».</p>`;
  return res.map(e => `<a class="card left" href="${e.href}"><span class="search-type">${e.type}</span><div class="card-title">${e.label}</div><div class="search-extrait no-math">${snippet(e, mots)}</div></a>`).join("");
}
function clearSearch(){ $("#search").value = ""; renderHome(); $("#search").focus(); }
let nightManual = store.get("bacmaths-night", null);
function isNightHour(){ const h = new Date().getHours(); return h >= 21 || h < 6; }
function applyNight(on){ document.body.classList.toggle("night", on); }
function toggleNight(){
  nightManual = !document.body.classList.contains("night");
  store.set("bacmaths-night", nightManual);
  applyNight(nightManual);
}
applyNight(nightManual === null ? isNightHour() : nightManual);
setInterval(() => { if (nightManual === null) applyNight(isNightHour()); }, 60000);
render();
</script>
