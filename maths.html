.search-wrap { width: 100%; max-width: 560px; position: relative; margin-bottom: 22px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 0; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 14px; letter-spacing: 0.2px;
  padding: 8px 16px; border-radius: 22px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
  box-shadow: var(--shadow); transition: all 0.18s; text-decoration: none;
}
.btn:hover { border-color: var(--accent-mid); transform: translateY(-1px); box-shadow: var(--shadow-lg); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin: 0 auto 26px; }

{id:"equations", t:"Équations et inéquations", sub:"Premier degré, produit nul, carré, inéquations",

{id:"fonctions", t:"Fonctions et lecture graphique", sub:"Images, antécédents, lecture sur une courbe, appartenance",
fiche:R`<ul><li>L'<b>image</b> de \(a\) par \(f\) est \(f(a)\) : on part de \(a\) sur l'axe des abscisses et on lit l'ordonnée du point de la courbe.</li><li>Un <b>antécédent</b> de \(k\) est un nombre \(x\) tel que \(f(x) = k\) : on part de \(k\) sur l'axe des ordonnées.</li><li>Un point \(A(x_A\,;y_A)\) est sur la courbe de \(f\) si et seulement si \(f(x_A) = y_A\).</li></ul>`,
gen(){
  const k = rnd(0, 3);
  if (k <= 1){
    let xs = [-4, -2, 0, 1, 3, 5].map((x, i) => x), ys = xs.map(() => rnd(-3, 4));
    if (new Set(ys).size < 3) return null;
    const f = x => { for (let i = 0; i < xs.length - 1; i++) if (x >= xs[i] && x <= xs[i + 1]) return ys[i] + (ys[i + 1] - ys[i]) * (x - xs[i]) / (xs[i + 1] - xs[i]); return NaN; };
    const g = graph({xmin:-4.5, xmax:5.5, ymin:-4, ymax:5, w:330, h:250, fns:[{f, from:-4, to:5}], alt:"Courbe d'une fonction f"});

        `On part de ${M("x = " + a)} sur l'axe des abscisses, on monte (ou descend) jusqu'à la courbe et on lit l'ordonnée : ${M("f(" + a + ") = " + b)}.`);

      const y0 = ys[i] - kv, y1 = ys[i + 1] - kv;

      if (y1 === 0) sols.add(xs[i + 1]);

      `On trace la droite horizontale d'équation ${M("y = " + kv)} et on compte ses points d'intersection avec la courbe : il y en a ${n}.`);
  }
  if (k === 2){
    const a = rndNZ(-3, 3), c = rnd(-5, 5), x = rnd(-3, 3), y = a * x * x + c, ok = Math.random() < 0.5;
    const yA = ok ? y : y + pick([-2, -1, 1, 2]);
    return mkQ(`Le point ${M("A(" + x + "\\,;" + yA + ")")} appartient-il à la courbe de ${M("f(x) = " + poly([a, 0, c]))} ?`, ok ? "Oui" : "Non", [ok ? "Non" : "Oui", "Il faudrait tracer la courbe pour le savoir", "Seulement si " + M("f") + " est croissante"],
      `On calcule ${M("f(" + x + ") = " + a + " \\times " + par(x) + "^2 + " + par(c) + " = " + y)}. ${ok ? "C'est bien l'ordonnée de " + M("A") + " : le point est sur la courbe." : "Ce n'est pas l'ordonnée " + M(String(yA)) + " de " + M("A") + " : le point n'est pas sur la courbe."}`);
  }
  const a = rndNZ(-3, 3), b = rnd(-5, 5), y = rnd(-6, 6); const x = Q(y - b, a);
  return mkQ(`Soit ${M("f(x) = " + poly([a, b]))}. Quel est l'antécédent de ${M(String(y))} par ${M("f")} ?`, M(qf(x)), [M(String(a * y + b)), M(qf(Q(y + b, a))), M(qf(Q(b - y, a))), M(qf(qadd(x, Q(1))))],
    `On résout ${M(poly([a, b]) + " = " + y)} : ${M(poly([a, 0]) + " = " + (y - b))}, donc ${M("x = " + qf(x))}. (Attention : ${M(String(a * y + b))} est l'<b>image</b> de ${M(String(y))}, pas son antécédent.)`);
}},
{id:"droites", t:"Fonctions affines et droites", sub:"Coefficient directeur, ordonnée à l'origine, équation de droite",
fiche:R`<ul><li>Une fonction affine s'écrit \(f(x) = mx + p\) : \(m\) est le coefficient directeur, \(p\) l'ordonnée à l'origine.</li><li>Coefficient directeur de \((AB)\) : \(m = \frac{y_B - y_A}{x_B - x_A}\).</li><li>\(f\) est croissante si \(m > 0\), décroissante si \(m < 0\), constante si \(m = 0\).</li></ul>`,

      `${M("m = \\frac{y_B - y_A}{x_B - x_A} = \\frac{" + yB + " - " + par(yA) + "}{" + xB + " - " + par(xA) + "} = \\frac{" + (yB - yA) + "}{" + (xB - xA) + "} = " + qf(m))}.`);
  }

      `L'ordonnée à l'origine se lit à l'intersection avec l'axe des ordonnées : ${M("p = " + p)}. Quand ${M("x")} augmente de 1, ${M("y")} ${m > 0 ? "augmente" : "diminue"} de ${Math.abs(m)} : ${M("m = " + m)}. D'où ${M("y = " + poly([m, p]))}.`);

{id:"stats", t:"Statistiques", sub:"Moyenne, médiane, étendue, moyenne pondérée",

<div class="section"><h3>Calculer sans calculatrice</h3>
<h4>Fractions et décimaux</h4>
<ul><li>Connais par cœur : \(\frac12 = 0{,}5\), \(\frac14 = 0{,}25\), \(\frac34 = 0{,}75\), \(\frac15 = 0{,}2\), \(\frac18 = 0{,}125\), \(\frac13 \approx 0{,}333\), \(\frac23 \approx 0{,}667\).</li>
<li>Pour comparer deux fractions, mets-les au même dénominateur ou compare les produits en croix : \(\frac{a}{b} < \frac{c}{d} \iff ad < bc\) (avec \(b, d > 0\)).</li>
<li>Simplifie <b>avant</b> de multiplier : \(\frac{14}{15} \times \frac{25}{21} = \frac{2 \times 7 \times 5 \times 5}{3 \times 5 \times 3 \times 7} = \frac{10}{9}\).</li></ul>
<h4>Multiplier et diviser vite</h4>
<ul><li>Multiplier par 0,5, c'est diviser par 2 ; par 0,25, diviser par 4 ; par 1,5, ajouter la moitié.</li>
<li>Diviser par 0,5, c'est multiplier par 2 ; diviser par 0,2, multiplier par 5.</li>
<li>\(25 \times 4 = 100\), \(125 \times 8 = 1\,000\) : regroupe ces paires.</li>
<li>Distributivité : \(19 \times 7 = 20 \times 7 - 7 = 133\) ; \(102 \times 35 = 3\,500 + 70 = 3\,570\).</li>
<li>Carrés : \(a^2 - b^2 = (a-b)(a+b)\), donc \(49 \times 51 = 50^2 - 1 = 2\,499\).</li></ul>
<h4>Pourcentages</h4>
<ul><li>10 % : diviser par 10 ; 5 % : la moitié de 10 % ; 1 % : diviser par 100 ; 25 % : diviser par 4.</li>
<li>\(p\,\%\) de \(a\) est égal à \(a\,\%\) de \(p\) : 8 % de 50 = 50 % de 8 = 4.</li>
<li>Hausse de \(t\,\%\) : multiplier par \(1 + \frac{t}{100}\) ; baisse de \(t\,\%\) : multiplier par \(1 - \frac{t}{100}\).</li></ul>
<h4>Puissances et racines</h4>
<ul><li>Carrés de 1 à 15 et puissances de 2 jusqu'à \(2^{10} = 1\,024\) : à savoir par cœur.</li>
<li>\(\sqrt{a \times b} = \sqrt a \times \sqrt b\) : \(\sqrt{50} = \sqrt{25 \times 2} = 5\sqrt2\).</li>
<li>Ordres de grandeur : \(\sqrt2 \approx 1{,}41\), \(\sqrt3 \approx 1{,}73\), \(\mathrm e \approx 2{,}72\), \(\pi \approx 3{,}14\).</li></ul>
<div class="astuce"><b>Vérifier un résultat</b>Estime toujours un ordre de grandeur avant de calculer : si tu trouves une probabilité de 1,3 ou un prix négatif, il y a une erreur.</div>

<ul><li><b>Annonce</b> ce que tu fais : « D'après le cours… », « On calcule le discriminant… », « D'après l'arbre… ».</li>

<li><b>Conclus</b> par une phrase qui répond à la question posée, avec l'unité s'il y en a une.</li>
<li>Pour une question « Montrer que… », le résultat est donné : c'est le <b>chemin</b> qui est noté. Ne recopie pas le résultat sans démonstration.</li>
<li>Pour « Déterminer » ou « Calculer », donne la valeur exacte (fraction, racine) sauf si on demande une valeur approchée.</li>
<li>Pour « Justifier », une phrase avec un argument précis suffit souvent.</li></ul>
<div class="exemple"><b>Exemple de rédaction</b>« La fonction \(f\) est dérivable sur \(\mathbb R\) et \(f'(x) = 6x - 12\). Or \(6x - 12 > 0 \iff x > 2\). Donc \(f\) est décroissante sur \(]-\infty\,;2]\) et croissante sur \([2\,;+\infty[\) : elle admet un minimum en \(x = 2\). »</div>

<div class="section"><h3>Les trois formes d'un trinôme</h3>
<div class="def"><b>Définition</b>Une fonction polynôme du second degré (ou trinôme) est une fonction définie sur \(\mathbb R\) par \(f(x) = ax^2 + bx + c\), où \(a\), \(b\), \(c\) sont des réels avec \(a \ne 0\).</div>
<div class="table-scroll"><table class="tbl first">
<tr><th>Forme</th><th>Écriture</th><th>Ce qu'elle donne immédiatement</th></tr>
<tr><td>Développée</td><td>\(ax^2 + bx + c\)</td><td>\(f(0) = c\) (ordonnée à l'origine), calcul de \(\Delta\)</td></tr>
<tr><td>Canonique</td><td>\(a(x - \alpha)^2 + \beta\)</td><td>Le sommet \(S(\alpha\,;\beta)\), les variations, l'extremum</td></tr>
<tr><td>Factorisée</td><td>\(a(x - x_1)(x - x_2)\)</td><td>Les racines \(x_1\) et \(x_2\), le signe</td></tr>
</table></div>
<div class="prop"><b>Propriété</b>Tout trinôme peut s'écrire sous forme canonique \(f(x) = a(x - \alpha)^2 + \beta\) avec \(\alpha = -\dfrac{b}{2a}\) et \(\beta = f(\alpha) = -\dfrac{\Delta}{4a}\).</div>
<div class="exemple"><b>Exemple</b>Forme canonique de \(f(x) = 2x^2 - 12x + 13\).
<div class="sol">\(\alpha = -\frac{-12}{2 \times 2} = 3\) et \(\beta = f(3) = 18 - 36 + 13 = -5\). Donc \(f(x) = 2(x - 3)^2 - 5\). Le sommet est \(S(3\,;-5)\) et, comme \(a = 2 > 0\), \(f\) admet un minimum égal à \(-5\) en \(x = 3\).</div></div>
<details class="demo"><summary>Démonstration : d'où vient la forme canonique ?</summary>
<p>\(ax^2 + bx + c = a\left(x^2 + \frac ba x\right) + c = a\left[\left(x + \frac{b}{2a}\right)^2 - \frac{b^2}{4a^2}\right] + c = a\left(x + \frac{b}{2a}\right)^2 - \frac{b^2 - 4ac}{4a}\).</p>
<p>On reconnaît \(\alpha = -\frac{b}{2a}\) et \(\beta = -\frac{\Delta}{4a}\).</p></details>
</div>
<div class="section"><h3>Parabole et variations</h3>
${graph({xmin:-1, xmax:7, ymin:-6, ymax:6, w:340, h:250, fns:[{f:x => 2 * (x - 3) ** 2 - 5}], segs:[[3, -6, 3, 6]], pts:[{x:3, y:-5, t:"S", dx:8, dy:4}], alt:"Parabole de sommet S(3;-5)"})}
<p>La courbe d'un trinôme est une <b>parabole</b> d'axe de symétrie la droite d'équation \(x = \alpha\).</p>
<div class="table-scroll"><table class="tbl c">
<tr><th>\(a > 0\)</th><th>\(a < 0\)</th></tr>
<tr><td>Parabole « en U » : \(f\) décroissante sur \(]-\infty\,;\alpha]\), croissante sur \([\alpha\,;+\infty[\). <b>Minimum</b> \(\beta\) atteint en \(\alpha\).</td><td>Parabole « en ∩ » : \(f\) croissante sur \(]-\infty\,;\alpha]\), décroissante sur \([\alpha\,;+\infty[\). <b>Maximum</b> \(\beta\) atteint en \(\alpha\).</td></tr>
</table></div>
<div class="astuce"><b>Astuce</b>Si l'on connaît deux points de la parabole de même ordonnée, l'abscisse du sommet est au milieu : avec les racines, \(\alpha = \frac{x_1 + x_2}{2}\).</div>
</div>
<div class="section"><h3>Résoudre ax² + bx + c = 0</h3>
<div class="prop"><b>Théorème</b>On pose \(\Delta = b^2 - 4ac\) (le discriminant).
<ul><li>Si \(\Delta > 0\) : deux solutions \(x_1 = \dfrac{-b - \sqrt\Delta}{2a}\) et \(x_2 = \dfrac{-b + \sqrt\Delta}{2a}\).</li>
<li>Si \(\Delta = 0\) : une solution (racine double) \(x_0 = -\dfrac{b}{2a}\).</li>
<li>Si \(\Delta < 0\) : aucune solution réelle.</li></ul></div>
<div class="exemple"><b>Exemple</b>Résoudre \(2x^2 - 3x - 2 = 0\).
<div class="sol">\(\Delta = (-3)^2 - 4 \times 2 \times (-2) = 9 + 16 = 25 > 0\), \(\sqrt\Delta = 5\). Donc \(x_1 = \frac{3 - 5}{4} = -\frac12\) et \(x_2 = \frac{3 + 5}{4} = 2\). \(S = \left\{-\frac12\,;2\right\}\).</div></div>
<div class="methode"><b>Méthode : éviter le discriminant quand c'est possible</b>
<ul><li>Si \(c = 0\) : on factorise par \(x\). \(3x^2 - 6x = 0 \iff 3x(x - 2) = 0 \iff x = 0\) ou \(x = 2\).</li>
<li>Si \(b = 0\) : on isole \(x^2\). \(4x^2 - 9 = 0 \iff x^2 = \frac94 \iff x = \pm\frac32\).</li>
<li><b>Racine évidente</b> : si \(x_1\) est une racine, l'autre vérifie \(x_1 x_2 = \frac ca\) (et \(x_1 + x_2 = -\frac ba\)). Pour \(x^2 - 5x + 4\), \(1\) est racine (\(1 - 5 + 4 = 0\)), donc \(x_2 = \frac41 = 4\).</li></ul></div>
<div class="piege"><b>Piège</b>Ne pas oublier les parenthèses autour de \(b\) négatif : \((-3)^2 = 9\), pas \(-9\). Et bien diviser <b>tout</b> le numérateur par \(2a\).</div>
</div>
<div class="section"><h3>Factorisation et signe</h3>
<div class="prop"><b>Propriété</b>Si \(\Delta > 0\), \(ax^2 + bx + c = a(x - x_1)(x - x_2)\). Si \(\Delta = 0\), \(ax^2 + bx + c = a(x - x_0)^2\). Si \(\Delta < 0\), le trinôme ne se factorise pas.</div>
<div class="prop"><b>Signe du trinôme</b>
<ul><li>Si \(\Delta < 0\) : \(f(x)\) est toujours du signe de \(a\).</li>
<li>Si \(\Delta = 0\) : \(f(x)\) est du signe de \(a\) et s'annule en \(x_0\).</li>
<li>Si \(\Delta > 0\) : \(f(x)\) est du signe de \(a\) à l'extérieur des racines et du signe de \(-a\) entre les racines.</li></ul></div>
${tv({x:["-\\infty", "x_1", "x_2", "+\\infty"], rows:[{l:"f(x)\\ (a>0)", c:["", "+", "0", "-", "0", "+", ""]}, {l:"f(x)\\ (a<0)", c:["", "-", "0", "+", "0", "-", ""]}]})}
<div class="exemple"><b>Exemple : résoudre une inéquation</b>Résoudre \(-x^2 + x + 6 \ge 0\).
<div class="sol">\(\Delta = 1 + 24 = 25\), racines \(x_1 = \frac{-1 - 5}{-2} = 3\) et \(x_2 = \frac{-1 + 5}{-2} = -2\). Comme \(a = -1 < 0\), le trinôme est positif <b>entre</b> les racines : \(S = [-2\,;3]\).</div></div>
</div>

<div class="exemple"><b>Exemple : optimiser une aire</b>Avec 40 m de clôture, on délimite un enclos rectangulaire contre un mur (trois côtés à clôturer). On note \(x\) la largeur (perpendiculaire au mur). Quelle aire maximale ?

<div class="aretenir"><b>À retenir</b>« Maximum », « minimum », « optimiser » avec une expression du second degré : on cherche le <b>sommet</b> de la parabole.</div>
</div>`,

<li>Une suite peut être définie <b>explicitement</b> (\(u_n = f(n)\)) ou <b>par récurrence</b> (\(u_{n+1} = f(u_n)\) et \(u_0\) donné).</li>

<li>\(1 + 2 + \dots + n = \frac{n(n+1)}{2}\) et, pour \(q \ne 1\), \(1 + q + \dots + q^n = \frac{1 - q^{n+1}}{1 - q}\).</li>

<div class="section"><h3>Définir une suite</h3>
<div class="def"><b>Définition</b>Une suite numérique \((u_n)\) associe à chaque entier naturel \(n\) un réel \(u_n\), appelé terme de rang \(n\).</div>
<div class="table-scroll"><table class="tbl first">
<tr><th>Mode</th><th>Exemple</th><th>Calcul de \(u_3\)</th></tr>
<tr><td>Explicite</td><td>\(u_n = n^2 - 1\)</td><td>Directement : \(u_3 = 9 - 1 = 8\)</td></tr>
<tr><td>Récurrence</td><td>\(u_0 = 2\), \(u_{n+1} = 3u_n - 1\)</td><td>De proche en proche : \(u_1 = 5\), \(u_2 = 14\), \(u_3 = 41\)</td></tr>
</table></div>
<div class="piege"><b>Piège</b>\(u_{n+1}\) (terme suivant) n'est pas \(u_n + 1\) (le terme augmenté de 1). Si \(u_n = 2n + 3\), alors \(u_{n+1} = 2(n + 1) + 3 = 2n + 5\).</div>
</div>
<div class="section"><h3>Suites arithmétiques</h3>
<div class="def"><b>Définition</b>\((u_n)\) est arithmétique de raison \(r\) si, pour tout \(n\), \(u_{n+1} = u_n + r\) : on ajoute toujours le même nombre.</div>
<div class="prop"><b>Propriétés</b>
<ul><li>Terme général : \(u_n = u_0 + nr\) ; plus généralement \(u_n = u_p + (n - p)r\).</li>
<li>Variations : croissante si \(r > 0\), décroissante si \(r < 0\), constante si \(r = 0\).</li>
<li>Les points \((n\,;u_n)\) sont <b>alignés</b> : croissance linéaire.</li>
<li>Somme de termes consécutifs : \(S = \text{(nombre de termes)} \times \dfrac{\text{premier} + \text{dernier}}{2}\).</li></ul></div>
<div class="methode"><b>Méthode : montrer qu'une suite est arithmétique</b>On calcule \(u_{n+1} - u_n\) et on montre que le résultat est une constante \(r\) (qui ne dépend pas de \(n\)).</div>
<div class="exemple"><b>Exemple</b>\(u_n = 5 - 3n\). Alors \(u_{n+1} - u_n = 5 - 3(n + 1) - (5 - 3n) = -3\) : arithmétique de raison \(-3\), de premier terme \(u_0 = 5\).</div>
</div>
<div class="section"><h3>Suites géométriques</h3>
<div class="def"><b>Définition</b>\((u_n)\) est géométrique de raison \(q\) si, pour tout \(n\), \(u_{n+1} = q \times u_n\) : on multiplie toujours par le même nombre.</div>
<div class="prop"><b>Propriétés</b>
<ul><li>Terme général : \(u_n = u_0 \times q^n\) ; plus généralement \(u_n = u_p \times q^{n-p}\).</li>
<li>Pour \(u_0 > 0\) : croissante si \(q > 1\), décroissante si \(0 < q < 1\).</li>
<li>Une évolution de \(t\,\%\) par période donne une suite géométrique de raison \(q = 1 + \frac{t}{100}\).</li>
<li>Somme : pour \(q \ne 1\), \(1 + q + q^2 + \dots + q^n = \dfrac{1 - q^{n+1}}{1 - q}\).</li></ul></div>
<div class="methode"><b>Méthode : montrer qu'une suite est géométrique</b>On exprime \(u_{n+1}\) en fonction de \(u_n\) et on obtient \(u_{n+1} = q\,u_n\). (Si les termes ne s'annulent pas, on peut aussi montrer que \(\frac{u_{n+1}}{u_n}\) est constant.)</div>
<div class="exemple"><b>Exemple</b>Une population de 2 000 bactéries augmente de 5 % par heure. On note \(p_n\) l'effectif au bout de \(n\) heures.
<div class="sol">\(p_{n+1} = 1{,}05\,p_n\) : géométrique de raison \(1{,}05\), donc \(p_n = 2\,000 \times 1{,}05^n\).</div></div>
<details class="demo"><summary>Démonstration de la somme géométrique</summary>
<p>Soit \(S = 1 + q + \dots + q^n\). Alors \(qS = q + q^2 + \dots + q^{n+1}\). En soustrayant : \(S - qS = 1 - q^{n+1}\), donc \(S(1 - q) = 1 - q^{n+1}\) et \(S = \frac{1 - q^{n+1}}{1 - q}\) pour \(q \ne 1\).</p></details>
</div>
<div class="section"><h3>Sens de variation</h3>
<div class="def"><b>Définition</b>\((u_n)\) est croissante si \(u_{n+1} \ge u_n\) pour tout \(n\), décroissante si \(u_{n+1} \le u_n\) pour tout \(n\).</div>
<div class="methode"><b>Méthodes</b>
<ul><li><b>Différence</b> : étudier le signe de \(u_{n+1} - u_n\).</li>
<li><b>Fonction</b> : si \(u_n = f(n)\) avec \(f\) croissante sur \([0\,;+\infty[\), alors \((u_n)\) est croissante.</li>
<li><b>Quotient</b> (termes strictement positifs) : comparer \(\frac{u_{n+1}}{u_n}\) à 1.</li></ul></div>
<div class="exemple"><b>Exemple</b>\(u_n = n^2 - 4n\). \(u_{n+1} - u_n = (n+1)^2 - 4(n+1) - n^2 + 4n = 2n - 3\). Pour \(n \ge 2\), \(2n - 3 > 0\) : la suite est croissante à partir du rang 2.</div>
</div>
<div class="section"><h3>Sommes à connaître</h3>
<div class="prop"><b>Formules</b>\[1 + 2 + 3 + \dots + n = \frac{n(n + 1)}{2} \qquad 1 + q + q^2 + \dots + q^n = \frac{1 - q^{n+1}}{1 - q}\ (q \ne 1)\]</div>
<div class="exemple"><b>Exemple</b>Calculer \(S = 3 + 6 + 12 + \dots + 3 \times 2^{9}\).
<div class="sol">\(S = 3(1 + 2 + \dots + 2^9) = 3 \times \frac{1 - 2^{10}}{1 - 2} = 3 \times (1\,024 - 1) = 3\,069\).</div></div>
<div class="piege"><b>Piège</b>Compter correctement le nombre de termes : de \(u_0\) à \(u_n\), il y a \(n + 1\) termes ; de \(u_1\) à \(u_n\), il y en a \(n\).</div>
</div>
<div class="section"><h3>Comportement à long terme et seuils</h3>
<p>On peut conjecturer le comportement de \((u_n)\) quand \(n\) devient grand à l'aide d'un tableau de valeurs ou d'un graphique : les termes peuvent dépasser tout nombre (ils « tendent vers \(+\infty\) »), se rapprocher d'un nombre, ou osciller.</p>
<ul><li>Pour \(q > 1\) et \(u_0 > 0\), \(u_0 q^n\) devient aussi grand qu'on veut.</li>
<li>Pour \(0 < q < 1\), \(q^n\) se rapproche de 0.</li></ul>
<div class="methode"><b>Méthode : algorithme de seuil</b>Pour trouver le premier rang \(n\) tel que \(u_n\) dépasse un seuil \(S\), on calcule les termes un par un tant que \(u_n \le S\) (voir le chapitre Python).</div>
</div>`,

essentiel:R`<ul>
<li>Taux de variation de \(f\) entre \(a\) et \(a + h\) : \(\frac{f(a + h) - f(a)}{h}\). Sa limite quand \(h \to 0\) est le <b>nombre dérivé</b> \(f'(a)\).</li>
<li>\(f'(a)\) est le coefficient directeur de la tangente en \(a\) : \(y = f'(a)(x - a) + f(a)\).</li>
<li>\((x^n)' = nx^{n-1}\), \(\left(\frac1x\right)' = -\frac1{x^2}\), \((\sqrt x)' = \frac{1}{2\sqrt x}\).</li>
<li>\((u + v)' = u' + v'\), \((ku)' = ku'\), \((uv)' = u'v + uv'\), \(\left(\frac uv\right)' = \frac{u'v - uv'}{v^2}\), \((g(ax + b))' = a\,g'(ax + b)\).</li>
</ul>`,

<div class="section"><h3>Taux de variation et nombre dérivé</h3>
<div class="def"><b>Définition</b>Le taux de variation de \(f\) entre \(a\) et \(a + h\) (\(h \ne 0\)) est \(\tau(h) = \dfrac{f(a + h) - f(a)}{h}\). C'est le coefficient directeur de la sécante passant par \(A(a\,;f(a))\) et \(M(a + h\,;f(a + h))\).</div>
<div class="def"><b>Définition</b>\(f\) est dérivable en \(a\) si \(\tau(h)\) se rapproche d'un nombre réel quand \(h\) se rapproche de 0. Ce nombre est le <b>nombre dérivé</b> de \(f\) en \(a\), noté \(f'(a)\) : \(f'(a) = \lim\limits_{h \to 0} \dfrac{f(a + h) - f(a)}{h}\).</div>
<div class="exemple"><b>Exemple</b>\(f(x) = x^2\) en \(a = 3\).
<div class="sol">\(\frac{(3 + h)^2 - 9}{h} = \frac{6h + h^2}{h} = 6 + h\), qui tend vers 6 quand \(h\) tend vers 0. Donc \(f'(3) = 6\).</div></div>
</div>
<div class="section"><h3>Tangente à une courbe</h3>
${graph({xmin:-1, xmax:4, ymin:-2, ymax:9, w:320, h:260, stepY:1, labelY:2, fns:[{f:x => x * x}, {f:x => 4 * x - 4, cls:"g-c2"}], pts:[{x:2, y:4, t:"A", dx:-16, dy:-6}], alt:"Parabole et sa tangente en A"})}
<div class="prop"><b>Propriété</b>Si \(f\) est dérivable en \(a\), la tangente à la courbe au point d'abscisse \(a\) est la droite passant par \(A(a\,;f(a))\) de coefficient directeur \(f'(a)\). Son équation est :
\[y = f'(a)(x - a) + f(a)\]</div>
<div class="exemple"><b>Exemple</b>Tangente à \(y = x^2\) en \(a = 2\) : \(f(2) = 4\), \(f'(2) = 4\), donc \(y = 4(x - 2) + 4 = 4x - 4\) (droite bleue ci-dessus).</div>
<div class="methode"><b>Lecture graphique de \(f'(a)\)</b>On lit le coefficient directeur de la tangente : on se déplace de 1 vers la droite le long de la tangente et on regarde de combien on monte (\(f'(a) > 0\)) ou on descend (\(f'(a) < 0\)). Une tangente horizontale correspond à \(f'(a) = 0\).</div>
</div>
<div class="section"><h3>Dérivées des fonctions usuelles</h3>
<div class="table-scroll"><table class="tbl c">
<tr><th>\(f(x)\)</th><th>\(f'(x)\)</th><th>Valable sur</th></tr>
<tr><td>\(k\) (constante)</td><td>\(0\)</td><td>\(\mathbb R\)</td></tr>
<tr><td>\(x\)</td><td>\(1\)</td><td>\(\mathbb R\)</td></tr>
<tr><td>\(x^2\)</td><td>\(2x\)</td><td>\(\mathbb R\)</td></tr>
<tr><td>\(x^n\) (\(n \ge 1\) entier)</td><td>\(nx^{n-1}\)</td><td>\(\mathbb R\)</td></tr>
<tr><td>\(\dfrac1x\)</td><td>\(-\dfrac{1}{x^2}\)</td><td>\(]-\infty\,;0[\) et \(]0\,;+\infty[\)</td></tr>
<tr><td>\(\sqrt x\)</td><td>\(\dfrac{1}{2\sqrt x}\)</td><td>\(]0\,;+\infty[\) (pas en 0)</td></tr>
<tr><td>\(\mathrm e^x\)</td><td>\(\mathrm e^x\)</td><td>\(\mathbb R\)</td></tr>
</table></div>
</div>
<div class="section"><h3>Opérations sur les dérivées</h3>
<div class="table-scroll"><table class="tbl c">
<tr><th>Fonction</th><th>Dérivée</th></tr>
<tr><td>\(u + v\)</td><td>\(u' + v'\)</td></tr>
<tr><td>\(k\,u\)</td><td>\(k\,u'\)</td></tr>
<tr><td>\(u \times v\)</td><td>\(u'v + uv'\)</td></tr>
<tr><td>\(\dfrac1v\)</td><td>\(-\dfrac{v'}{v^2}\)</td></tr>
<tr><td>\(\dfrac uv\)</td><td>\(\dfrac{u'v - uv'}{v^2}\)</td></tr>
<tr><td>\(g(ax + b)\)</td><td>\(a\,g'(ax + b)\)</td></tr>
</table></div>
<div class="exemple"><b>Exemple 1 : produit</b>\(f(x) = (2x + 1)\sqrt x\) sur \(]0\,;+\infty[\).
<div class="sol">\(u = 2x + 1\), \(u' = 2\) ; \(v = \sqrt x\), \(v' = \frac{1}{2\sqrt x}\). \(f'(x) = 2\sqrt x + \frac{2x + 1}{2\sqrt x} = \frac{4x + 2x + 1}{2\sqrt x} = \frac{6x + 1}{2\sqrt x}\).</div></div>
<div class="exemple"><b>Exemple 2 : quotient</b>\(f(x) = \dfrac{3x - 1}{x + 2}\) sur \(]-2\,;+\infty[\).
<div class="sol">\(u' = 3\), \(v' = 1\) : \(f'(x) = \frac{3(x + 2) - (3x - 1) \times 1}{(x + 2)^2} = \frac{7}{(x + 2)^2}\).</div></div>
<div class="exemple"><b>Exemple 3 : composée affine</b>\(f(x) = (5x - 2)^3\). Avec \(g(X) = X^3\), \(g'(X) = 3X^2\) : \(f'(x) = 5 \times 3(5x - 2)^2 = 15(5x - 2)^2\).</div>
<div class="piege"><b>Pièges</b>
<ul><li>\((uv)' \ne u'v'\) : la dérivée d'un produit n'est pas le produit des dérivées.</li>
<li>Dans le quotient, l'ordre compte : \(u'v - uv'\), et le dénominateur est \(v^2\).</li>
<li>Ne pas oublier le facteur \(a\) dans \(g(ax + b)\).</li></ul></div>
</div>`,

essentiel:R`<ul>
<li>Sur un intervalle : \(f' \ge 0\) ⇒ \(f\) croissante ; \(f' \le 0\) ⇒ \(f\) décroissante ; \(f' = 0\) ⇒ \(f\) constante.</li>
<li>Si \(f'\) s'annule en \(a\) <b>en changeant de signe</b>, \(f\) admet un extremum local en \(a\).</li>
<li>Méthode : dériver, factoriser \(f'(x)\), étudier son signe (tableau de signes), en déduire le tableau de variations, calculer les valeurs aux bornes et aux extremums.</li>
</ul>`,
html:R`
<div class="section"><h3>Lien entre signe de la dérivée et variations</h3>
<div class="prop"><b>Théorème</b>Soit \(f\) dérivable sur un intervalle \(I\).
<ul><li>Si \(f'(x) \ge 0\) pour tout \(x \in I\), alors \(f\) est croissante sur \(I\).</li>
<li>Si \(f'(x) \le 0\) pour tout \(x \in I\), alors \(f\) est décroissante sur \(I\).</li>
<li>Si \(f'(x) = 0\) pour tout \(x \in I\), alors \(f\) est constante sur \(I\).</li></ul>
Si \(f'(x) > 0\) sauf en des points isolés où elle s'annule, \(f\) est strictement croissante.</div>
<div class="prop"><b>Extremum local</b>Si \(f'\) s'annule en \(a\) en changeant de signe, alors \(f(a)\) est un extremum local : un <b>maximum</b> si \(f'\) passe de \(+\) à \(-\), un <b>minimum</b> si \(f'\) passe de \(-\) à \(+\).</div>
<div class="piege"><b>Piège</b>\(f'(a) = 0\) ne suffit pas : pour \(f(x) = x^3\), \(f'(0) = 0\) mais \(f'\) ne change pas de signe, et \(f\) n'a pas d'extremum en 0.</div>
</div>
<div class="section"><h3>Étudier les variations : la méthode complète</h3>
<ol class="steps">
<li>Préciser l'ensemble de définition et justifier que \(f\) est dérivable.</li>
<li>Calculer \(f'(x)\) et l'écrire sous une forme dont on sait étudier le signe (factorisée, quotient…).</li>
<li>Dresser le tableau de signes de \(f'(x)\).</li>
<li>En déduire le tableau de variations et calculer les images utiles (extremums, bornes).</li>
<li>Conclure en répondant à la question (extremum, nombre de solutions, inégalité…).</li>
</ol>
<div class="exemple"><b>Exemple 1 : un polynôme de degré 3</b>\(f(x) = x^3 - 3x + 1\) sur \([-2\,;3]\).
<div class="sol">\(f'(x) = 3x^2 - 3 = 3(x - 1)(x + 1)\) : trinôme positif à l'extérieur des racines \(-1\) et \(1\). \(f(-2) = -1\), \(f(-1) = 3\), \(f(1) = -1\), \(f(3) = 19\).
${tv({x:["-2", "-1", "1", "3"], rows:[{l:"f'(x)", c:["", "+", "0", "-", "0", "+", ""]}, {l:"f", c:["-1", "up", "3", "down", "-1", "up", "19"]}]})}
Sur \([-2\,;3]\), le maximum est 19 (en 3) et le minimum est \(-1\) (atteint en \(-2\) et en 1).</div></div>
<div class="exemple"><b>Exemple 2 : une fonction rationnelle</b>\(g(x) = \dfrac{x^2 + 4}{x}\) sur \(]0\,;+\infty[\).
<div class="sol">\(g(x) = x + \frac4x\), donc \(g'(x) = 1 - \frac{4}{x^2} = \frac{x^2 - 4}{x^2} = \frac{(x - 2)(x + 2)}{x^2}\). Sur \(]0\,;+\infty[\), \(x^2 > 0\) et \(x + 2 > 0\), donc \(g'(x)\) est du signe de \(x - 2\) : négatif sur \(]0\,;2]\), positif sur \([2\,;+\infty[\). Minimum \(g(2) = 4\).</div></div>
</div>
<div class="section"><h3>Utiliser les variations</h3>
<div class="methode"><b>Démontrer une inégalité</b>Pour montrer que \(f(x) \ge g(x)\) sur \(I\), on étudie \(h(x) = f(x) - g(x)\) : si son minimum sur \(I\) est positif ou nul, l'inégalité est prouvée.</div>
<div class="exemple"><b>Exemple</b>Montrer que pour tout \(x > 0\), \(x + \frac4x \ge 4\).
<div class="sol">D'après l'exemple 2, le minimum de \(g(x) = x + \frac4x\) sur \(]0\,;+\infty[\) est \(g(2) = 4\). Donc \(g(x) \ge 4\) pour tout \(x > 0\).</div></div>
<div class="methode"><b>Problème d'optimisation</b>On exprime la grandeur à optimiser en fonction d'une variable \(x\), on précise l'intervalle des valeurs possibles, puis on étudie les variations pour trouver le maximum ou le minimum.</div>
<div class="exemple"><b>Exemple : coût moyen</b>Le coût de production de \(x\) centaines d'objets est \(C(x) = x^2 + 2x + 16\) (en milliers d'euros), pour \(x \in [1\,;10]\). Le coût moyen est \(C_M(x) = \frac{C(x)}{x} = x + 2 + \frac{16}{x}\).
<div class="sol">\(C_M'(x) = 1 - \frac{16}{x^2} = \frac{(x - 4)(x + 4)}{x^2}\), du signe de \(x - 4\) sur \([1\,;10]\). Le coût moyen est minimal pour \(x = 4\) (400 objets) et vaut \(C_M(4) = 4 + 2 + 4 = 10\) milliers d'euros par centaine.</div></div>
</div>
<div class="section"><h3>Lire une courbe et la courbe de sa dérivée</h3>
<ul><li>Là où \(f\) est croissante, la courbe de \(f'\) est <b>au-dessus</b> de l'axe des abscisses.</li>
<li>Là où \(f\) est décroissante, la courbe de \(f'\) est <b>en dessous</b>.</li>
<li>Les extremums de \(f\) correspondent aux points où la courbe de \(f'\) <b>traverse</b> l'axe des abscisses.</li></ul>
<div class="piege"><b>Piège classique de QCM</b>Ne pas confondre le signe de \(f(x)\) (la courbe de \(f\) au-dessus ou au-dessous de l'axe) et le signe de \(f'(x)\) (le sens de variation de \(f\)).</div>
</div>`,

essentiel:R`<ul>
<li>\(\exp\) est l'unique fonction dérivable sur \(\mathbb R\) telle que \(f' = f\) et \(f(0) = 1\). On note \(\exp(x) = \mathrm e^x\), avec \(\mathrm e \approx 2{,}718\).</li>
<li>\(\mathrm e^{a+b} = \mathrm e^a \mathrm e^b\), \(\mathrm e^{a-b} = \frac{\mathrm e^a}{\mathrm e^b}\), \(\mathrm e^{-a} = \frac{1}{\mathrm e^a}\), \((\mathrm e^a)^n = \mathrm e^{na}\).</li>
<li>\(\mathrm e^x > 0\) pour tout \(x\) ; \(\exp\) est strictement croissante sur \(\mathbb R\).</li>
<li>\(\mathrm e^a = \mathrm e^b \iff a = b\) et \(\mathrm e^a < \mathrm e^b \iff a < b\).</li>
<li>\((\mathrm e^{ax+b})' = a\,\mathrm e^{ax+b}\).</li>
</ul>`,
html:R`
<div class="section"><h3>Définition</h3>
<div class="def"><b>Définition</b>Il existe une unique fonction \(f\) dérivable sur \(\mathbb R\) telle que \(f' = f\) et \(f(0) = 1\). C'est la fonction <b>exponentielle</b>, notée \(\exp\). On pose \(\mathrm e = \exp(1) \approx 2{,}718\) et on note \(\exp(x) = \mathrm e^x\).</div>
${graph({xmin:-4, xmax:2.5, ymin:-0.5, ymax:7, w:320, h:260, stepX:1, stepY:1, fns:[{f:x => Math.exp(x)}, {f:x => x + 1, cls:"g-dash"}], pts:[{x:0, y:1, t:"(0 ; 1)", dx:6, dy:-6}, {x:1, y:Math.E, t:"(1 ; e)", dx:6, dy:4}], alt:"Courbe de la fonction exponentielle"})}
<p>La courbe passe par \((0\,;1)\) et \((1\,;\mathrm e)\) ; sa tangente en 0 a pour équation \(y = x + 1\) (en pointillés) car \(\exp'(0) = \exp(0) = 1\).</p>
</div>
<div class="section"><h3>Règles de calcul</h3>
<div class="prop"><b>Propriétés</b>Pour tous réels \(a\) et \(b\), et tout entier \(n\) :
\[\mathrm e^{a + b} = \mathrm e^a \times \mathrm e^b \qquad \mathrm e^{-a} = \frac{1}{\mathrm e^a} \qquad \mathrm e^{a - b} = \frac{\mathrm e^a}{\mathrm e^b} \qquad (\mathrm e^a)^n = \mathrm e^{na}\]</div>
<div class="exemple"><b>Exemple</b>Simplifier \(A = \dfrac{\mathrm e^{2x + 1} \times \mathrm e^{-x}}{\mathrm e^{x - 3}}\).
<div class="sol">\(A = \mathrm e^{2x + 1 - x - (x - 3)} = \mathrm e^{4}\). Attention aux parenthèses : on soustrait tout l'exposant du dénominateur.</div></div>
<div class="prop"><b>Suites géométriques</b>Pour tout réel \(a\), la suite \(u_n = \mathrm e^{na}\) est géométrique de raison \(\mathrm e^a\), car \(\mathrm e^{(n+1)a} = \mathrm e^a \times \mathrm e^{na}\).</div>
<div class="piege"><b>Pièges</b>\(\mathrm e^{a + b} \ne \mathrm e^a + \mathrm e^b\) et \(\mathrm e^{ab} \ne \mathrm e^a \mathrm e^b\). Et \(\mathrm e^0 = 1\), pas 0.</div>
</div>
<div class="section"><h3>Signe et variations</h3>
<div class="prop"><b>Propriétés</b>
<ul><li>Pour tout réel \(x\), \(\mathrm e^x > 0\).</li>
<li>\(\exp\) est strictement croissante sur \(\mathbb R\) (car sa dérivée \(\mathrm e^x\) est strictement positive).</li>
<li>Quand \(x\) devient très grand, \(\mathrm e^x\) devient aussi grand qu'on veut ; quand \(x\) tend vers \(-\infty\), \(\mathrm e^x\) se rapproche de 0.</li></ul></div>
<div class="prop"><b>Conséquences</b>Pour tous réels \(a\) et \(b\) : \(\mathrm e^a = \mathrm e^b \iff a = b\) et \(\mathrm e^a < \mathrm e^b \iff a < b\).</div>
<div class="exemple"><b>Exemple : équation</b>Résoudre \(\mathrm e^{3x - 1} = \mathrm e^{x + 5}\).
<div class="sol">\(3x - 1 = x + 5 \iff x = 3\). \(S = \{3\}\).</div></div>
<div class="exemple"><b>Exemple : inéquation</b>Résoudre \(\mathrm e^{x^2} \ge \mathrm e^{4}\).
<div class="sol">\(x^2 \ge 4 \iff x \le -2\) ou \(x \ge 2\). \(S = ]-\infty\,;-2] \cup [2\,;+\infty[\).</div></div>
<div class="astuce"><b>Astuce</b>Pour résoudre \(\mathrm e^{X} = 1\), on écrit \(1 = \mathrm e^0\) : \(X = 0\). Et \(\mathrm e^X = -2\) n'a aucune solution (une exponentielle est toujours positive).</div>
</div>
<div class="section"><h3>Dériver avec l'exponentielle</h3>
<div class="prop"><b>Propriété</b>\((\mathrm e^{x})' = \mathrm e^x\) et, pour tous réels \(a\) et \(b\), \((\mathrm e^{ax + b})' = a\,\mathrm e^{ax + b}\).</div>
<div class="exemple"><b>Exemple : étude complète</b>\(f(x) = (x - 1)\mathrm e^{x}\) sur \(\mathbb R\).
<div class="sol">Produit : \(f'(x) = 1 \times \mathrm e^x + (x - 1)\mathrm e^x = x\,\mathrm e^x\). Comme \(\mathrm e^x > 0\), \(f'(x)\) est du signe de \(x\) : \(f\) est décroissante sur \(]-\infty\,;0]\), croissante sur \([0\,;+\infty[\), de minimum \(f(0) = -1\).</div></div>
<div class="methode"><b>Méthode : signe d'une expression avec une exponentielle</b>Factoriser par l'exponentielle, puis utiliser \(\mathrm e^{u} > 0\) : le signe ne dépend que de l'autre facteur.</div>
<div class="exemple"><b>Exemple : modèle de décroissance</b>La température d'un café est \(T(t) = 20 + 60\,\mathrm e^{-0{,}1t}\) (en °C, \(t\) en minutes).
<div class="sol">\(T'(t) = 60 \times (-0{,}1)\,\mathrm e^{-0{,}1t} = -6\,\mathrm e^{-0{,}1t} < 0\) : la température diminue. \(T(0) = 80\) °C et, quand \(t\) devient grand, \(\mathrm e^{-0{,}1t}\) se rapproche de 0 : la température se rapproche de 20 °C (température de la pièce).</div></div>
</div>`,

essentiel:R`<ul>
<li>Le cercle trigonométrique a pour rayon 1 ; on l'« enroule » : à chaque réel \(x\) correspond un point \(M\) du cercle.</li>
<li>\(\cos x\) est l'abscisse de \(M\), \(\sin x\) son ordonnée : \(-1 \le \cos x \le 1\), \(-1 \le \sin x \le 1\), \(\cos^2 x + \sin^2 x = 1\).</li>
<li>\(\pi\) rad \(= 180^\circ\). Un tour complet vaut \(2\pi\) : \(\cos(x + 2\pi) = \cos x\), \(\sin(x + 2\pi) = \sin x\).</li>
<li>Valeurs remarquables en \(0, \frac\pi6, \frac\pi4, \frac\pi3, \frac\pi2\) : à savoir par cœur.</li>
</ul>`,
html:R`
<div class="section"><h3>Cercle trigonométrique et radian</h3>
<div class="def"><b>Définition</b>Dans un repère orthonormé, le cercle trigonométrique est le cercle de centre \(O\) et de rayon 1, orienté dans le sens inverse des aiguilles d'une montre (sens direct).</div>
<div class="def"><b>Définition</b>Le radian est l'unité d'angle telle qu'un angle de 1 rad intercepte sur le cercle trigonométrique un arc de longueur 1. Le demi-cercle mesure \(\pi\) : <b>\(\pi\) rad = 180°</b>.</div>
<div class="table-scroll"><table class="tbl c">
<tr><th>Degrés</th><td>0</td><td>30</td><td>45</td><td>60</td><td>90</td><td>120</td><td>135</td><td>150</td><td>180</td><td>360</td></tr>
<tr><th>Radians</th><td>\(0\)</td><td>\(\frac\pi6\)</td><td>\(\frac\pi4\)</td><td>\(\frac\pi3\)</td><td>\(\frac\pi2\)</td><td>\(\frac{2\pi}3\)</td><td>\(\frac{3\pi}4\)</td><td>\(\frac{5\pi}6\)</td><td>\(\pi\)</td><td>\(2\pi\)</td></tr>
</table></div>
<div class="methode"><b>Méthode : conversion</b>Degrés vers radians : multiplier par \(\frac{\pi}{180}\). Radians vers degrés : multiplier par \(\frac{180}{\pi}\).</div>
<div class="prop"><b>Enroulement</b>À tout réel \(x\) on associe un unique point \(M\) du cercle, obtenu en parcourant une longueur \(|x|\) à partir de \(I(1\,;0)\) (sens direct si \(x > 0\)). Les réels \(x\) et \(x + 2k\pi\) (\(k\) entier) sont associés au même point.</div>
<div class="exemple"><b>Exemple</b>\(\frac{13\pi}{6} = 2\pi + \frac{\pi}{6}\) : le point associé à \(\frac{13\pi}{6}\) est le même que celui associé à \(\frac\pi6\).</div>
</div>
<div class="section"><h3>Cosinus et sinus d'un réel</h3>
${cercleTrigo({point:Math.PI / 3, angles:[]})}
<div class="def"><b>Définition</b>Si \(M\) est le point du cercle trigonométrique associé au réel \(x\), alors \(\cos x\) est l'<b>abscisse</b> de \(M\) et \(\sin x\) est son <b>ordonnée</b> : \(M(\cos x\,;\sin x)\).</div>
<div class="prop"><b>Propriétés</b>Pour tout réel \(x\) et tout entier \(k\) :
<ul><li>\(-1 \le \cos x \le 1\) et \(-1 \le \sin x \le 1\) ;</li>
<li>\(\cos^2 x + \sin^2 x = 1\) ;</li>
<li>\(\cos(x + 2k\pi) = \cos x\) et \(\sin(x + 2k\pi) = \sin x\).</li></ul></div>
</div>
<div class="section"><h3>Valeurs remarquables</h3>
<div class="table-scroll"><table class="tbl c">
<tr><th>\(x\)</th><td>\(0\)</td><td>\(\frac\pi6\)</td><td>\(\frac\pi4\)</td><td>\(\frac\pi3\)</td><td>\(\frac\pi2\)</td><td>\(\pi\)</td></tr>
<tr><th>\(\cos x\)</th><td>\(1\)</td><td>\(\frac{\sqrt3}2\)</td><td>\(\frac{\sqrt2}2\)</td><td>\(\frac12\)</td><td>\(0\)</td><td>\(-1\)</td></tr>
<tr><th>\(\sin x\)</th><td>\(0\)</td><td>\(\frac12\)</td><td>\(\frac{\sqrt2}2\)</td><td>\(\frac{\sqrt3}2\)</td><td>\(1\)</td><td>\(0\)</td></tr>
</table></div>
<div class="astuce"><b>Moyen mnémotechnique</b>Pour \(0, \frac\pi6, \frac\pi4, \frac\pi3, \frac\pi2\), le sinus vaut \(\frac{\sqrt0}2, \frac{\sqrt1}2, \frac{\sqrt2}2, \frac{\sqrt3}2, \frac{\sqrt4}2\), et le cosinus est la même liste lue à l'envers.</div>
</div>
<div class="section"><h3>Angles associés</h3>
<div class="table-scroll"><table class="tbl c">
<tr><th>Angle</th><th>Cosinus</th><th>Sinus</th><th>Symétrie</th></tr>
<tr><td>\(-x\)</td><td>\(\cos x\)</td><td>\(-\sin x\)</td><td>par rapport à l'axe des abscisses</td></tr>
<tr><td>\(\pi - x\)</td><td>\(-\cos x\)</td><td>\(\sin x\)</td><td>par rapport à l'axe des ordonnées</td></tr>
<tr><td>\(\pi + x\)</td><td>\(-\cos x\)</td><td>\(-\sin x\)</td><td>par rapport à l'origine</td></tr>
<tr><td>\(\frac\pi2 - x\)</td><td>\(\sin x\)</td><td>\(\cos x\)</td><td>par rapport à la droite \(y = x\)</td></tr>
</table></div>
<div class="exemple"><b>Exemple</b>\(\cos\frac{2\pi}{3} = \cos\left(\pi - \frac\pi3\right) = -\cos\frac\pi3 = -\frac12\) et \(\sin\left(-\frac\pi4\right) = -\frac{\sqrt2}2\).</div>
<div class="methode"><b>Méthode</b>Pour trouver un cosinus ou un sinus, place le point sur le cercle, repère le quadrant (signes de l'abscisse et de l'ordonnée), puis utilise la valeur remarquable de l'angle « de référence ».</div>
</div>
<div class="section"><h3>Fonctions cosinus et sinus</h3>
${graph({xmin:-7, xmax:7, ymin:-1.6, ymax:1.6, w:380, h:200, stepX:Math.PI / 2, stepY:0.5, labelX:Math.PI, labelY:1, fmtX:x => { const k = Math.round(x / Math.PI); return (k < 0 ? "−" : "") + (Math.abs(k) === 1 ? "" : Math.abs(k)) + "π"; }, fns:[{f:Math.cos, label:[0.25, 1.25, "cos"]}, {f:Math.sin, cls:"g-c2", label:[1.7, 1.25, "sin"]}], alt:"Courbes de cosinus et sinus"})}
<ul><li>Elles sont <b>périodiques</b> de période \(2\pi\) : la courbe se répète tous les \(2\pi\).</li>
<li>\(\cos\) est <b>paire</b> (\(\cos(-x) = \cos x\), courbe symétrique par rapport à l'axe des ordonnées) ; \(\sin\) est <b>impaire</b> (\(\sin(-x) = -\sin x\), courbe symétrique par rapport à l'origine).</li></ul>
<div class="exemple"><b>Exemple : résoudre sur le cercle</b>Résoudre \(\cos x = \frac12\) sur \(]-\pi\,;\pi]\).
<div class="sol">Deux points du cercle ont pour abscisse \(\frac12\) : ceux associés à \(\frac\pi3\) et \(-\frac\pi3\). \(S = \left\{-\frac\pi3\,;\frac\pi3\right\}\).</div></div>
</div>`,

{id:"produit-scalaire", parcours:["spe"], theme:"Géométrie", titre:"Produit scalaire", sub:"Quatre façons de le calculer, orthogonalité, Al-Kashi",
essentiel:R`<ul>
<li>\(\vec u \cdot \vec v = \|\vec u\| \times \|\vec v\| \times \cos(\vec u, \vec v)\).</li>
<li>Projection : \(\overrightarrow{AB} \cdot \overrightarrow{AC} = AB \times AH\) si \(H\) (projeté de \(C\) sur \((AB)\)) est du même côté que \(B\), \(-AB \times AH\) sinon.</li>
<li>En repère orthonormé : \(\vec u(x\,;y) \cdot \vec v(x'\,;y') = xx' + yy'\).</li>
<li>\(\vec u \cdot \vec v = \frac12\left(\|\vec u + \vec v\|^2 - \|\vec u\|^2 - \|\vec v\|^2\right)\).</li>
<li>\(\vec u \perp \vec v \iff \vec u \cdot \vec v = 0\). Al-Kashi : \(BC^2 = AB^2 + AC^2 - 2\,AB \times AC \cos\widehat A\).</li>
</ul>`,
html:R`
<div class="section"><h3>Définitions du produit scalaire</h3>
<div class="def"><b>Avec la norme et l'angle</b>Si \(\vec u\) et \(\vec v\) sont non nuls, \(\vec u \cdot \vec v = \|\vec u\| \times \|\vec v\| \times \cos(\vec u, \vec v)\). Si l'un des deux est nul, \(\vec u \cdot \vec v = 0\).</div>
<div class="def"><b>Avec les normes (polarisation)</b>\(\vec u \cdot \vec v = \frac12\left(\|\vec u + \vec v\|^2 - \|\vec u\|^2 - \|\vec v\|^2\right) = \frac12\left(\|\vec u\|^2 + \|\vec v\|^2 - \|\vec u - \vec v\|^2\right)\).</div>
<div class="def"><b>Avec les coordonnées</b>Dans un repère orthonormé, si \(\vec u(x\,;y)\) et \(\vec v(x'\,;y')\), alors \(\vec u \cdot \vec v = xx' + yy'\) et \(\|\vec u\| = \sqrt{x^2 + y^2}\).</div>
<div class="def"><b>Avec un projeté orthogonal</b>Soit \(H\) le projeté orthogonal de \(C\) sur la droite \((AB)\). Alors \(\overrightarrow{AB} \cdot \overrightarrow{AC} = \overrightarrow{AB} \cdot \overrightarrow{AH}\), c'est-à-dire \(AB \times AH\) si \(\overrightarrow{AB}\) et \(\overrightarrow{AH}\) sont de même sens, et \(-AB \times AH\) sinon.</div>
<div class="methode"><b>Laquelle choisir ?</b>
<ul><li>Coordonnées connues → formule \(xx' + yy'\).</li>
<li>Longueurs et angle connus → \(\|\vec u\|\|\vec v\|\cos\theta\).</li>
<li>Figure avec un angle droit ou une hauteur → projeté orthogonal.</li>
<li>Seulement des longueurs → polarisation.</li></ul></div>
</div>
<div class="section"><h3>Propriétés de calcul</h3>
<div class="prop"><b>Propriétés</b>Pour tous vecteurs \(\vec u, \vec v, \vec w\) et tout réel \(k\) :
<ul><li>\(\vec u \cdot \vec v = \vec v \cdot \vec u\) (symétrie) ;</li>
<li>\(\vec u \cdot (\vec v + \vec w) = \vec u \cdot \vec v + \vec u \cdot \vec w\) et \((k\vec u) \cdot \vec v = k(\vec u \cdot \vec v)\) (bilinéarité) ;</li>
<li>\(\vec u \cdot \vec u = \|\vec u\|^2\) ;</li>
<li>\(\|\vec u + \vec v\|^2 = \|\vec u\|^2 + 2\,\vec u \cdot \vec v + \|\vec v\|^2\).</li></ul></div>
<div class="prop"><b>Orthogonalité</b>\(\vec u\) et \(\vec v\) sont orthogonaux si et seulement si \(\vec u \cdot \vec v = 0\). En particulier, \((AB) \perp (CD) \iff \overrightarrow{AB} \cdot \overrightarrow{CD} = 0\).</div>
<div class="exemple"><b>Exemple</b>\(A(1\,;2)\), \(B(4\,;3)\), \(C(2\,;-1)\). Le triangle \(ABC\) est-il rectangle en \(A\) ?
<div class="sol">\(\overrightarrow{AB}(3\,;1)\) et \(\overrightarrow{AC}(1\,;-3)\) : \(\overrightarrow{AB} \cdot \overrightarrow{AC} = 3 \times 1 + 1 \times (-3) = 0\). Oui, \(ABC\) est rectangle en \(A\).</div></div>
</div>
<div class="section"><h3>Calculs avec un projeté orthogonal</h3>
<div class="exemple"><b>Exemple</b>\(ABCD\) est un carré de côté 4, \(I\) le milieu de \([CD]\). Calculer \(\overrightarrow{AB} \cdot \overrightarrow{AI}\).
<div class="sol">Le projeté orthogonal de \(I\) sur \((AB)\) est le milieu \(K\) de \([AB]\), du même côté que \(B\). Donc \(\overrightarrow{AB} \cdot \overrightarrow{AI} = AB \times AK = 4 \times 2 = 8\).</div></div>
<div class="methode"><b>Calculer une longueur avec le produit scalaire</b>Si l'on connaît \(\overrightarrow{AB} \cdot \overrightarrow{AC}\) (par exemple avec les coordonnées) et \(AB\), on en déduit la longueur \(AH\) du projeté : \(AH = \frac{\overrightarrow{AB} \cdot \overrightarrow{AC}}{AB}\) (quand ce produit est positif). C'est exactement ce que demande le sujet zéro n°1.</div>
<div class="methode"><b>Calculer un angle</b>\(\cos(\vec u, \vec v) = \dfrac{\vec u \cdot \vec v}{\|\vec u\| \times \|\vec v\|}\), puis on reconnaît une valeur remarquable.</div>
<div class="exemple"><b>Exemple</b>\(\vec u(1\,;1)\) et \(\vec v(0\,;3)\) : \(\vec u \cdot \vec v = 3\), \(\|\vec u\| = \sqrt2\), \(\|\vec v\| = 3\). \(\cos\theta = \frac{3}{3\sqrt2} = \frac{\sqrt2}{2}\), donc \(\theta = \frac\pi4\).</div>
</div>
<div class="section"><h3>Théorème d'Al-Kashi</h3>
<div class="prop"><b>Théorème</b>Dans un triangle \(ABC\), avec \(a = BC\), \(b = AC\), \(c = AB\) :
\[a^2 = b^2 + c^2 - 2bc\cos\widehat{A}\]
Si \(\widehat A = 90^\circ\), on retrouve le théorème de Pythagore.</div>
<div class="exemple"><b>Exemple</b>\(AB = 5\), \(AC = 8\), \(\widehat{BAC} = 60^\circ\). Calculer \(BC\).
<div class="sol">\(BC^2 = 64 + 25 - 2 \times 8 \times 5 \times \frac12 = 89 - 40 = 49\), donc \(BC = 7\).</div></div>

</div>

{id:"geometrie-reperee", parcours:["spe"], theme:"Géométrie", titre:"Géométrie repérée", sub:"Vecteur normal, équations de droites, projeté orthogonal, équation de cercle",
essentiel:R`<ul>
<li>Une droite de vecteur <b>normal</b> \(\vec n(a\,;b)\) a une équation \(ax + by + c = 0\) ; un vecteur <b>directeur</b> est alors \(\vec u(-b\,;a)\).</li>
<li>\(M \in d\) (passant par \(A\), normale \(\vec n\)) \(\iff \overrightarrow{AM} \cdot \vec n = 0\).</li>
<li>Cercle de centre \(\Omega(x_0\,;y_0)\) et de rayon \(r\) : \((x - x_0)^2 + (y - y_0)^2 = r^2\).</li>
<li>Pour reconnaître un cercle dans \(x^2 + y^2 + \dots = 0\) : on fait apparaître des formes canoniques.</li>
</ul>`,
html:R`
<div class="section"><h3>Rappels : vecteurs et droites</h3>
<ul><li>\(\overrightarrow{AB}(x_B - x_A\,;y_B - y_A)\), milieu \(I\left(\frac{x_A + x_B}{2}\,;\frac{y_A + y_B}{2}\right)\), distance \(AB = \sqrt{(x_B - x_A)^2 + (y_B - y_A)^2}\).</li>
<li>Deux vecteurs \(\vec u(x\,;y)\) et \(\vec v(x'\,;y')\) sont colinéaires si et seulement si \(xy' - x'y = 0\).</li>
<li>Une droite de vecteur directeur \(\vec u(-b\,;a)\) a une équation cartésienne \(ax + by + c = 0\).</li>
<li>Si \(b \ne 0\), on obtient l'équation réduite \(y = mx + p\), avec un vecteur directeur \((1\,;m)\).</li></ul>
</div>
<div class="section"><h3>Vecteur normal et équation de droite</h3>
<div class="def"><b>Définition</b>Un vecteur <b>normal</b> à une droite \(d\) est un vecteur non nul orthogonal à un vecteur directeur de \(d\).</div>
<div class="prop"><b>Propriété</b>
<ul><li>Si \(\vec n(a\,;b)\) est normal à \(d\), alors \(d\) a une équation de la forme \(ax + by + c = 0\).</li>
<li>Réciproquement, la droite d'équation \(ax + by + c = 0\) a pour vecteur normal \(\vec n(a\,;b)\) et pour vecteur directeur \(\vec u(-b\,;a)\).</li></ul></div>
<div class="methode"><b>Méthode : droite passant par \(A\) de vecteur normal \(\vec n\)</b>
<ol class="steps"><li>On écrit \(ax + by + c = 0\) avec \((a\,;b)\) les coordonnées de \(\vec n\).</li><li>On remplace \(x, y\) par les coordonnées de \(A\) pour trouver \(c\).</li></ol>
Ou bien : \(M(x\,;y) \in d \iff \overrightarrow{AM} \cdot \vec n = 0\).</div>
<div class="exemple"><b>Exemple</b>Droite passant par \(A(2\,;-1)\) de vecteur normal \(\vec n(3\,;4)\).
<div class="sol">\(3x + 4y + c = 0\) et \(3 \times 2 + 4 \times (-1) + c = 0\), donc \(c = -2\). Équation : \(3x + 4y - 2 = 0\).</div></div>
<div class="exemple"><b>Exemple : hauteur d'un triangle</b>\(A(1\,;3)\), \(B(-1\,;0)\), \(C(4\,;1)\). Équation de la hauteur issue de \(A\) ?
<div class="sol">La hauteur passe par \(A\) et est perpendiculaire à \((BC)\) : \(\overrightarrow{BC}(5\,;1)\) en est un vecteur normal. \(5x + y + c = 0\) avec \(5 + 3 + c = 0\), soit \(5x + y - 8 = 0\).</div></div>
<div class="prop"><b>Droites perpendiculaires</b>Deux droites sont perpendiculaires si et seulement si leurs vecteurs normaux (ou directeurs) sont orthogonaux. Avec les équations réduites \(y = mx + p\) et \(y = m'x + p'\) : \(mm' = -1\).</div>
</div>
<div class="section"><h3>Projeté orthogonal d'un point sur une droite</h3>
<div class="methode"><b>Méthode</b>Pour trouver le projeté orthogonal \(H\) de \(M\) sur \(d\) :
<ol class="steps"><li>Écrire l'équation de la droite \(\Delta\) passant par \(M\) et perpendiculaire à \(d\) (un vecteur directeur de \(d\) est normal à \(\Delta\)).</li><li>\(H\) est l'intersection de \(d\) et \(\Delta\) : résoudre le système.</li></ol></div>
<div class="exemple"><b>Exemple</b>Projeté de \(M(5\,;5)\) sur \(d : x + 2y - 5 = 0\).
<div class="sol">Un vecteur directeur de \(d\) est \(\vec u(-2\,;1)\), normal à \(\Delta\) : \(-2x + y + c = 0\) avec \(-10 + 5 + c = 0\), donc \(\Delta : -2x + y + 5 = 0\), soit \(y = 2x - 5\). On remplace dans \(d\) : \(x + 2(2x - 5) - 5 = 0 \iff 5x = 15 \iff x = 3\), puis \(y = 1\). \(H(3\,;1)\). La distance de \(M\) à \(d\) est \(MH = \sqrt{4 + 16} = 2\sqrt5\).</div></div>
</div>
<div class="section"><h3>Équation de cercle</h3>
<div class="prop"><b>Propriété</b>Le cercle de centre \(\Omega(x_0\,;y_0)\) et de rayon \(r\) a pour équation \((x - x_0)^2 + (y - y_0)^2 = r^2\).</div>
<div class="methode"><b>Reconnaître un cercle</b>Dans une équation \(x^2 + y^2 + \alpha x + \beta y + \gamma = 0\), on fait apparaître les formes canoniques : \(x^2 - 4x = (x - 2)^2 - 4\), \(y^2 + 6y = (y + 3)^2 - 9\), etc.</div>
<div class="exemple"><b>Exemple</b>Nature de l'ensemble d'équation \(x^2 + y^2 - 4x + 6y - 3 = 0\).
<div class="sol">\((x - 2)^2 - 4 + (y + 3)^2 - 9 - 3 = 0 \iff (x - 2)^2 + (y + 3)^2 = 16\). C'est le cercle de centre \((2\,;-3)\) et de rayon 4.</div></div>
<div class="exemple"><b>Exemple : le cercle du sujet zéro</b>Justifier qu'une équation du cercle de centre \(D(2\,;2)\) et de rayon \(0{,}5\) est \(x^2 + y^2 - 4x - 4y + 7{,}75 = 0\).
<div class="sol">\((x - 2)^2 + (y - 2)^2 = 0{,}25 \iff x^2 - 4x + 4 + y^2 - 4y + 4 - 0{,}25 = 0 \iff x^2 + y^2 - 4x - 4y + 7{,}75 = 0\).</div></div>
<div class="methode"><b>Point sur un cercle, intersection</b>
<ul><li>Un point appartient au cercle si ses coordonnées vérifient l'équation.</li>
<li>Pour l'intersection d'une droite et d'un cercle, on remplace \(y\) (ou \(x\)) tiré de l'équation de la droite dans celle du cercle : on obtient une équation du second degré.</li></ul></div>
<div class="prop"><b>Tangente à un cercle</b>La tangente au cercle de centre \(\Omega\) en un point \(A\) du cercle est la droite passant par \(A\) de vecteur normal \(\overrightarrow{\Omega A}\).</div>
</div>
<div class="section"><h3>Parabole y = ax² + bx + c</h3>
<p>La parabole d'équation \(y = ax^2 + bx + c\) a pour axe de symétrie la droite d'équation \(x = -\frac{b}{2a}\) et pour sommet le point \(S\left(-\frac{b}{2a}\,;f\left(-\frac{b}{2a}\right)\right)\). Ses intersections avec une droite s'obtiennent en résolvant une équation du second degré.</p>
</div>`,

essentiel:R`<ul>
<li>\(P_A(B) = \frac{P(A \cap B)}{P(A)}\) (avec \(P(A) \ne 0\)), donc \(P(A \cap B) = P(A) \times P_A(B)\).</li>
<li>Arbre : la somme des probabilités issues d'un même nœud vaut 1 ; la probabilité d'un chemin est le <b>produit</b> des probabilités rencontrées.</li>
<li>Probabilités totales : \(P(B) = P(A \cap B) + P(\bar A \cap B)\).</li>
<li>\(A\) et \(B\) sont indépendants si \(P(A \cap B) = P(A) \times P(B)\), c'est-à-dire \(P_A(B) = P(B)\).</li>
</ul>`,
html:R`
<div class="section"><h3>Probabilité conditionnelle</h3>
<div class="def"><b>Définition</b>Soit \(A\) un événement de probabilité non nulle. La probabilité de \(B\) sachant \(A\) est \(P_A(B) = \dfrac{P(A \cap B)}{P(A)}\).</div>
<p>On « se restreint » à l'univers \(A\) : parmi les issues où \(A\) est réalisé, quelle proportion réalise aussi \(B\) ?</p>
<div class="prop"><b>Propriétés</b>\(P(A \cap B) = P(A) \times P_A(B)\) et \(P_A(\bar B) = 1 - P_A(B)\).</div>
<div class="piege"><b>Piège n°1 du chapitre</b>\(P_A(B)\), \(P_B(A)\) et \(P(A \cap B)\) sont trois nombres différents. « Parmi les filles, 30 % … » donne \(P_F(\dots)\) ; « 30 % des élèves sont des filles qui… » donne \(P(F \cap \dots)\).</div>
</div>
<div class="section"><h3>Avec un tableau croisé</h3>
<div class="exemple"><b>Exemple</b>Dans un lycée de 500 élèves, on relève la demi-pension (D) et le niveau (première P ou terminale T).
<div class="table-scroll"><table class="tbl c"><tr><th></th><th>D</th><th>\(\bar D\)</th><th>Total</th></tr>
<tr><td><b>P</b></td><td>150</td><td>100</td><td>250</td></tr>
<tr><td><b>T</b></td><td>120</td><td>130</td><td>250</td></tr>
<tr><td><b>Total</b></td><td>270</td><td>230</td><td>500</td></tr></table></div>
<div class="sol">On choisit un élève au hasard. \(P(D) = \frac{270}{500} = 0{,}54\) ; \(P(P \cap D) = \frac{150}{500} = 0{,}3\) ; \(P_P(D) = \frac{150}{250} = 0{,}6\) ; \(P_D(P) = \frac{150}{270} = \frac59\).</div></div>
<div class="methode"><b>Méthode</b>Pour \(P_A(B)\) dans un tableau d'effectifs : effectif de la case \(A \cap B\) divisé par le <b>total de la ligne (ou colonne) \(A\)</b>.</div>
</div>
<div class="section"><h3>Arbres pondérés</h3>
${tree({b:[{t:"A", p:"P(A)", s:[{t:"B", p:"P_A(B)"}, {t:"B̅", p:"P_A(B̅)"}]}, {t:"A̅", p:"P(A̅)", s:[{t:"B", p:"P_A̅(B)"}, {t:"B̅", p:"P_A̅(B̅)"}]}]})}
<div class="prop"><b>Règles</b>
<ol class="steps"><li>La somme des probabilités des branches issues d'un même nœud vaut 1.</li>
<li>La probabilité d'un chemin (une intersection) est le produit des probabilités des branches : \(P(A \cap B) = P(A) \times P_A(B)\).</li>
<li>La probabilité d'un événement est la somme des probabilités des chemins qui y mènent.</li></ol></div>
<div class="prop"><b>Formule des probabilités totales</b>Si \(A\) et \(\bar A\) partagent l'univers : \(P(B) = P(A \cap B) + P(\bar A \cap B) = P(A)P_A(B) + P(\bar A)P_{\bar A}(B)\). Plus généralement, avec une partition \(A_1, \dots, A_n\) de l'univers : \(P(B) = P(A_1 \cap B) + \dots + P(A_n \cap B)\).</div>
<div class="exemple"><b>Exemple type bac : test de dépistage</b>Une maladie touche 2 % d'une population. Un test est positif chez 95 % des malades et chez 4 % des personnes saines. On note \(M\) « être malade » et \(T\) « test positif ».
<div class="sol">
${tree({b:[{t:"M", p:"0,02", s:[{t:"T", p:"0,95"}, {t:"T̅", p:"0,05"}]}, {t:"M̅", p:"0,98", s:[{t:"T", p:"0,04"}, {t:"T̅", p:"0,96"}]}]})}
\(P(M \cap T) = 0{,}02 \times 0{,}95 = 0{,}019\) et \(P(\bar M \cap T) = 0{,}98 \times 0{,}04 = 0{,}0392\).<br>
Probabilités totales : \(P(T) = 0{,}019 + 0{,}0392 = 0{,}0582\).<br>
Probabilité d'être malade sachant que le test est positif : \(P_T(M) = \frac{0{,}019}{0{,}0582} \approx 0{,}33\). Seule une personne testée positive sur trois environ est malade !</div></div>
<div class="piege"><b>Piège</b>\(P_T(M)\) (« inverser » le conditionnement) ne se lit pas sur l'arbre : il faut la formule \(P_T(M) = \frac{P(M \cap T)}{P(T)}\).</div>
</div>
<div class="section"><h3>Indépendance</h3>
<div class="def"><b>Définition</b>Deux événements \(A\) et \(B\) sont indépendants si \(P(A \cap B) = P(A) \times P(B)\). Si \(P(A) \ne 0\), cela équivaut à \(P_A(B) = P(B)\) : savoir que \(A\) est réalisé ne change pas la probabilité de \(B\).</div>
<div class="prop"><b>Propriété</b>Si \(A\) et \(B\) sont indépendants, alors \(\bar A\) et \(B\) le sont aussi (de même \(A\) et \(\bar B\), \(\bar A\) et \(\bar B\)).</div>
<div class="exemple"><b>Exemple</b>\(P(A) = 0{,}4\), \(P(B) = 0{,}5\), \(P(A \cap B) = 0{,}2\). Comme \(0{,}4 \times 0{,}5 = 0{,}2\), \(A\) et \(B\) sont indépendants.</div>
<div class="piege"><b>Piège</b>Ne pas confondre <b>indépendants</b> (\(P(A \cap B) = P(A)P(B)\)) et <b>incompatibles</b> (\(A \cap B = \varnothing\), donc \(P(A \cap B) = 0\)).</div>
</div>
<div class="section"><h3>Succession d'épreuves indépendantes</h3>
<p>Quand on répète des expériences indépendantes (lancers successifs, tirages avec remise), la probabilité d'une liste de résultats est le <b>produit</b> des probabilités de chaque résultat.</p>
<div class="exemple"><b>Exemple</b>On lance trois fois un dé équilibré. Probabilité d'obtenir au moins un 6 ?
<div class="sol">L'événement contraire est « aucun 6 » : \(\left(\frac56\right)^3 = \frac{125}{216}\). Donc \(P = 1 - \frac{125}{216} = \frac{91}{216}\).</div></div>
<div class="astuce"><b>Astuce</b>« Au moins un » : passe presque toujours par l'événement contraire « aucun ».</div>
</div>`,

{id:"variables-aleatoires", parcours:["spe"], theme:"Probabilités", titre:"Variables aléatoires", sub:"Loi de probabilité, espérance, variance, écart type, jeux équitables",
essentiel:R`<ul>
<li>Une variable aléatoire \(X\) associe un nombre à chaque issue ; sa <b>loi</b> donne \(P(X = x_i)\) pour chaque valeur \(x_i\) (la somme vaut 1).</li>
<li>Espérance : \(E(X) = \sum x_i\,P(X = x_i)\) : la valeur moyenne sur un grand nombre de répétitions.</li>
<li>Variance : \(V(X) = \sum P(X = x_i)\,(x_i - E(X))^2 = E(X^2) - E(X)^2\) ; écart type \(\sigma(X) = \sqrt{V(X)}\).</li>
<li>\(E(aX + b) = aE(X) + b\) et \(V(aX + b) = a^2 V(X)\).</li>
</ul>`,

<div class="section"><h3>Variable aléatoire et loi</h3>
<div class="def"><b>Définition</b>Une variable aléatoire réelle \(X\) est une fonction qui associe un nombre réel à chaque issue d'une expérience aléatoire. L'événement « \(X\) prend la valeur \(a\) » est noté \(\{X = a\}\).</div>
<div class="def"><b>Loi de probabilité</b>Donner la loi de \(X\), c'est donner les valeurs \(x_1, \dots, x_n\) prises par \(X\) et les probabilités \(p_i = P(X = x_i)\), en général dans un tableau. On a \(p_1 + \dots + p_n = 1\).</div>
<div class="exemple"><b>Exemple</b>Un jeu coûte 2 €. On lance un dé équilibré : on gagne 10 € si on obtient 6, 3 € si on obtient 4 ou 5, rien sinon. \(X\) est le gain <b>algébrique</b> (gain moins mise).
<div class="sol">Valeurs : \(10 - 2 = 8\), \(3 - 2 = 1\), \(0 - 2 = -2\).
<div class="table-scroll"><table class="tbl c"><tr><th>\(x_i\)</th><td>\(-2\)</td><td>\(1\)</td><td>\(8\)</td></tr><tr><th>\(P(X = x_i)\)</th><td>\(\frac36\)</td><td>\(\frac26\)</td><td>\(\frac16\)</td></tr></table></div></div></div>
</div>
<div class="section"><h3>Espérance</h3>
<div class="def"><b>Définition</b>\(E(X) = x_1 p_1 + x_2 p_2 + \dots + x_n p_n\).</div>
<p>Interprétation : si l'on répète l'expérience un très grand nombre de fois, la moyenne des valeurs obtenues se rapproche de \(E(X)\).</p>
<div class="exemple"><b>Exemple (suite)</b>\(E(X) = -2 \times \frac36 + 1 \times \frac26 + 8 \times \frac16 = \frac{-6 + 2 + 8}{6} = \frac46 = \frac23\). En moyenne, le joueur gagne environ 0,67 € par partie : le jeu est favorable au joueur.</div>
<div class="aretenir"><b>Jeu équitable</b>Un jeu est <b>équitable</b> si l'espérance du gain algébrique est nulle ; favorable au joueur si elle est positive ; défavorable si elle est négative.</div>
<div class="methode"><b>Méthode : trouver une mise pour que le jeu soit équitable</b>On note \(m\) la mise, on exprime \(E(X)\) en fonction de \(m\) et on résout \(E(X) = 0\).</div>
</div>
<div class="section"><h3>Variance et écart type</h3>
<div class="def"><b>Définitions</b>\(V(X) = p_1(x_1 - E(X))^2 + \dots + p_n(x_n - E(X))^2\) et \(\sigma(X) = \sqrt{V(X)}\).</div>
<div class="prop"><b>Formule de König-Huygens</b>\(V(X) = E(X^2) - E(X)^2\), où \(E(X^2) = x_1^2 p_1 + \dots + x_n^2 p_n\).</div>
<p>L'écart type mesure la <b>dispersion</b> des valeurs de \(X\) autour de son espérance : plus il est grand, plus le jeu est « risqué ».</p>
<div class="exemple"><b>Exemple (suite)</b>\(E(X^2) = 4 \times \frac36 + 1 \times \frac26 + 64 \times \frac16 = \frac{12 + 2 + 64}{6} = 13\). \(V(X) = 13 - \frac49 = \frac{113}{9}\) et \(\sigma(X) = \frac{\sqrt{113}}{3} \approx 3{,}5\).</div>
</div>
<div class="section"><h3>Transformation affine</h3>
<div class="prop"><b>Propriété</b>Pour tous réels \(a\) et \(b\) : \(E(aX + b) = aE(X) + b\), \(V(aX + b) = a^2V(X)\), \(\sigma(aX + b) = |a|\,\sigma(X)\).</div>
<div class="exemple"><b>Exemple</b>Si tous les gains sont doublés puis augmentés de 1 € : \(Y = 2X + 1\), \(E(Y) = 2 \times \frac23 + 1 = \frac73\) et \(\sigma(Y) = 2\sigma(X)\).</div>
<div class="piege"><b>Piège</b>Ajouter une constante ne change pas la dispersion : \(V(X + b) = V(X)\).</div>
</div>
<div class="section"><h3>Répétition d'épreuves de Bernoulli</h3>
<div class="def"><b>Définition</b>Une épreuve de Bernoulli a deux issues : succès (probabilité \(p\)) et échec (probabilité \(1 - p\)). La variable \(X\) qui vaut 1 en cas de succès et 0 sinon a pour espérance \(p\) et pour variance \(p(1 - p)\).</div>
<p>Quand on répète plusieurs fois, de façon indépendante, la même épreuve de Bernoulli, on représente la situation par un arbre : chaque chemin a pour probabilité \(p^k(1 - p)^{n-k}\), où \(k\) est le nombre de succès.</p>
<div class="exemple"><b>Exemple</b>Un tireur atteint la cible avec une probabilité \(0{,}8\). Il tire 3 fois de manière indépendante. Probabilité d'exactement 2 succès ?
<div class="sol">Trois chemins (SSE, SES, ESS), chacun de probabilité \(0{,}8^2 \times 0{,}2 = 0{,}128\). \(P = 3 \times 0{,}128 = 0{,}384\).</div></div>
</div>`,

<div class="section"><h3>Lire un programme : les bases</h3>
<div class="table-scroll"><table class="tbl first">
<tr><th>Instruction</th><th>Rôle</th></tr>
<tr><td><code>a = 3</code></td><td>Affecte la valeur 3 à la variable <code>a</code>.</td></tr>
<tr><td><code>a = a + 1</code></td><td>Augmente <code>a</code> de 1 (on calcule à droite avec l'ancienne valeur, puis on range à gauche).</td></tr>
<tr><td><code>x ** 2</code></td><td>\(x^2\) (attention : <code>^</code> n'est pas la puissance en Python).</td></tr>
<tr><td><code>a == b</code>, <code>a != b</code></td><td>Tests d'égalité et de différence (à ne pas confondre avec l'affectation <code>=</code>).</td></tr>
<tr><td><code>if … elif … else</code></td><td>Instructions conditionnelles.</td></tr>
<tr><td><code>def f(x): return …</code></td><td>Définit une fonction qui renvoie une valeur.</td></tr>
</table></div>
<div class="piege"><b>Piège</b><code>range(n)</code> va de 0 à \(n - 1\) : <code>for k in range(5)</code> fait 5 tours, avec k = 0, 1, 2, 3, 4. <code>range(1, 6)</code> va de 1 à 5.</div>
</div>
<div class="section"><h3>Calculer les termes d'une suite</h3>
<div class="exemple"><b>Exemple</b>Que renvoie <code>terme(3)</code> ?
<pre class="no-math" style="background:var(--accent-soft);padding:10px 14px;border-radius:10px;overflow-x:auto;font-size:14px">def terme(n):
    u = 5
    for k in range(n):
        u = 2 * u - 3
    return u</pre>
<div class="sol">Ce programme calcule \(u_n\) pour la suite \(u_0 = 5\), \(u_{n+1} = 2u_n - 3\). Tours de boucle : \(u = 7\), puis \(11\), puis \(19\). <code>terme(3)</code> renvoie 19.</div></div>
<div class="methode"><b>Méthode : faire tourner un programme à la main</b>Fais un tableau avec une colonne par variable et une ligne par tour de boucle. Mets à jour les valeurs dans l'ordre exact des instructions.</div>
</div>
<div class="section"><h3>Algorithme de seuil</h3>
<pre class="no-math" style="background:var(--accent-soft);padding:10px 14px;border-radius:10px;overflow-x:auto;font-size:14px">def seuil(S):
    n = 0
    u = 1000
    while u &lt; S:
        u = u * 1.05
        n = n + 1
    return n</pre>
<p>Ce programme renvoie le premier rang \(n\) tel que \(1\,000 \times 1{,}05^n \ge S\) : par exemple, le nombre d'années nécessaires pour qu'un capital placé à 5 % par an atteigne \(S\).</p>
<div class="piege"><b>Piège</b>La condition du <code>while</code> est la condition pour <b>continuer</b>, c'est-à-dire le contraire de la condition d'arrêt. Pour « jusqu'à ce que \(u \ge S\) », on écrit <code>while u &lt; S</code>.</div>
</div>
<div class="section"><h3>Listes</h3>
<pre class="no-math" style="background:var(--accent-soft);padding:10px 14px;border-radius:10px;overflow-x:auto;font-size:14px">L = []
u = 2
for k in range(5):
    L.append(u)
    u = u + 3
# L vaut [2, 5, 8, 11, 14]</pre>
<ul><li><code>L[0]</code> est le premier élément (2), <code>L[-1]</code> le dernier (14), <code>len(L)</code> vaut 5.</li>
<li>Liste en compréhension : <code>[k**2 for k in range(4)]</code> donne <code>[0, 1, 4, 9]</code>.</li>
<li>Somme des éléments : <code>sum(L)</code>, ou une boucle avec un accumulateur <code>s = s + x</code>.</li></ul>
</div>
<div class="section"><h3>Simuler une expérience aléatoire</h3>
<pre class="no-math" style="background:var(--accent-soft);padding:10px 14px;border-radius:10px;overflow-x:auto;font-size:14px">from random import random
def experience():
    if random() &lt; 0.3:
        return 1
    return 0</pre>
<p><code>random()</code> renvoie un nombre au hasard dans \([0\,;1[\) : la fonction renvoie 1 avec une probabilité de 0,3. En répétant l'expérience un grand nombre de fois et en faisant la moyenne, on obtient une valeur proche de l'espérance.</p>
</div>`,

<div class="section"><h3>Proportions</h3>
<div class="def"><b>Définition</b>Si une population \(E\) d'effectif \(n_E\) contient une sous-population \(A\) d'effectif \(n_A\), la proportion de \(A\) dans \(E\) est \(p = \dfrac{n_A}{n_E}\), un nombre compris entre 0 et 1, souvent exprimé en pourcentage.</div>
<div class="prop"><b>Conséquences</b>\(n_A = p \times n_E\) et \(n_E = \dfrac{n_A}{p}\).</div>
<div class="prop"><b>Proportion de proportion</b>Si \(A\) représente une proportion \(p_1\) de \(E\), et \(B\) une proportion \(p_2\) de \(A\), alors \(B\) représente une proportion \(p_1 \times p_2\) de \(E\).</div>
<div class="exemple"><b>Exemple</b>60 % des salariés d'une entreprise sont des femmes ; 15 % d'entre elles sont cadres. Quelle proportion des salariés sont des femmes cadres ?
<div class="sol">\(0{,}6 \times 0{,}15 = 0{,}09\), soit 9 % des salariés.</div></div>
<div class="prop"><b>Réunion de deux sous-populations</b>Si \(A\) et \(B\) sont deux sous-populations de \(E\) : \(p_{A \cup B} = p_A + p_B - p_{A \cap B}\). Si elles sont disjointes, \(p_{A \cup B} = p_A + p_B\).</div>
<div class="piege"><b>Piège</b>On n'additionne pas des pourcentages qui portent sur des populations différentes : 20 % des filles et 30 % des garçons ne font pas « 50 % des élèves ».</div>
</div>
<div class="section"><h3>Taux d'évolution et coefficient multiplicateur</h3>
<div class="def"><b>Définition</b>Quand une grandeur passe d'une valeur de départ \(V_D\) à une valeur d'arrivée \(V_A\) (avec \(V_D \ne 0\)) :
<ul><li>la variation absolue est \(V_A - V_D\) ;</li>
<li>le taux d'évolution (variation relative) est \(t = \dfrac{V_A - V_D}{V_D}\) ;</li>
<li>le coefficient multiplicateur est \(CM = \dfrac{V_A}{V_D} = 1 + t\).</li></ul></div>
<div class="table-scroll"><table class="tbl c">
<tr><th>Évolution</th><th>Coefficient multiplicateur</th></tr>
<tr><td>Hausse de 15 %</td><td>\(1 + 0{,}15 = 1{,}15\)</td></tr>
<tr><td>Baisse de 15 %</td><td>\(1 - 0{,}15 = 0{,}85\)</td></tr>
<tr><td>Hausse de 100 % (doublement)</td><td>\(2\)</td></tr>
<tr><td>Baisse de 50 % (division par 2)</td><td>\(0{,}5\)</td></tr>
</table></div>
<div class="aretenir"><b>À retenir</b>\(CM > 1\) : hausse ; \(CM < 1\) : baisse. Pour retrouver le taux : \(t = CM - 1\).</div>
<div class="exemple"><b>Exemple</b>Un loyer passe de 650 € à 676 €. \(t = \frac{676 - 650}{650} = \frac{26}{650} = 0{,}04\) : hausse de 4 %.</div>
</div>
<div class="section"><h3>Évolutions successives et réciproques</h3>
<div class="prop"><b>Évolutions successives</b>Si une grandeur subit des évolutions de coefficients \(CM_1\), \(CM_2\), …, \(CM_n\), le coefficient global est \(CM = CM_1 \times CM_2 \times \dots \times CM_n\).</div>
<div class="exemple"><b>Exemple</b>Hausse de 20 % puis baisse de 20 % : \(1{,}2 \times 0{,}8 = 0{,}96\). Globalement, c'est une <b>baisse de 4 %</b>, pas une stabilité.</div>
<div class="prop"><b>Évolution réciproque</b>L'évolution qui ramène à la valeur de départ a pour coefficient \(\dfrac{1}{CM}\).</div>
<div class="exemple"><b>Exemple</b>Après une baisse de 20 % (\(CM = 0{,}8\)), il faut une hausse de coefficient \(\frac{1}{0{,}8} = 1{,}25\), soit <b>+25 %</b>, pour revenir au prix initial.</div>
<div class="methode"><b>Méthode : retrouver une valeur de départ</b>\(V_D = \dfrac{V_A}{CM}\). Un article soldé à −30 % coûte 56 € : son prix initial était \(\frac{56}{0{,}7} = 80\) €.</div>
<div class="piege"><b>Piège</b>Les taux ne s'ajoutent pas : deux hausses de 10 % font \(1{,}1^2 = 1{,}21\), soit +21 % et non +20 %.</div>
</div>
<div class="section"><h3>Indices base 100</h3>
<div class="def"><b>Définition</b>Si une grandeur vaut \(V_0\) à une date de référence et \(V\) à une autre date, l'indice de \(V\) base 100 est \(I = \dfrac{V}{V_0} \times 100\).</div>
<div class="exemple"><b>Exemple</b>Le prix d'un panier passe de 80 € (en 2020, base 100) à 92 € en 2026. Indice en 2026 : \(\frac{92}{80} \times 100 = 115\) : le prix a augmenté de 15 % depuis 2020.</div>
<div class="astuce"><b>Lecture rapide</b>Un indice de 115 signifie +15 % par rapport à la date de référence ; un indice de 87 signifie −13 %. Mais entre deux dates autres que la référence, il faut recalculer : passer de l'indice 110 à l'indice 121 correspond à \(\frac{121}{110} = 1{,}1\), soit +10 % (et non +11 %).</div>
</div>`,

<div class="section"><h3>Tableaux croisés d'effectifs</h3>
<p>On étudie deux caractères sur une même population, par exemple le moyen de transport et le niveau de classe.</p>
<div class="table-scroll"><table class="tbl c"><tr><th></th><th>Bus</th><th>Vélo</th><th>À pied</th><th>Total</th></tr>
<tr><td><b>Seconde</b></td><td>90</td><td>30</td><td>80</td><td>200</td></tr>
<tr><td><b>Première</b></td><td>70</td><td>50</td><td>60</td><td>180</td></tr>
<tr><td><b>Terminale</b></td><td>60</td><td>40</td><td>20</td><td>120</td></tr>
<tr><td><b>Total</b></td><td>220</td><td>120</td><td>160</td><td>500</td></tr></table></div>
<div class="def"><b>Fréquences</b>
<ul><li>Fréquence <b>marginale</b> : un total de ligne ou de colonne divisé par l'effectif total. Exemple : la fréquence des cyclistes est \(\frac{120}{500} = 0{,}24\).</li>
<li>Fréquence <b>conditionnelle</b> : une case divisée par le total de sa ligne (ou de sa colonne). Exemple : parmi les premières, la fréquence des cyclistes est \(\frac{50}{180} \approx 0{,}28\) ; parmi les cyclistes, la fréquence des premières est \(\frac{50}{120} \approx 0{,}42\).</li></ul></div>
<div class="methode"><b>Méthode</b>Repère dans la question le mot « parmi » : c'est lui qui indique sur quel total diviser.</div>
<div class="piege"><b>Piège</b>« La fréquence des premières parmi les cyclistes » et « la fréquence des cyclistes parmi les premières » ne sont pas égales : le dénominateur change.</div>
</div>
<div class="section"><h3>Nuage de points et point moyen</h3>
<div class="def"><b>Définition</b>Une série statistique à deux variables est une liste de couples \((x_i\,;y_i)\). On la représente par un <b>nuage de points</b> \(M_i(x_i\,;y_i)\). Le <b>point moyen</b> est \(G(\bar x\,;\bar y)\), où \(\bar x\) et \(\bar y\) sont les moyennes des \(x_i\) et des \(y_i\).</div>
<div class="exemple"><b>Exemple</b>Nombre d'heures de révision \(x\) et note obtenue \(y\) pour 5 élèves :
<div class="table-scroll"><table class="tbl c"><tr><th>\(x_i\)</th><td>1</td><td>2</td><td>4</td><td>5</td><td>8</td></tr><tr><th>\(y_i\)</th><td>7</td><td>9</td><td>11</td><td>13</td><td>15</td></tr></table></div>
${graph({xmin:-0.5, xmax:9, ymin:-1, ymax:18, w:330, h:250, stepX:1, stepY:2, labelY:4, fns:[{f:x => 1.1 * x + 6.6, cls:"g-c2"}], pts:[[1, 7], [2, 9], [4, 11], [5, 13], [8, 15], {x:4, y:11, cls:"g-pt2", r:5.5, t:"G", dx:-16, dy:-8}], alt:"Nuage de points et droite d'ajustement"})}
<div class="sol">\(\bar x = \frac{1 + 2 + 4 + 5 + 8}{5} = 4\) et \(\bar y = \frac{7 + 9 + 11 + 13 + 15}{5} = 11\) : \(G(4\,;11)\).</div></div>
</div>
<div class="section"><h3>Ajustement affine</h3>
<p>Quand les points du nuage semblent à peu près alignés, on peut modéliser la relation par une fonction affine \(y = ax + b\) : c'est un <b>ajustement affine</b>. La droite d'ajustement est choisie pour passer « au plus près » des points ; on lui demande en général de passer par le point moyen \(G\).</p>
<div class="exemple"><b>Exemple (suite)</b>On admet que la droite \(d\) d'équation \(y = 1{,}1x + 6{,}6\) est une bonne droite d'ajustement du nuage (tracée en bleu). Elle passe bien par \(G\) : \(1{,}1 \times 4 + 6{,}6 = 11\).
<div class="sol">Estimation pour 6 heures de révision : \(y = 1{,}1 \times 6 + 6{,}6 = 13{,}2\). Prévision pour 15 heures : \(1{,}1 \times 15 + 6{,}6 = 23{,}1\), impossible pour une note sur 20 : l'extrapolation loin des données n'a pas de sens.</div></div>
<div class="methode"><b>Méthode : utiliser un ajustement</b>
<ol class="steps"><li>Vérifier que le nuage a une forme allongée (sinon, un ajustement affine n'est pas pertinent).</li>
<li>Utiliser l'équation donnée par l'énoncé (ou la déterminer avec deux points, par exemple \(G\) et un autre point).</li>
<li>Pour une estimation, remplacer \(x\) par la valeur voulue ; pour trouver \(x\) connaissant \(y\), résoudre une équation du premier degré.</li>
<li>Interpréter et critiquer : l'extrapolation est d'autant moins fiable qu'on s'éloigne des données.</li></ol></div>
<div class="aretenir"><b>Corrélation et causalité</b>Deux grandeurs peuvent évoluer ensemble (corrélation) sans que l'une soit la cause de l'autre : les ventes de glaces et le nombre de coups de soleil augmentent ensemble, mais c'est le soleil qui explique les deux.</div>
</div>`,

<div class="section"><h3>Du tableau croisé aux probabilités</h3>
<p>Quand on choisit un individu <b>au hasard</b> dans une population, les fréquences du tableau croisé deviennent des probabilités.</p>
<div class="exemple"><b>Exemple</b>Sur 400 clients d'un magasin, on relève le mode de paiement et le montant des achats.
<div class="table-scroll"><table class="tbl c"><tr><th></th><th>Carte (C)</th><th>Espèces (\(\bar C\))</th><th>Total</th></tr>
<tr><td><b>Plus de 50 € (M)</b></td><td>120</td><td>20</td><td>140</td></tr>
<tr><td><b>50 € ou moins (\(\bar M\))</b></td><td>160</td><td>100</td><td>260</td></tr>
<tr><td><b>Total</b></td><td>280</td><td>120</td><td>400</td></tr></table></div>
<div class="sol">\(P(C) = \frac{280}{400} = 0{,}7\) ; \(P(C \cap M) = \frac{120}{400} = 0{,}3\) ; \(P_M(C) = \frac{120}{140} = \frac67\) ; \(P_C(M) = \frac{120}{280} = \frac37\).</div></div>
<div class="def"><b>Définition</b>Si \(P(A) \ne 0\), la probabilité de \(B\) sachant \(A\) est \(P_A(B) = \dfrac{P(A \cap B)}{P(A)}\). Donc \(P(A \cap B) = P(A) \times P_A(B)\).</div>
<div class="piege"><b>Piège</b>\(P_M(C)\) (« parmi les gros achats, la part de paiements par carte ») n'est pas \(P_C(M)\) (« parmi les paiements par carte, la part des gros achats »).</div>
</div>
<div class="section"><h3>Arbres pondérés</h3>
${tree({b:[{t:"A", p:"P(A)", s:[{t:"B", p:"P_A(B)"}, {t:"B̅", p:"P_A(B̅)"}]}, {t:"A̅", p:"P(A̅)", s:[{t:"B", p:"P_A̅(B)"}, {t:"B̅", p:"P_A̅(B̅)"}]}]})}
<div class="prop"><b>Règles de calcul</b>
<ol class="steps"><li>Les probabilités des branches issues d'un même nœud ont pour somme 1.</li>
<li>La probabilité d'un chemin est le produit des probabilités de ses branches : \(P(A \cap B) = P(A) \times P_A(B)\).</li>
<li>La probabilité d'un événement est la somme des probabilités des chemins qui y mènent : \(P(B) = P(A \cap B) + P(\bar A \cap B)\) (probabilités totales).</li></ol></div>
<div class="exemple"><b>Exemple</b>Dans un lycée, 55 % des élèves sont des filles. 40 % des filles et 30 % des garçons font partie d'une association sportive (S). On choisit un élève au hasard.
<div class="sol">${tree({b:[{t:"F", p:"0,55", s:[{t:"S", p:"0,4"}, {t:"S̅", p:"0,6"}]}, {t:"F̅", p:"0,45", s:[{t:"S", p:"0,3"}, {t:"S̅", p:"0,7"}]}]})}
\(P(F \cap S) = 0{,}55 \times 0{,}4 = 0{,}22\) ; \(P(\bar F \cap S) = 0{,}45 \times 0{,}3 = 0{,}135\).<br>
\(P(S) = 0{,}22 + 0{,}135 = 0{,}355\).<br>
Sachant que l'élève fait du sport, probabilité que ce soit une fille : \(P_S(F) = \frac{0{,}22}{0{,}355} = \frac{220}{355} = \frac{44}{71} \approx 0{,}62\).</div></div>
</div>
<div class="section"><h3>Indépendance de deux événements</h3>
<div class="def"><b>Définition</b>\(A\) et \(B\) sont <b>indépendants</b> si \(P(A \cap B) = P(A) \times P(B)\). Lorsque \(P(A) \ne 0\), cela revient à \(P_A(B) = P(B)\) : savoir que \(A\) est réalisé ne modifie pas la probabilité de \(B\).</div>
<div class="exemple"><b>Exemple</b>Dans le tableau du magasin : \(P(C) \times P(M) = 0{,}7 \times 0{,}35 = 0{,}245\), alors que \(P(C \cap M) = 0{,}3\). Les événements \(C\) et \(M\) ne sont pas indépendants.</div>
<div class="piege"><b>Piège</b>Indépendants ne veut pas dire incompatibles. Deux événements incompatibles (qui ne peuvent pas se produire en même temps) et de probabilités non nulles ne sont jamais indépendants.</div>
</div>
<div class="section"><h3>Répétition d'épreuves de Bernoulli</h3>
<div class="def"><b>Définition</b>Une <b>épreuve de Bernoulli</b> est une expérience aléatoire à deux issues : « succès » (probabilité \(p\)) et « échec » (probabilité \(1 - p\)).</div>
<p>Quand on répète \(n\) fois la même épreuve de Bernoulli, de façon <b>identique et indépendante</b> (par exemple des lancers successifs, ou des tirages avec remise), on construit un arbre à \(n\) niveaux. Au programme : jusqu'à 4 épreuves.</p>
<div class="prop"><b>Propriété</b>La probabilité d'un chemin comportant \(k\) succès et \(n - k\) échecs est \(p^k(1 - p)^{n - k}\). Pour obtenir la probabilité de « exactement \(k\) succès », on compte les chemins correspondants et on multiplie.</div>
<div class="exemple"><b>Exemple</b>Un joueur réussit un lancer franc avec une probabilité \(0{,}7\). Il en tire 3, de manière indépendante.
<div class="sol"><ul><li>Trois réussites : \(0{,}7^3 = 0{,}343\).</li>
<li>Aucune réussite : \(0{,}3^3 = 0{,}027\).</li>
<li>Au moins une réussite : \(1 - 0{,}027 = 0{,}973\).</li>
<li>Exactement 2 réussites : 3 chemins (RRÉ, RÉR, ÉRR), chacun de probabilité \(0{,}7^2 \times 0{,}3 = 0{,}147\) ; total \(3 \times 0{,}147 = 0{,}441\).</li></ul></div></div>
<div class="astuce"><b>Astuce</b>Vérification : \(P(0) + P(1) + P(2) + P(3) = 0{,}027 + 0{,}189 + 0{,}441 + 0{,}343 = 1\).</div>
</div>`,

<li>Fonction affine \(f(x) = ax + b\) : la variation \(f(x_2) - f(x_1) = a(x_2 - x_1)\) est proportionnelle à l'écart \(x_2 - x_1\).</li>

<div class="section"><h3>Suites arithmétiques</h3>
<div class="def"><b>Définition</b>Une suite \((u_n)\) est arithmétique de raison \(r\) si l'on passe d'un terme au suivant en ajoutant toujours \(r\) : \(u_{n+1} = u_n + r\) pour tout entier \(n\).</div>
<div class="prop"><b>Terme général</b>\(u_n = u_0 + n \times r\). Si le premier terme est \(u_1\) : \(u_n = u_1 + (n - 1) \times r\).</div>
<div class="exemple"><b>Exemple</b>Un abonnement coûte 30 € le premier mois, puis le prix augmente de 2 € chaque mois. On note \(u_1 = 30\) et \(u_n\) le prix du \(n\)-ième mois.
<div class="sol">\((u_n)\) est arithmétique de raison 2 : \(u_n = 30 + 2(n - 1)\). Le 12<sup>e</sup> mois : \(u_{12} = 30 + 22 = 52\) €.</div></div>
<div class="methode"><b>Méthode : reconnaître une suite arithmétique</b>
<ul><li>Dans un énoncé : « augmente (ou diminue) de … unités chaque année » (une quantité fixe, pas un pourcentage).</li>
<li>Avec des termes : calculer les différences \(u_1 - u_0\), \(u_2 - u_1\), … : elles doivent être égales.</li>
<li>Avec une formule : montrer que \(u_{n+1} - u_n\) est constant.</li></ul></div>
<div class="prop"><b>Sens de variation</b>Si \(r > 0\), la suite est croissante ; si \(r < 0\), décroissante ; si \(r = 0\), constante.</div>
</div>
<div class="section"><h3>Représentation graphique et lien avec les fonctions affines</h3>
${graph({xmin:-0.5, xmax:7.5, ymin:-1, ymax:12, w:320, h:240, stepX:1, stepY:1, labelY:2, fns:[{f:x => 1.5 * x + 2, cls:"g-dash"}], pts:[0, 1, 2, 3, 4, 5, 6, 7].map(n => [n, 1.5 * n + 2]), alt:"Termes d'une suite arithmétique alignés"})}
<p>Les points de coordonnées \((n\,;u_n)\) d'une suite arithmétique sont <b>alignés</b> sur la droite d'équation \(y = rx + u_0\) : c'est une <b>croissance linéaire</b> (ci-dessus, \(u_0 = 2\) et \(r = 1{,}5\)).</p>
<div class="prop"><b>Fonctions affines</b>Une fonction affine \(f(x) = ax + b\) est représentée par une droite de coefficient directeur \(a\) et d'ordonnée à l'origine \(b\). Pour tous réels \(x_1 \ne x_2\) : \(a = \dfrac{f(x_2) - f(x_1)}{x_2 - x_1}\).</div>
<div class="aretenir"><b>À retenir</b>Une suite arithmétique, c'est une fonction affine « regardée seulement aux nombres entiers » : \(u_n = f(n)\) avec \(f(x) = rx + u_0\).</div>
</div>
<div class="section"><h3>Problèmes de croissance linéaire</h3>
<div class="exemple"><b>Exemple : comparer deux offres</b>Offre A : 50 € puis 8 € par séance. Offre B : 15 € par séance. À partir de combien de séances l'offre A est-elle plus avantageuse ?
<div class="sol">Coût pour \(n\) séances : \(A(n) = 50 + 8n\) et \(B(n) = 15n\). \(A(n) < B(n) \iff 50 < 7n \iff n > \frac{50}{7} \approx 7{,}1\). L'offre A est plus avantageuse à partir de 8 séances.</div></div>
<div class="exemple"><b>Exemple : retrouver la raison</b>\((u_n)\) est arithmétique avec \(u_3 = 17\) et \(u_8 = 42\). Alors \(5r = 42 - 17 = 25\), donc \(r = 5\) et \(u_0 = u_3 - 3r = 2\).</div>
<div class="prop"><b>Somme de termes (complément utile)</b>Somme de termes consécutifs d'une suite arithmétique = nombre de termes \(\times \dfrac{\text{premier} + \text{dernier}}{2}\).</div>
<div class="piege"><b>Piège</b>Bien repérer le premier terme : \(u_0\) ou \(u_1\) ? Avec \(u_1\), la formule devient \(u_n = u_1 + (n - 1)r\).</div>
</div>`,
